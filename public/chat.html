<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/style.css">

<body>
<div class="shell">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-area chatm">
  <div class="ct" id="ct">
    <section class="ct-rail"><div class="ct-rh"><h1>Le <em>chat.</em></h1><label class="ct-se"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Rechercher un salon, une personne"></label></div>

<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, MOB = () => innerWidth < 900;
let B = null, CUR = null, MSGS = [], TH = null, THM = [], USERS = {}, PINS = [], NEWAT = 0, TYP = {}, SEEN = 0, LOADING = false;
const IC = { plus: '<path d="M12 5v14M5 12h14"/>', send: '<path d="M5 12h13M13 6l6 6-6 6"/>', mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', smile: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/>',
  reply: '<path d="M10 8 5 12l5 4"/><path d="M5 12h9a5 5 0 0 1 5 5v1"/>', thread: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M8 10h8M8 14h5"/>', more: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
  pin: '<path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/>', play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/>', pause: '<path d="M8 5v14M16 5v14" stroke-width="3"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>' };
const svg = (p, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
// rond d'un membre : sa photo de profil, sinon sa couleur, sinon une couleur tirée de son nom
let UBN = {};
const av = (name, st, cls = "") => { const u = UBN[String(name || "").toLowerCase()], ini = esc(((u && u.name) || name || "?")[0]), dot = st ? `<i class="${st}"></i>` : "";
  if (u && u.avatar) return `<span class="ct-av ph ${cls}" style="background:#111 url(${esc(u.avatar)}) center/cover;--ac:${esc(u.color || "#3a3a3a")}">${dot}</span>`;
  if (u && u.color) return `<span class="ct-av ${cls}" style="background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 62%),color-mix(in srgb,${esc(u.color)} 55%,#1a1a1a);color:#fff">${ini}${dot}</span>`;
  return `<span class="ct-av ${cls}" style="background:linear-gradient(135deg,hsl(${hue(name)} 70% 72%),hsl(${(hue(name) + 40) % 360} 70% 60%))">${ini}${dot}</span>`; };
const nameOf = (uid, fb) => (USERS[uid] && USERS[uid].name) || fb;
const tm = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const dayL = t => { const d = new Date(t), td = new Date(); if (d.toDateString() === td.toDateString()) return "Aujourd'hui"; if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return "Hier"; return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }); };
const ST_LBL = { shift: "en shift", pause: "en pause", online: "en ligne", offline: "hors ligne" };
function fmt(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\s)_([^_]+)_(?=\s|$)/g, "$1<i>$2</i>");
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/@([\wÀ-ÿ.\-]+)/g, (m, n) => { const me = n.toLowerCase() === B.me.username.toLowerCase() || n === "tous" || (n === "shift" && USERS[B.me.id]?.status === "shift"); return `<span class="mn ${me ? "me" : ""}">@${n}</span>`; });
  return h;
}
const onlyEmoji = s => s && s.length <= 12 && /^(\p{Extended_Pictographic}|\p{Emoji_Component}|\s|‍|️)+$/u.test(s);

/* =============== rail =============== */
function renderRail() {
  const q = $("q").value.trim().toLowerCase(), C = B.channels.filter(c => !q || c.name.toLowerCase().includes(q));
  const strip = t => String(t || "").replace(/\*\*|__|`/g, "");
  const row = c => { const st = c.kind === "dm" && c.other ? USERS[c.other.id]?.status : null;
    return `<button class="ct-ch ${c.id === CUR ? "on" : ""} ${c.unread ? "un" : ""} ${c.slug === "informations" ? "prio" : ""}" data-c="${c.id}">${c.kind === "dm" ? av(c.name, st) : `<span class="e">${esc(c.emoji || "#")}</span>`}
      <span class="n">${c.kind === "dm" ? esc(c.name) : esc(c.name)}${c.kind === "dm" ? `<small>${st ? ST_LBL[st] : ""}${c.last ? " · " + esc(strip(c.last.body)) : ""}</small>` : c.last && c.unread ? `<small>${esc(c.last.username || "")}${c.last.username ? " : " : ""}${esc(strip(c.last.body))}</small>` : ""}</span>
      ${c.mentions ? `<span class="b m">@${c.mentions}</span>` : c.unread ? `<span class="b">${c.unread > 99 ? "99+" : c.unread}</span>` : ""}</button>`; };
  const pr = C.filter(c => c.slug === "informations"), pub = C.filter(c => c.kind === "public" && c.slug !== "informations"), mo = C.filter(c => c.kind === "model"), tr = C.filter(c => c.kind === "training"), TR = B.me.role === "trainee", dm = C.filter(c => c.kind === "dm").sort((a, b) => (b.last?.at || 0) - (a.last?.at || 0));
  $("rail").innerHTML = TR ? `<div class="ct-sec">Formation</div>${tr.map(row).join("")}<div style="font-size:12.5px;color:#666;padding:8px 10px;line-height:1.45">Le salon des élèves et des managers. Le reste du chat s'ouvre quand tu deviens chatter.</div>`
    : `${pr.length ? `<div class="ct-sec">Prioritaire</div>${pr.map(row).join("")}` : ""}<div class="ct-sec">Salons</div>${pub.map(row).join("")}<div id="vcRail"></div>
    ${tr.length ? `<div class="ct-sec">Formation · élèves et managers</div>${tr.map(row).join("")}` : ""}
    ${mo.length ? `<div class="ct-sec">Créatrices</div>${mo.map(row).join("")}` : ""}<div class="ct-sec">Messages privés <button id="newDm" aria-label="Nouveau message privé">+</button></div>${dm.map(row).join("") || `<div style="font-size:12.5px;color:#555;padding:4px 10px">Aucune conversation privée</div>`}`;
  $("rail").querySelectorAll("[data-c]").forEach(b => b.onclick = () => openCh(+b.dataset.c));
  if ($("newDm")) $("newDm").onclick = dmSheet;
  updateBadge(B.channels.reduce((t, c) => t + c.unread, 0), "chat");
  VC.paint();
}
/* =============== salon vocal (l'appel vit dans sa petite fenêtre, ici on l'affiche et on le pilote) =============== */
const VC = (() => {
  let people = [], live = { on: false }, seen = 0, bc = null;
  const MIC = '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
    MICX = '<path d="M3 3l18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M19 11a7 7 0 0 1-1.2 3.9M5 11a7 7 0 0 0 11.2 5.6M12 18v3"/>',
    HEAD = '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15h3v5H5a1 1 0 0 1-1-1zM20 15h-3v5h2a1 1 0 0 0 1-1z"/>',
    HEADX = '<path d="M3 3l18 18M4 15v-3a8 8 0 0 1 12.6-6.5M20 12v3"/><path d="M4 15h3v5H5a1 1 0 0 1-1-1zM17 17v3h2a1 1 0 0 0 1-1v-2"/>',
    OUT = '<path d="M10 14l2-2-2-2M12 12H3M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>', WIN = '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
    SCR = '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>';
  const ic = (p, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const amIn = () => live.on && Date.now() - seen < 15e3;
  function paint() {
    const r = document.getElementById("vcRail"); if (!r || !B || B.me.role === "trainee") return;
    const talk = amIn() ? (live.talk || []) : [], n = people.length;
    r.innerHTML = `<button class="ct-ch vc-ch ${amIn() ? "in" : ""}" id="vcJoin" title="${amIn() ? "Ouvrir la fenêtre du vocal" : "Rejoindre le salon vocal"}"><span class="e">🔊</span>
        <span class="n">Salon vocal<small>${n ? `${n} connecté${n > 1 ? "s" : ""}` : "Personne pour l'instant"}</small></span>${amIn() ? `<span class="b vc-live">EN DIRECT</span>` : ""}</button>
      ${n ? `<div class="vc-ppl">${people.map(p => `<div class="vc-p ${talk.includes(p.id) ? "talk" : ""}"><span class="a" style="--c:${esc(p.color || "#3a3a3a")};${p.avatar ? `background-image:url(${esc(p.avatar)});font-size:0` : ""}">${esc((p.name || "?")[0].toUpperCase())}</span>
        <span class="t">${esc(p.name)}</span>${p.sharing ? `<span class="s" title="Partage son écran">${ic(SCR, 13)}</span>` : ""}${p.deaf ? `<span class="m" title="Son coupé">${ic(HEADX, 13)}</span>` : p.muted ? `<span class="m" title="Micro coupé">${ic(MICX, 13)}</span>` : ""}</div>`).join("")}</div>` : ""}`;
    document.getElementById("vcJoin").onclick = () => window.openVoice && openVoice();
    const bar = document.getElementById("vcBar"); bar.hidden = !amIn();
    if (amIn()) {
      bar.innerHTML = `<div class="i"><b><i></i>Connecté au vocal</b><small>${live.count || 1} en ligne · ${live.ptt ? "push-to-talk" : "micro ouvert"}</small></div>
        <button data-v="mute" class="${live.muted ? "off" : ""}" title="${live.muted ? "Activer le micro" : "Couper le micro"}">${ic(live.muted ? MICX : MIC)}</button>
        <button data-v="deaf" class="${live.deaf ? "off" : ""}" title="${live.deaf ? "Remettre le son" : "Couper le son"}">${ic(live.deaf ? HEADX : HEAD)}</button>
        <button data-v="open" title="Ouvrir la fenêtre du vocal">${ic(WIN)}</button>
        <button data-v="leave" class="red" title="Quitter le vocal">${ic(OUT)}</button>`;
      bar.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const v = b.dataset.v;
        if (v === "open") return window.openVoice && openVoice();
        if (v === "leave") { const st = USERS[B.me.id]?.status; if ((st === "shift" || st === "pause") && !confirm("Le vocal est obligatoire pendant ton shift. Quitter quand même ?")) return; }
        try { bc && bc.postMessage({ cmd: v }); } catch (e) {} });
    }
  }
  async function poll() { if (document.hidden || !B || B.me.role === "trainee") return; try { const r = await api("/api/voice/presence"); people = r.people || []; } catch (e) {} paint(); }
  try { bc = new BroadcastChannel("stellads-voice"); bc.onmessage = e => { const d = e.data || {}; if (!("on" in d)) return;
    const was = live; live = d; seen = Date.now(); if (!d.on || was.count !== d.count || was.muted !== d.muted || was.deaf !== d.deaf) poll(); else paint(); }; } catch (e) {}
  setInterval(poll, 5000); setInterval(() => { if (live.on && Date.now() - seen > 15e3) { live = { on: false }; paint(); } }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  return { paint, start() { poll(); try { bc && bc.postMessage({ cmd: "ping" }); } catch (e) {} } };
})();
const chan = id => B.channels.find(c => c.id === id);

/* =============== salon =============== */
async function openCh(id, keepThread) {
  const c = chan(id); if (!c) return; CUR = id; if (!keepThread) closeThread(true);
  try { history.replaceState(null, "", "/chat?c=" + id); } catch (e) {}
  NEWAT = c.unread ? -1 : 0; const firstUnread = c.unread;
  $("ct").classList.add("open"); document.body.classList.add("chat-in");
  const live = B.users.filter(u => u.status === "shift" || u.status === "pause");
  $("main").innerHTML = `<header class="ct-hd"><button class="bk" id="bk" aria-label="Retour">‹</button>${c.kind === "dm" ? av(c.name, USERS[c.other?.id]?.status) : `<span class="ct-ch" style="width:auto;padding:0;pointer-events:none"><span class="e">${esc(c.emoji)}</span></span>`}
      <div class="ti"><b>${c.kind === "dm" ? "" : "#"}${esc(c.name)}${c.readonly ? `<span class="ro">MANAGERS</span>` : ""}</b><small>${c.kind === "dm" ? (ST_LBL[USERS[c.other?.id]?.status] || "") : esc(c.topic || "")}</small></div>
      ${c.kind !== "dm" && live.length ? `<div class="ct-stk" title="En shift maintenant">${live.slice(0, 5).map(u => av(u.username, u.status)).join("")}${live.length > 5 ? `<span class="more">+${live.length - 5}</span>` : ""}</div>` : ""}
      <button class="ct-hb" id="pinsB" title="Messages épinglés">${svg(IC.pin)}<em id="pinN" hidden></em></button></header>
    <div id="pinBox"></div><div class="ct-sc" id="sc"></div><div class="ct-ty" id="ty"></div>${B.me.muted && B.me.muted > Date.now() ? `<div class="ct-mute">🔇 Tu es en sourdine jusqu'à ${tm(B.me.muted)}</div>` : ""}<div id="cpW"></div>`;
  $("bk").onclick = () => { $("ct").classList.remove("open"); document.body.classList.remove("chat-in"); CUR = null; renderRail(); };
  $("pinsB").onclick = () => { const p = $("pinBox").firstElementChild; if (p) p.scrollIntoView({ behavior: "smooth" }); else notify("Aucun message épinglé", "", "info"); };
  $("cpW").innerHTML = c.canWrite ? composerHTML("m") : `<div class="ct-ro">📣 Seuls les managers peuvent écrire dans #${esc(c.name)}</div>`;
  if (c.canWrite) { bindComposer("m"); if (c.readonly) { ANN_LV = "normal"; bindLevel(); } }
  renderRail(); MSGS = []; $("sc").innerHTML = `<div class="ct-empty" style="height:auto;padding:40px"><span class="ct-ty on" style="opacity:1"><i></i><i></i><i></i></span></div>`;
  const d = await api(`/api/chat/c/${id}/messages`); if (CUR !== id) return; MSGS = d.messages; PINS = d.pins;
  if (firstUnread) { const idx = MSGS.length - firstUnread; NEWAT = MSGS[idx] ? MSGS[idx].id : 0; }
  paintPins(); paintMsgs(true, d.more); markRead();
  if (c.kind === "dm") api(`/api/chat/c/${id}/seen`).then(r => { SEEN = r.last_id || 0; paintSeen(); }).catch(() => {});
}
function paintPins() {
  const c = chan(CUR), box = $("pinBox"); if (!box) return; const p = PINS[0]; $("pinN").hidden = !PINS.length; $("pinN").textContent = PINS.length;
  if (!p || (c.slug !== "informations" && !p.meta?.announce)) { box.innerHTML = ""; return; }
  const a = p.acks || { n: 0, of: 1, me: false, who: [] }, C2 = 2 * Math.PI * 10;
  box.innerHTML = `<div class="ct-pin" data-id="${p.id}"><div class="k">📌 Annonce · ${esc(p.username || "")} · ${dayL(p.created_at).toLowerCase()} ${tm(p.created_at)}</div><div class="tx" id="pinTx">${fmt(p.body)}</div>
    <div class="ft"><span class="ct-ack" title="${esc(a.who.map(w => w.username).join(", "))}"><svg viewBox="0 0 26 26"><circle class="b" cx="13" cy="13" r="10"/><circle class="f" cx="13" cy="13" r="10" stroke-dasharray="${C2}" stroke-dashoffset="${C2}" data-o="${C2 * (1 - Math.min(1, a.n / Math.max(1, a.of)))}"/></svg>Lu par ${a.n} / ${a.of}</span>
      ${B.me.role === "admin" ? `<button class="ct-ackb done" id="ackB">Voir qui l'a lu</button>` : `<button class="ct-ackb ${a.me ? "done" : ""}" id="ackB">${a.me ? "✓ Lu" : "J'ai lu"}</button>`}</div></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const f = box.querySelector(".f"); if (f) f.style.strokeDashoffset = f.dataset.o; }));
  $("pinTx").onclick = () => $("pinTx").classList.toggle("open");
  $("ackB").onclick = async () => { if (B.me.role === "admin") return readsPanel(p.id); if (a.me) return; await api(`/api/chat/m/${p.id}/ack`, { body: {} }); burstAt($("ackB"), ["✓", "✨", "👍"]); };
  if (B.me.role === "admin") $("pinBox").querySelector(".ct-ack").onclick = () => readsPanel(p.id);
}
// suivi de lecture d'une annonce (manager) : qui a lu, qui n'a pas lu, relance
async function readsPanel(id) {
  let d; try { d = await api(`/api/admin/announcements/${id}/reads`); } catch (e) { return notify("Impossible", e.message, "err"); }
  document.querySelector(".ct-rd")?.remove();
  const C = 2 * Math.PI * 38, n = d.read.length, of = Math.max(d.of, n), ago = t => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); return m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m / 60)} h` : `${Math.floor(m / 1440)} j`; };
  const ov = document.createElement("div"); ov.className = "ct-rd"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Suivi de lecture");
  ov.innerHTML = `<div class="ct-rdp"><button class="x" aria-label="Fermer">✕</button><div class="k">SUIVI DE LECTURE${d.level !== "normal" ? ` · <span class="${d.level}">${d.level === "urgent" ? "URGENTE" : "IMPORTANTE"}</span>` : ""}</div><p class="q">${esc(d.body.slice(0, 160))}${d.body.length > 160 ? "…" : ""}</p>
    <div class="hd"><div class="ring"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="38" class="b"/><circle cx="46" cy="46" r="38" class="f" style="stroke-dasharray:${C};stroke-dashoffset:${C}" data-o="${C * (1 - n / Math.max(1, of))}" transform="rotate(-90 46 46)"/></svg><b>${n}/${of}</b></div>
      <div><b class="t">${d.unread.length ? `${d.unread.length} chatter${d.unread.length > 1 ? "s ne l'ont" : " ne l'a"} pas lue` : "Tout le monde l'a lue"}</b><small>${d.unread.filter(u => u.live).length ? `dont ${d.unread.filter(u => u.live).length} en shift en ce moment` : ""}</small></div></div>
    ${d.unread.length ? `<button class="rl" id="rdRem">Relancer ${d.unread.length > 1 ? "les " + d.unread.length : ""} par notification</button>` : ""}
    ${d.unread.length ? `<div class="s">PAS ENCORE LU</div><div class="ls">${d.unread.map(u => `<div class="u">${av(u.username)}<div><b>${esc(u.username)}</b><small>${u.live ? `En shift sur ${esc(u.live.model)}` : "Hors shift"}</small></div><i class="${u.live ? "on" : ""}"></i></div>`).join("")}</div>` : ""}
    ${n ? `<div class="s">LU</div><div class="ch">${d.read.map(r => `<span>${esc(r.username)} · ${ago(r.at)}</span>`).join("")}</div>` : ""}</div>`;
  document.body.appendChild(ov); requestAnimationFrame(() => { ov.classList.add("on"); requestAnimationFrame(() => { const f = ov.querySelector(".f"); if (f) f.style.strokeDashoffset = f.dataset.o; }); });
  const close = () => { ov.classList.remove("on"); setTimeout(() => ov.remove(), 300); };
  ov.querySelector(".x").onclick = close; ov.addEventListener("click", e => { if (e.target === ov) close(); });
  const rb = ov.querySelector("#rdRem"); if (rb) rb.onclick = async () => { rb.disabled = true; try { const r = await api(`/api/admin/announcements/${id}/remind`, { body: {} }); notify("Relance envoyée", `${r.n} chatter${r.n > 1 ? "s" : ""} prévenu${r.n > 1 ? "s" : ""} dans les 30 s`, "ok"); rb.textContent = "Relance envoyée ✓"; } catch (e) { notify("Impossible", e.message, "err"); rb.disabled = false; } };
}
function paintMsgs(scroll, more) {
  const sc = $("sc"); if (!sc) return;
  sc.innerHTML = (more ? `<button class="ct-more" id="moreB">Messages plus anciens</button>` : "") + listHTML(MSGS, false) || `<div class="ct-empty"><b>${esc(chan(CUR).emoji)}</b>Aucun message pour l'instant.<br>Lance la conversation !</div>`;
  bindMsgs(sc, false);
  if (more) $("moreB").onclick = async () => { const h = sc.scrollHeight; const d = await api(`/api/chat/c/${CUR}/messages?before=${MSGS[0].id}`); MSGS = d.messages.concat(MSGS); paintMsgs(false, d.more); sc.scrollTop = sc.scrollHeight - h; };
  if (scroll) { const nw = sc.querySelector(".ct-new"); requestAnimationFrame(() => { sc.scrollTop = nw ? nw.offsetTop - 80 : sc.scrollHeight; }); }
  paintSeen();
}
function listHTML(list, inThread) {

    const a = new Audio("/api/chat/file/" + el.dataset.vo); a._el = el; AUD = a; a._reset = () => { paint(0); btn.innerHTML = svg(IC.play); lab.textContent = fmtS(dur); };
    a.onplay = () => btn.innerHTML = svg(IC.pause); a.onpause = () => btn.innerHTML = svg(IC.play); a.onended = () => { a._reset(); AUD = null; };
    a.ontimeupdate = () => { const D = isFinite(a.duration) ? a.duration : dur; paint(a.currentTime / D); lab.textContent = fmtS(Math.max(0, D - a.currentTime)); }; a.play().catch(() => notify("Lecture impossible", "", "err")); };
  el.querySelector(".wv").onclick = e => { if (!AUD || AUD._el !== el) return btn.click(); const r = e.currentTarget.getBoundingClientRect(); AUD.currentTime = (e.clientX - r.left) / r.width * (isFinite(AUD.duration) ? AUD.duration : dur); };
}

/* =============== fil de discussion =============== */
async function openThread(id) {
  TH = id; $("ct").classList.add("th"); const root = findMsg(id);
  $("thp").innerHTML = `<div class="hd"><div><b>Fil</b><small>#${esc(chan(CUR).name)}</small></div><button id="thX" aria-label="Fermer">✕</button></div><div class="ct-sc" id="tsc"></div><div class="ct-ty" id="tty"></div><div id="tcp"></div>`;
  $("thX").onclick = () => closeThread(); $("tcp").innerHTML = chan(CUR).canWrite || root?.kind === "sos" ? composerHTML("t") : ""; if ($("tat")) bindComposer("t");
  const d = await api(`/api/chat/c/${CUR}/messages?thread=${id}`); if (TH !== id) return; THM = d.messages; paintThread(true);
  if (root?.kind === "sos" && $("tat")) $("tat").placeholder = "Propose ta réponse au fan…";
}
function paintThread(scroll) {
  const sc = $("tsc"); if (!sc) return; const [r, ...rest] = THM;
  sc.innerHTML = (r ? `<div class="root">${msgHTML(r, null, true)}</div>` : "") + `<div class="ct-day" style="margin-top:6px">${rest.length} réponse${rest.length > 1 ? "s" : ""}</div>` + listHTML(rest, true); bindMsgs(sc, true);
  if (scroll) requestAnimationFrame(() => sc.scrollTop = sc.scrollHeight);
}
function closeThread(silent) { TH = null; THM = []; $("ct").classList.remove("th"); if (!silent) setTimeout(() => { if (!TH) $("thp").innerHTML = ""; }, 500); }

/* =============== temps réel =============== */
function insert(m, mine) {
  if (!m) return; const inTh = m.thread_root && m.thread_root === TH, inMain = m.channel_id === CUR && !m.thread_root;
  if (inTh) { if (THM.some(x => x.id === m.id)) return; THM.push(m); const sc = $("tsc"), near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 200;
    const prev = THM.length > 2 ? THM[THM.length - 2] : null; sc.insertAdjacentHTML("beforeend", msgHTML(m, prev, true)); const n = sc.lastElementChild; n.classList.add("in"); bindOne(n, true); if (near || mine) sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" }); }
  if (inMain) { if (MSGS.some(x => x.id === m.id)) return; MSGS.push(m); const sc = $("sc"); if (!sc) return; const near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 240;
    sc.querySelector(".ct-empty")?.remove(); const prev = MSGS[MSGS.length - 2];
    if (!prev || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString()) sc.insertAdjacentHTML("beforeend", `<div class="ct-day">${dayL(m.created_at)}</div>`);
    sc.insertAdjacentHTML("beforeend", msgHTML(m, prev, false)); const n = sc.querySelector(`.ct-m[data-id="${m.id}"],.ct-sys[data-id="${m.id}"]`); if (n) { n.classList.add("in"); bindOne(n); }
    if (near || mine) sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" }); if (m.kind === "sale") setTimeout(() => { const st = window.LOOKS && LOOKS.stars(m.meta.user_id); saleFx(n?.querySelector(".ct-sale"), m.meta.super || st); if (st && !m.meta.super) rain("⭐"); }, 250); if (m.kind === "win") setTimeout(() => winFx(n?.querySelector(".ct-win")), 250);
    if (!mine) markRead(); paintSeen(); }
}
function bindOne(n, inTh) { bindMsgs({ querySelectorAll: s => [...n.querySelectorAll(s), ...(n.matches(s) ? [n] : [])] }, !!inTh); }
function replace(m) {
  const swap = (arr, root, inTh) => { const i = arr.findIndex(x => x.id === m.id); if (i < 0) return; arr[i] = m; const el = root?.querySelector(`.ct-m[data-id="${m.id}"]`); if (!el) return;
    const t = document.createElement("div"); t.innerHTML = msgHTML(m, inTh ? null : arr[i - 1], inTh); const nn = t.firstElementChild; if (el.classList.contains("cont") && !nn.classList.contains("cont") && arr[i - 1] && !inTh) {} el.replaceWith(nn); bindOne(nn, inTh);
    // les barres des sondages repartent de leur ancienne valeur
    const ob = [...el.querySelectorAll(".ct-po .bar")].map(b => b.style.getPropertyValue("--w")); nn.querySelectorAll(".ct-po .bar").forEach((b, k) => { const to = b.style.getPropertyValue("--w"); if (ob[k] != null) { b.style.setProperty("--w", ob[k]); requestAnimationFrame(() => requestAnimationFrame(() => b.style.setProperty("--w", to))); } }); };
  swap(MSGS, $("sc"), false); swap(THM, $("tsc"), true);
  const pi = PINS.findIndex(x => x.id === m.id); if (m.pinned && (pi < 0)) PINS.unshift(m); else if (!m.pinned && pi >= 0) PINS.splice(pi, 1); else if (pi >= 0) PINS[pi] = m; paintPins();
}
function paintSeen() { const c = chan(CUR); if (!c || c.kind !== "dm") return; document.querySelectorAll(".ct-seen").forEach(x => x.remove()); const mine = [...MSGS].reverse().find(x => x.user_id === B.me.id); if (!mine || SEEN < mine.id) return;
  const el = $("sc")?.querySelector(`.ct-m[data-id="${mine.id}"] > div:last-of-type`); if (el) el.insertAdjacentHTML("beforeend", `<div class="ct-seen" style="font-size:11px;color:#7dd3fc;margin-top:3px">✓✓ Vu</div>`); }
let rdT = null; function markRead() { clearTimeout(rdT); rdT = setTimeout(() => { if (!CUR || document.hidden) return; api(`/api/chat/c/${CUR}/read`, { body: {} }).catch(() => {}); const c = chan(CUR); if (c) { c.unread = 0; c.mentions = 0; renderRail(); } }, 500); }
async function refreshBoot() { B = await api("/api/chat/boot"); USERS = Object.fromEntries(B.users.map(u => [u.id, u])); UBN = Object.fromEntries(B.users.map(u => [u.username.toLowerCase(), u])); renderRail(); }
function stream() {
  const es = new EventSource("/api/chat/stream");
  es.addEventListener("message", async e => { const d = JSON.parse(e.data), c = chan(d.channel_id); if (!c) { refreshBoot(); return; }
    const visible = d.channel_id === CUR && !document.hidden;
    if (d.channel_id === CUR || (d.thread_root && d.thread_root === TH)) { if (MSGS.some(x => x.id === d.id) || THM.some(x => x.id === d.id)) return; const m = await api(`/api/chat/m/${d.id}`); insert(m, d.user_id === B.me.id); }
    if (d.user_id !== B.me.id && !d.thread_root && !visible) { c.unread++; if ((d.mentions || []).includes(B.me.id)) c.mentions++; const m = await api(`/api/chat/m/${d.id}`).catch(() => null); if (m) c.last = { body: m.kind === "text" ? m.body.slice(0, 80) : m.kind === "voice" ? "🎤 Message vocal" : m.kind === "sale" ? "💸 Nouvelle vente" : m.kind === "video" ? "🎬 Vidéo" : m.kind === "file" ? "📎 Fichier" : m.kind === "win" ? "🎉 Victoire d'équipe" : m.kind === "motm" ? "🏅 Vote du coéquipier du mois" : m.kind === "qotd" ? "☕ Question du jour" : "…", at: m.created_at, username: m.username }; renderRail();
      if ((d.mentions || []).includes(B.me.id) || c.kind === "dm" || c.slug === "informations") { try { SND.notif?.(); } catch (er) {} notify(c.kind === "dm" ? `Message de ${m?.username}` : (d.mentions || []).includes(B.me.id) ? `${m?.username} t'a mentionné` : "📣 Nouvelle annonce", `${c.kind === "dm" ? "" : "#" + c.name + " · "}${(m?.body || "").slice(0, 90)}`, "info"); } }
    if (d.user_id && TYP[d.user_id + ":" + d.channel_id]) { delete TYP[d.user_id + ":" + d.channel_id]; paintTyping(); } });
  es.addEventListener("update", async e => { const d = JSON.parse(e.data); if (d.channel_id !== CUR) return; if (!MSGS.some(x => x.id === d.id) && !THM.some(x => x.id === d.id)) return; const m = await api(`/api/chat/m/${d.id}`).catch(() => null); if (m) replace(m); });
  es.addEventListener("react", e => { const d = JSON.parse(e.data); if (d.channel_id && d.channel_id !== CUR) return; if (d.super && d.user_id !== B.me.id && MSGS.some(x => x.id === d.id)) { rain(d.emoji); notify(`💥 ${d.username} envoie une super-réaction`, "", "info"); } });
  // « … écrit » : propre à chaque salon (et à chaque fil), jamais affiché dans un autre salon
  es.addEventListener("typing", e => { const d = JSON.parse(e.data); if (d.user_id === B.me.id) return; TYP[d.user_id + ":" + d.channel_id] = { name: d.username, at: Date.now(), thread: d.thread, ch: d.channel_id }; paintTyping(); });
  es.addEventListener("presence", e => { const d = JSON.parse(e.data); if (USERS[d.user_id]) { USERS[d.user_id].status = d.status; const u = B.users.find(x => x.id === d.user_id); if (u) u.status = d.status; } document.querySelectorAll(".ct-av").forEach(() => {}); renderRail(); });
  es.addEventListener("seen", e => { const d = JSON.parse(e.data); if (d.channel_id === CUR && d.user_id !== B.me.id) { SEEN = d.last_id; paintSeen(); } });
  es.addEventListener("pins", async e => { const d = JSON.parse(e.data); if (d.channel_id !== CUR) return; const r = await api(`/api/chat/c/${CUR}/messages?before=0`).catch(() => null); if (r) { PINS = r.pins; paintPins(); } });
  es.addEventListener("muted", e => { const d = JSON.parse(e.data); B.me.muted = d.until; notify(d.until ? "🔇 Tu es en sourdine" : "🔈 Sourdine levée", d.until ? "jusqu'à " + tm(d.until) : "", d.until ? "err" : "ok"); });
  es.onerror = () => {};
}
function paintTyping() { const now = Date.now(); Object.keys(TYP).forEach(k => { if (now - TYP[k].at > 5000) delete TYP[k]; });
  const here = Object.values(TYP).filter(t => t.ch === CUR), main = here.filter(t => !t.thread), th = here.filter(t => t.thread && t.thread === TH);
  const txt = a => a.length === 1 ? `<b>${esc(a[0].name)}</b> écrit` : a.length ? `<b>${a.slice(0, 2).map(t => esc(t.name)).join(", ")}</b> écrivent` : "";
  if ($("ty")) { $("ty").innerHTML = main.length ? `<i></i><i></i><i></i>${txt(main)}…` : ""; $("ty").classList.toggle("on", !!main.length); }
  if ($("tty")) { $("tty").innerHTML = th.length ? `<i></i><i></i><i></i>${txt(th)}…` : ""; $("tty").classList.toggle("on", !!th.length); } }
setInterval(paintTyping, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden && CUR) markRead(); });

/* =============== feuilles : sondage, remplacement, aide fan, DM =============== */
function sheet(html, bind) { $("sheet").innerHTML = html; $("sheet").classList.add("on"); $("scrim").classList.add("on"); bind && bind(); }
function closeSheet() { $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closeSheet;
function pollSheet() {
  sheet(`<h3>📊 Nouveau sondage</h3><p>Les votes s'affichent en direct pour toute l'équipe.</p><label>Question</label><input id="pq" maxlength="200" placeholder="ex. Qui peut prendre le shift de 18 h ?"><label>Réponses</label><div id="po"></div><button class="add" id="pa">+ Ajouter une réponse</button>
    <label class="ct-tg" style="text-transform:none;letter-spacing:0;font:600 13.5px Inter;color:#ccc"><input type="checkbox" id="pm"> Plusieurs choix possibles</label>${B.me.role === "admin" ? `<label class="ct-tg" style="text-transform:none;letter-spacing:0;font:600 13.5px Inter;color:#ccc"><input type="checkbox" id="pan"> Épingler comme annonce</label>` : ""}<button class="go" id="pgo">Publier le sondage</button>`, () => {
    const add = v => { if ($("po").children.length >= 6) return; $("po").insertAdjacentHTML("beforeend", `<div class="row"><input maxlength="80" placeholder="Réponse ${$("po").children.length + 1}" value="${esc(v || "")}"><button aria-label="Retirer">✕</button></div>`); $("po").lastElementChild.querySelector("button").onclick = e => e.target.parentNode.remove(); };
    add("Moi 🙋"); add("Pas dispo"); $("pa").onclick = () => add(); $("pq").focus();
    $("pgo").onclick = async () => { try { const r = await api(`/api/chat/c/${CUR}/messages`, { body: { kind: "poll", body: $("pq").value, options: [...$("po").querySelectorAll("input")].map(i => i.value), multi: $("pm").checked, announce: $("pan")?.checked } }); closeSheet(); insert(r.message, true); } catch (e) { notify("Sondage impossible", e.message, "err"); } }; });
}
async function swapSheet() {
  const d = await api("/api/chat/myshifts"); let sel = null;
  sheet(`<h3>🔁 Trouver un remplaçant</h3><p>Choisis ton shift : un collègue le prend en un clic, le manager valide et le planning se met à jour.</p><div class="ct-shl" id="shl">${d.shifts.map(s => { const dt = new Date(s.start_ms); return `<button data-s="${s.id}" ${s.busy ? "disabled" : ""}><span class="ct-swap" style="background:none;border:0;padding:0"><span class="cal" style="display:block;width:42px;border-radius:10px;overflow:hidden;background:#fff;color:#111;text-align:center"><span style="display:block;background:#7dd3fc;color:#05202d;font:900 8px/13px Inter;text-transform:uppercase">${dt.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "")}</span><b style="display:block;font:900 18px/26px Inter">${dt.getDate()}</b></span></span><div>${esc(s.start)} – ${esc(s.end)} · ${esc(s.model_name)}<small>${dt.toLocaleDateString("fr-FR", { weekday: "long" })}${s.busy ? " · déjà en échange" : ""}</small></div></button>`; }).join("") || `<div style="color:#777;font-size:13px">Aucun shift à venir dans ton planning.</div>`}</div>
    <label>Pourquoi ? <span style="text-transform:none;letter-spacing:0;font-weight:600;color:#666">(facultatif)</span></label><input id="sr" maxlength="160" placeholder="ex. rendez-vous médical"><button class="go" id="sgo">Publier dans #${esc(chan(CUR).name)}</button>`, () => {
    $("shl").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sel = +b.dataset.s; $("shl").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
    $("sgo").onclick = async () => { if (!sel) return notify("Choisis un shift", "", "info"); try { const r = await api("/api/chat/swap", { body: { channel_id: CUR, shift_id: sel, reason: $("sr").value } }); closeSheet(); insert(r.message, true); } catch (e) { notify("Impossible", e.message, "err"); } }; });
}
function sosSheet() {
  const models = B.channels.filter(c => c.kind === "model").map(c => c.name);
  sheet(`<h3>🆘 Aide fan</h3><p>Colle le message du fan (sans son pseudo ni infos perso). L'équipe propose des réponses dans le fil, la meilleure gagne ⭐.</p><label>Le message du fan</label><textarea id="sf" rows="4" maxlength="1500" placeholder="ex. « t'es trop chère, sur les autres comptes c'est moitié prix »"></textarea>
    <label>Créatrice</label><select id="sm"><option value="">—</option>${models.map(m => `<option>${esc(m)}</option>`).join("")}</select><label>Ce que tu veux obtenir <span style="text-transform:none;letter-spacing:0;font-weight:600;color:#666">(facultatif)</span></label><input id="sb" maxlength="300" placeholder="ex. lui vendre la vidéo à 25 € sans baisser le prix"><button class="go" id="sgo" style="background:linear-gradient(120deg,#ff6a3d,#ff2e63);color:#fff">Demander de l'aide</button>`, () => {
    $("sf").focus(); $("sgo").onclick = async () => { try { const r = await api(`/api/chat/c/${CUR}/messages`, { body: { kind: "sos", fan: $("sf").value, model: $("sm").value, body: $("sb").value } }); closeSheet(); insert(r.message, true); } catch (e) { notify("Impossible", e.message, "err"); } }; });
}
function dmSheet() {
  sheet(`<h3>💬 Nouveau message privé</h3><input id="dq" placeholder="Rechercher quelqu'un"><div class="ct-ul" id="dl"></div>`, () => {
    const paint = () => { const q = $("dq").value.toLowerCase(); $("dl").innerHTML = B.users.filter(u => u.id !== B.me.id && u.username.toLowerCase().includes(q)).map(u => `<button data-u="${u.id}">${av(u.username, u.status)}${esc(u.username)}${u.role === "admin" ? ` <span class="rl" style="font:800 9.5px Inter;color:#5fd3a2">MANAGER</span>` : ""}<small>${ST_LBL[u.status]}</small></button>`).join("");
      $("dl").querySelectorAll("[data-u]").forEach(b => b.onclick = async () => { const r = await api("/api/chat/dm", { body: { user_id: +b.dataset.u } }); closeSheet(); await refreshBoot(); openCh(r.id); }); };
    $("dq").oninput = paint; paint(); $("dq").focus(); });
}

(async () => {
  const me = await api("/api/me"); renderShell("chat", me);
  await refreshBoot();
  $("meBar").innerHTML = `${av(B.me.username, USERS[B.me.id]?.status)}<div><b>${esc(nameOf(B.me.id, B.me.username))}</b><div style="font-size:11.5px;color:#777">${ST_LBL[USERS[B.me.id]?.status === "offline" ? "online" : USERS[B.me.id]?.status] || "en ligne"}</div></div>`;
  $("q").oninput = renderRail; stream(); bindDrop(); VC.start();
  const q = +new URLSearchParams(location.search).get("c"); const first = q && chan(q) ? q : (B.channels.find(c => c.slug === "informations" && c.unread) || B.channels.find(c => c.slug === (me.role === "trainee" ? "formation" : "general")) || B.channels[0]).id;
  if (!MOB() || q) openCh(first);
})();
