<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ton mois — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/style.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{font-family:Inter,system-ui,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;--g:#5fd3a2}
.bgb{position:fixed;inset:0;filter:blur(60px);opacity:.35;transition:background 1s}
.st{position:relative;width:min(440px,100vw);height:min(100dvh,860px);border-radius:28px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none}
@media(max-width:500px){.st{border-radius:0;height:100dvh}}
.bars{position:absolute;left:12px;right:12px;top:12px;z-index:5;display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}.bars i b{display:block;height:100%;width:0;background:#fff}
.hd{position:absolute;left:16px;right:16px;top:24px;z-index:5;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.hd .lg-sh{width:92px}.hd .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.3);color:#fff;font-size:15px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:90px 30px 60px;box-sizing:border-box;opacity:0;pointer-events:none}
.sl.on{opacity:1;pointer-events:auto}
.sl .bg{position:absolute;inset:0;z-index:-1;background-size:200% 200%;animation:bgm 8s ease-in-out infinite alternate}@keyframes bgm{to{background-position:100% 100%}}
.k{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.big{font:900 clamp(64px,22vw,104px)/.95 Inter;letter-spacing:-.06em;margin:14px 0 10px;font-variant-numeric:tabular-nums}
.mid{font:900 clamp(40px,12vw,60px)/1 Inter;letter-spacing:-.04em;margin:12px 0 10px}
.p{font-size:18px;line-height:1.45;font-weight:600;opacity:.92}.p b{font-weight:900}
.sl.on .r{animation:rin .9s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--d,0) * 140ms + 120ms)}
@keyframes rin{from{opacity:0;transform:translateY(40px) scale(.96);filter:blur(10px)}}
.sl.on .zoom{animation:zin 1.1s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--d,0) * 140ms + 120ms)}
@keyframes zin{from{opacity:0;transform:scale(.3) rotate(-8deg)}}
/* éléments décoratifs */
.ring{width:190px;height:190px;margin:18px auto;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}.ring .b{stroke:rgba(255,255,255,.18)}.ring .f{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1.8s .4s cubic-bezier(.2,.9,.25,1)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 42px Inter;letter-spacing:-.03em}
.clock{width:200px;height:200px;margin:16px auto;border-radius:50%;border:6px solid rgba(255,255,255,.9);position:relative}
.clock i{position:absolute;left:50%;bottom:50%;width:6px;margin-left:-3px;border-radius:3px;background:#fff;transform-origin:50% 100%}
.clock .h{height:56px}.clock .m{height:80px;opacity:.6}.sl.on .clock .h{animation:hh 2s cubic-bezier(.2,.9,.25,1) forwards}.sl.on .clock .m{animation:mm 2s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes hh{from{transform:rotate(-360deg)}to{transform:rotate(var(--a))}}@keyframes mm{from{transform:rotate(-1440deg)}to{transform:rotate(0deg)}}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:200px;margin:20px 0}
.pod div{width:78px;border-radius:14px 14px 0 0;background:rgba(255,255,255,.22);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font:900 28px Inter;transform-origin:bottom}
.pod .me{background:#fff;color:#111}.sl.on .pod div{animation:pu 1s cubic-bezier(.34,1.56,.64,1) both}.sl.on .pod div:nth-child(1){animation-delay:.5s}.sl.on .pod div:nth-child(2){animation-delay:.2s}.sl.on .pod div:nth-child(3){animation-delay:.8s}
@keyframes pu{from{transform:scaleY(0)}}
.cal{width:170px;margin:18px auto;border-radius:20px;overflow:hidden;background:#fff;color:#111;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.cal b{display:block;background:#ff4d6d;color:#fff;font:800 15px Inter;letter-spacing:.14em;padding:10px;text-transform:uppercase}.cal span{display:block;font:900 84px/1.1 Inter;letter-spacing:-.04em;padding:6px 0 4px}.cal small{display:block;font:700 13px Inter;padding-bottom:12px;opacity:.6;text-transform:capitalize}
.sl.on .cal{animation:cf 1.1s cubic-bezier(.34,1.56,.64,1) both .2s}@keyframes cf{from{transform:perspective(600px) rotateX(-90deg);opacity:0}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.grid div{padding:14px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}.grid small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.75;text-transform:uppercase}.grid b{display:block;font:900 22px Inter;margin-top:4px;letter-spacing:-.02em}
.btns{display:flex;gap:8px;margin-top:20px}.btns a,.btns button{flex:1;height:48px;border-radius:14px;border:0;font:800 14px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btns .w{background:#fff;color:#111}.btns .g{background:rgba(0,0,0,.25);color:#fff}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.tap{position:absolute;top:70px;bottom:0;z-index:3;width:35%}.tap.l{left:0}.tap.r{right:0;width:65%}
.empty{text-align:center;padding:40px;color:#aaa;font-size:15px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgb" id="bgb"></div>
<div class="st" id="st"><div class="bars" id="bars"></div><div class="hd"><span id="logo"></span><span id="who" style="opacity:.8"></span><a class="x" href="/home" aria-label="Fermer">✕</a></div>
  <canvas id="fx"></canvas><div class="tap l" id="tl"></div><div class="tap r" id="tr"></div></div>
<script src="/common.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, P = new URLSearchParams(location.search);
  try { $("logo").innerHTML = logoHTML(); } catch (e) {}
  let w; try { w = await api("/api/wrapped" + (P.get("m") ? "?m=" + P.get("m") : "") + (P.get("u") ? (P.get("m") ? "&" : "?") + "u=" + P.get("u") : "")); } catch (e) { $("st").innerHTML += `<div class="empty">${esc(e.message)}</div>`; return; }
  const eur = n => Math.round(n).toLocaleString("fr-FR") + " €", M = w.label.split(" ")[0];
  $("who").textContent = w.username;
  if (!w.count) { $("st").insertAdjacentHTML("beforeend", `<div class="sl on"><div class="bg" style="background:linear-gradient(160deg,#1c1c2b,#0b0b0f)"></div><div class="k r">Ton mois de ${esc(M)}</div><div class="mid r" style="--d:1">Pas encore de vente validée ce mois-là.</div><div class="p r" style="--d:2">Ton prochain Wrapped t'attend le mois prochain 💪</div><div class="btns r" style="--d:3"><a class="w" href="/home">Retour</a></div></div>`); return; }
  const G = ["linear-gradient(140deg,#7b2ff7,#f107a3,#ff6a3d)", "linear-gradient(150deg,#00c48c,#0a7c6a,#063b3a)", "linear-gradient(150deg,#ff4d6d,#ff9a3d,#ffd23f)", "linear-gradient(150deg,#3a1c71,#d76d77,#ffaf7b)",
    "linear-gradient(150deg,#f7971e,#ffd200,#f7971e)", "linear-gradient(150deg,#0f2027,#203a43,#2c5364)", "linear-gradient(150deg,#11998e,#38ef7d,#11998e)", "linear-gradient(150deg,#614385,#516395,#2b5876)", "linear-gradient(150deg,#ee0979,#ff6a00,#ee0979)", "linear-gradient(150deg,#141e30,#243b55,#5fd3a2)"];
  const S = [];
  S.push({ html: `<div class="k r">STELLADS · WRAPPED</div><div class="mid r" style="--d:1">Ton mois de<br>${esc(M)}</div><div class="p r" style="--d:2">${esc(w.username)}, on a fait le compte. Prêt·e ? 👀</div>`, fx: "stars" });
  S.push({ html: `<div class="k r">Tu as vendu</div><div class="big r" style="--d:1" data-count="${w.total}">0 €</div><div class="p r" style="--d:2">en <b>${w.count} ventes</b> validées, sur <b>${w.days} jours</b> d'activité. Panier moyen : <b>${eur(w.avg)}</b>.</div>`, fx: "confetti" });
  if (w.bestDay) S.push({ html: `<div class="k r">Ta meilleure journée</div><div class="cal"><b>${esc(w.bestDay.label.split(" ").slice(-1)[0])}</b><span>${w.bestDay.date.slice(8)}</span><small>${esc(w.bestDay.label.split(" ")[0])}</small></div><div class="p r" style="--d:3">Ce jour-là, tu as vendu <b>${eur(w.bestDay.ca)}</b>. Une journée en feu 🔥</div>` });
  if (w.fav) S.push({ html: `<div class="k r">Ta créatrice fétiche</div><div class="ring"><svg viewBox="0 0 200 200"><circle class="b" cx="100" cy="100" r="85"/><circle class="f" cx="100" cy="100" r="85" stroke-dasharray="534" stroke-dashoffset="534" data-to="${534 * (1 - w.fav.share / 100)}"/></svg><span>${w.fav.share} %</span></div><div class="mid r" style="--d:2;text-align:center">${esc(w.fav.name)}</div><div class="p r" style="--d:3;text-align:center"><b>${eur(w.fav.ca)}</b> sur ${w.fav.n} ventes : ${w.fav.share} % de ton mois.</div>` });
  if (w.big) S.push({ html: `<div class="k r">Ta plus grosse vente</div><div class="big zoom" style="--d:1">${eur(w.big.amount)}</div><div class="p r" style="--d:2">Sur <b>${esc(w.big.model)}</b>, le ${esc(w.big.label)}. Respect. 👑</div>`, fx: "burst" });
  if (w.goldHour != null) { const h = w.goldHour % 12; S.push({ html: `<div class="k r">Ton heure en or</div><div class="clock"><i class="h" style="--a:${h * 30}deg;transform:rotate(${h * 30}deg)"></i><i class="m"></i></div><div class="mid r" style="--d:2;text-align:center">${String(w.goldHour).padStart(2, "0")} h</div><div class="p r" style="--d:3;text-align:center">C'est l'heure où tu vends le plus. Les fans t'attendent 😉</div>` }); }
  S.push({ html: `<div class="k r">Sur le terrain</div><div class="big r" style="--d:1" data-count="${w.hours}" data-unit=" h">0 h</div><div class="p r" style="--d:2">de shift en <b>${w.shifts} pointages</b>.${w.punct != null ? ` Ponctualité : <b>${w.punct} %</b> ${w.punct >= 90 ? "⏰ impeccable" : w.punct >= 70 ? "👍" : "— on vise mieux le mois prochain"}.` : ""}${w.sims ? ` Et <b>${w.sims} session${w.sims > 1 ? "s" : ""}</b> au simulateur (meilleur score ${w.simBest}).` : ""}</div>` });
  if (w.growth != null) S.push({ html: `<div class="k r">Comparé au mois d'avant</div><div class="big zoom" style="--d:1">${w.growth >= 0 ? "+" : ""}${w.growth} %</div><div class="p r" style="--d:2">${w.growth >= 0 ? `Tu passes de <b>${eur(w.prevTotal)}</b> à <b>${eur(w.total)}</b>. Ça monte 📈` : `<b>${eur(w.total)}</b> contre <b>${eur(w.prevTotal)}</b> le mois d'avant. Le prochain sera le bon 💪`}</div>`, fx: w.growth >= 0 ? "confetti" : "" });
  if (w.rank) S.push({ html: `<div class="k r">Dans l'équipe</div><div class="pod">${[2, 1, 3].map(n => `<div class="${n === w.rank ? "me" : ""}" style="height:${n === 1 ? 190 : n === 2 ? 140 : 100}px">${n}</div>`).join("")}</div><div class="mid r" style="--d:2;text-align:center">${w.rank === 1 ? "N°1 du mois 🏆" : `${w.rank}ᵉ sur ${w.teamSize}`}</div><div class="p r" style="--d:3;text-align:center">${w.rank <= 3 ? "Sur le podium de l'agence." : `Tu pèses ${Math.round(w.total / Math.max(1, w.teamTotal) * 100)} % du chiffre de l'équipe.`}${w.kudos ? ` Et <b>${w.kudos} 🔥</b> reçus de l'équipe.` : ""}</div>`, fx: w.rank <= 3 ? "confetti" : "" });
  S.push({ html: `<div class="k r">Ton mois de ${esc(M)} en bref</div><div class="grid r" style="--d:1"><div><small>Vendu</small><b>${eur(w.total)}</b></div><div><small>Ventes</small><b>${w.count}</b></div><div><small>Record</small><b>${w.big ? eur(w.big.amount) : "—"}</b></div><div><small>Fétiche</small><b>${w.fav ? esc(w.fav.name) : "—"}</b></div><div><small>Heures</small><b>${w.hours} h</b></div><div><small>Classement</small><b>${w.rank ? w.rank + (w.rank === 1 ? "ᵉʳ" : "ᵉ") : "—"}</b></div></div>
    <div class="p r" style="--d:2;margin-top:18px">Merci pour ce mois. On remet ça ? ✨</div><div class="btns r" style="--d:3"><button class="g" data-again>↺ Revoir</button><a class="w" href="/home">Terminer</a></div>`, fx: "stars", stay: true });
  const st = $("st"); S.forEach((s, i) => { const d = document.createElement("div"); d.className = "sl"; d.innerHTML = `<div class="bg" style="background-image:${G[i % G.length]}"></div>` + s.html; st.insertBefore(d, $("tl")); s.el = d; });
  $("bars").innerHTML = S.map(() => "<i><b></b></i>").join("");
  /* ---------- effets ---------- */
  const cv = $("fx"), x = cv.getContext("2d"); let P2 = [];
  const fit = () => { const r = st.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; x.setTransform(d, 0, 0, d, 0, 0); cv.W = r.width; cv.H = r.height; }; fit(); addEventListener("resize", fit);
  function fx(kind) { if (reduce || !kind) return; const W = cv.W, H = cv.H;
    if (kind === "confetti" || kind === "burst") for (let i = 0; i < (kind === "burst" ? 160 : 120); i++) { const a = kind === "burst" ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - .5) * 1.4, v = 4 + Math.random() * 9; P2.push({ x: W / 2, y: kind === "burst" ? H * .45 : H, vx: Math.cos(a) * v, vy: Math.sin(a) * v * (kind === "burst" ? 1 : 1.6), g: .22, l: 1, s: 4 + Math.random() * 5, c: ["#fff", "#ffd23f", "#5fd3a2", "#ff6a9a", "#9b7bff"][Math.random() * 5 | 0], r: Math.random() * 6, t: 0 }); }
    if (kind === "stars") for (let i = 0; i < 60; i++) P2.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: -.3 - Math.random() * .6, g: 0, l: 1, s: 1 + Math.random() * 2.5, c: "#fff", r: 0, t: 1 }); }
  (function f() { x.clearRect(0, 0, cv.W, cv.H); P2 = P2.filter(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += .12; p.l -= p.t ? .004 : .009; x.globalAlpha = Math.max(0, p.l); x.fillStyle = p.c;
      if (p.t) { x.beginPath(); x.arc(p.x, p.y, p.s, 0, Math.PI * 2); x.fill(); } else { x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillRect(-p.s / 2, -p.s, p.s, p.s * 2); x.restore(); } return p.l > 0 && p.y < cv.H + 40; }); x.globalAlpha = 1; requestAnimationFrame(f); })();
  /* ---------- navigation ---------- */
  let cur = -1, timer = null, t0 = 0, paused = false, DUR = 5200;
  function count(el) { const to = +el.dataset.count, unit = el.dataset.unit || " €", s = performance.now(); (function k(t) { const p = Math.min(1, (t - s) / 1400), e = 1 - Math.pow(1 - p, 4); el.textContent = Math.round(to * e).toLocaleString("fr-FR") + unit; if (p < 1) requestAnimationFrame(k); })(s); }
  function go(i) {
    if (i < 0) i = 0; if (i >= S.length) return; cur = i;
    S.forEach((s, k) => s.el.classList.toggle("on", k === i));
    [...$("bars").children].forEach((b, k) => { const f = b.firstChild; f.style.transition = "none"; f.style.width = k < i ? "100%" : "0%"; });
    const el = S[i].el; document.getElementById("bgb").style.background = G[i % G.length];
    el.querySelectorAll("[data-count]").forEach(count); el.querySelectorAll("[data-to]").forEach(c => { c.style.strokeDashoffset = 534; requestAnimationFrame(() => requestAnimationFrame(() => c.style.strokeDashoffset = c.dataset.to)); });
    setTimeout(() => fx(S[i].fx), 350);
    const again = el.querySelector("[data-again]"); if (again) again.onclick = e => { e.stopPropagation(); go(0); };
    clearTimeout(timer); t0 = performance.now();
    if (!S[i].stay) { const f = $("bars").children[i].firstChild; requestAnimationFrame(() => { f.style.transition = `width ${DUR}ms linear`; f.style.width = "100%"; }); timer = setTimeout(() => go(i + 1), DUR); }
    else $("bars").children[i].firstChild.style.width = "100%";
  }
  $("tl").onclick = () => go(cur - 1); $("tr").onclick = () => go(cur + 1);
  document.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === " ") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
  go(0);
})();
</script>
</body>
</html>
