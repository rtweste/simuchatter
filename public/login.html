<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StellADS">

<link rel="stylesheet" href="/style.css">
<style>
html,body{background:#000}
.lp{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
/* Ciel étoilé */
.sky{position:absolute;inset:-40px;pointer-events:none}
.sky .layer{position:absolute;inset:0}
.l1{animation:drift 90s linear infinite}
.l2{animation:drift 55s linear infinite}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
.l2 .st{box-shadow:0 0 6px rgba(255,255,255,.6)}
@keyframes tw{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * .25)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-120px)}}
.halo{position:absolute;left:50%;top:50%;width:720px;height:720px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,0) 62%);pointer-events:none;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.shoot{position:absolute;top:14%;left:62%;width:140px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform:rotate(-24deg);opacity:0;animation:shoot 9s ease-out 2.5s infinite}
@keyframes shoot{0%{opacity:0;transform:rotate(-24deg) translateX(0)}2%{opacity:1}9%{opacity:0;transform:rotate(-24deg) translateX(-420px)}100%{opacity:0;transform:rotate(-24deg) translateX(-420px)}}
/* Formulaire en verre fumé */
.form{position:relative;z-index:2;width:100%;max-width:380px;box-sizing:border-box;padding:34px 30px 24px;border-radius:22px;background:rgba(14,14,14,.62);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.form .lg-sh{width:200px;margin:4px 0 24px}
.form .sub{font-size:13px;line-height:1.55;margin:0 0 22px}
.form label{margin:0 0 6px}
.form input{height:46px;border-radius:12px;background:#0d0d0d;border:1px solid #262626;margin-bottom:16px;transition:border-color .25s,box-shadow .25s}
.form input:focus{border-color:#5a5a5a;box-shadow:0 0 0 4px rgba(255,255,255,.06);outline:none}
.in{opacity:0;transform:translateY(14px);animation:in .8s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
#b{position:relative;overflow:hidden;width:100%;height:48px;margin-top:6px;border-radius:12px;transition:transform .2s}
#b:active{transform:scale(.98)}
#b::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-100%);animation:btnShine 4.5s ease-in-out 1.6s infinite}
@keyframes btnShine{0%{transform:translateX(-100%)}30%,100%{transform:translateX(100%)}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(10,10,10,.25);border-top-color:#0a0a0a;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.form.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* Sortie : les étoiles filent vers le centre, puis l'intro vidéo */
.warp .form{animation:out .7s cubic-bezier(.6,0,.4,1) forwards}
.warp .sky{animation:warp 1.1s cubic-bezier(.7,0,.3,1) forwards}
.warp .halo{animation:flash 1.1s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(.94);filter:blur(6px)}}
@keyframes warp{to{transform:scale(3.2);opacity:0}}
@keyframes flash{60%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}
@media(max-width:480px){.form{padding:28px 22px 20px}.form .lg-sh{width:180px}.halo{width:520px;height:520px}}
@media (prefers-reduced-motion:reduce){.in{opacity:1;transform:none}}
/* Intro vidéo */
#intro{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
#intro.show{opacity:1;pointer-events:auto}
#intro.out{opacity:0;transition:opacity .5s ease}
#introV{width:min(100vw,100vh);height:min(100vw,100vh);object-fit:contain;background:#000}
#skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));background:transparent;border:1px solid #333;color:#8f8f8f;padding:8px 14px;font-size:13px;border-radius:20px}
#skip:hover{color:#f5f5f5;border-color:#555}
</style>
</head>
<body>
<div class="lp" id="lp">
  <div class="sky" aria-hidden="true">
    <div class="layer l1" id="far"></div>
    <div class="layer l2" id="near"></div>
    <span class="shoot"></span>
  </div>
  <div class="halo" aria-hidden="true"></div>
  <form class="form" id="f">
    <div class="in" style="animation-delay:.15s"><h1 id="logo" style="margin:0" aria-label="StellADS"></h1></div>
    <p class="sub in" style="animation-delay:.3s">Portail de l'agence. Connectez-vous avec les identifiants fournis par votre manager.</p>
    <div class="in" style="animation-delay:.42s"><label for="u">Identifiant</label><input id="u" autocomplete="username" required autofocus></div>
    <div class="in" style="animation-delay:.52s"><label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" required></div>
    <div class="in" style="animation-delay:.64s"><button class="btn" id="b">Se connecter</button></div>
    <div class="err" id="e" role="alert"></div>
  </form>
</div>

<!-- Animation d'accueil, jouée après chaque connexion réussie -->
<div id="intro" aria-hidden="true">
  <video id="introV" src="/intro.mp4" playsinline preload="auto"></video>
  <button type="button" id="skip">Passer</button>
</div>

<script src="/common.js"></script>
<script>
api("/api/me", { noRedirect: true }).then(() => location.href = "/home").catch(() => {});

// Logo avec reflet + étoiles
$("logo").innerHTML = logoHTML();
function stars(el, n, rmin, rmax) {
  let html = "";
  for (let i = 0; i < n; i++) {
    const r = (rmin + Math.random() * (rmax - rmin)).toFixed(1);
    html += `<span class="st" style="left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 115).toFixed(2)}%;width:${r}px;height:${r}px;--o:${(0.25 + Math.random() * 0.6).toFixed(2)};animation-duration:${(3 + Math.random() * 5).toFixed(1)}s;animation-delay:${(-Math.random() * 6).toFixed(1)}s"></span>`;
  }
  el.innerHTML = html;
}
const many = innerWidth > 700;
stars($("far"), many ? 120 : 60, 0.6, 1.4);
stars($("near"), many ? 40 : 20, 1.4, 2.4);

const v = $("introV");
let leaving = false;
function goHome() {
  if (leaving) return; leaving = true;
  $("intro").classList.add("out");
  setTimeout(() => location.href = "/home", 450);
}
v.addEventListener("ended", goHome);
$("skip").onclick = goHome;

$("f").onsubmit = async e => {
  e.preventDefault(); $("b").disabled = true; $("e").textContent = "";
  $("b").innerHTML = '<span class="spin" aria-label="Connexion…"></span>';
  // Débloque la lecture avec le son pendant le clic (les navigateurs l'exigent), puis met en pause
  try { v.muted = false; const p = v.play(); if (p) p.then(() => { if (!$("intro").classList.contains("show")) { v.pause(); v.currentTime = 0; } }).catch(() => {}); } catch (_) {}
  try {
    await api("/api/login", { body: { username: $("u").value, password: $("p").value } });
    try { sessionStorage.removeItem("stNav"); sessionStorage.removeItem("stHome"); } catch (_) {}  // rejoue l'entrée du menu après l'intro
    $("lp").classList.add("warp");                             // saut dans les étoiles
    await sleep(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 950);
    $("intro").classList.add("show");
    v.currentTime = 0;
    v.play().catch(() => { v.muted = true; v.play().catch(goHome); });  // si le son est bloqué : sans le son
    setTimeout(goHome, 8000);  // sécurité si la vidéo ne se lance pas
  } catch (err) {
    try { v.pause(); v.currentTime = 0; } catch (_) {}
    $("e").textContent = err.message; $("b").disabled = false; $("b").textContent = "Se connecter";
    $("f").classList.remove("shake"); void $("f").offsetWidth; $("f").classList.add("shake");
  }
};
</script>
</body>
</html>
