<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StellADS">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/handover.css">
<link rel="stylesheet" href="/wall.css">
<link rel="stylesheet" href="/team.css">
<link rel="stylesheet" href="/formation.css">
<style>
/* ===================== Accueil « bento » ===================== */
.hm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:10px}
.hm > *{min-width:0}
.b{background:#111;border:1px solid #1f1f1f;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-sizing:border-box}
.b h3{margin:0;font-size:13px;font-weight:600;color:#d0d0d0}
.a-hero{grid-column:1/-1}.a-goal{grid-column:1;grid-row:span 2}.a-k1{grid-column:2}.a-k2{grid-column:2}.a-k3{display:none}
.a-shift,.a-pod,.a-feed{grid-column:1/-1}
@media(min-width:1000px){
  .hm{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .a-hero{grid-column:1/4;grid-row:1}.a-goal{grid-column:4;grid-row:1/3}
  .a-k1{grid-column:1;grid-row:2}.a-k2{grid-column:2;grid-row:2}.a-k3{display:block;grid-column:3;grid-row:2}
  .a-shift,.a-feed{grid-column:1/3;grid-row:3}.a-pod{grid-column:3/5;grid-row:3}
  .hm.adm .a-pod{grid-column:1/3}.hm.adm .a-feed{grid-column:3/5}
}
/* en-tête vivant */
.hero{background:#0c0c0e;border-color:#1d1d22;padding:20px 22px}
.stars{position:absolute;inset:0;pointer-events:none;animation:hDrift 60s linear infinite}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:hTw ease-in-out infinite}
@keyframes hTw{50%{opacity:.15}}
@keyframes hDrift{to{transform:translateY(-40px)}}
.hero .glow{position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);pointer-events:none;animation:hBr 7s ease-in-out infinite}
@keyframes hBr{50%{transform:scale(1.12);opacity:.7}}
@media(max-width:600px){.hp{display:none}}
.hi{position:relative;font-family:Outfit,Inter,sans-serif;font-weight:300;font-size:34px;line-height:1.15;margin-top:6px}
@media(max-width:600px){.hi{font-size:30px}}
.hline{position:relative;margin-top:10px;font-size:14px;color:#bdbdbd;line-height:1.5}
.hline b{color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 11px;font-size:12.5px;color:#e6e6e6;white-space:nowrap;margin-right:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:#555}
.pill.on i{background:#3ccf91;box-shadow:0 0 0 3px rgba(60,207,145,.15)}
/* objectif */
.a-goal{display:flex;flex-direction:column;align-items:center;text-align:center}
.ringw{position:relative;margin:12px auto 6px;width:128px;height:128px}
@media(min-width:1000px){.ringw{width:170px;height:170px}}
.ringw svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
.ringw .fg{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
.ringw .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringw .ctr b{font-family:Outfit,Inter,sans-serif;font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
@media(min-width:1000px){.ringw .ctr b{font-size:30px}}
.ringw .ctr small{font-size:11.5px;color:#8f8f8f;margin-top:2px}
.proj{font-size:12.5px;color:#9a9a9a;line-height:1.5}
.proj b{color:#fff;font-weight:600}
.goal-done .fg{stroke:#5fd3a2}
/* chiffres + mini-courbes */
.kp small{display:block;font-size:12px;color:#8f8f8f}
.kp .v{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:6px}
.kp .v b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(min-width:1000px){.kp .v b{font-size:24px}}
.kp .tr{font-size:11.5px;font-weight:600;color:#5fd3a2}
.kp .tr.dn{color:#c99a62}.kp .tr.nt{color:#8f8f8f}
.spk{display:block;width:100%;height:40px;margin-top:10px}
/* podium */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:14px;min-height:180px}
.pc{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pc .pa{width:38px;height:38px;border-radius:50%;background:#1d1d1d;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-transform:uppercase}
.pc.p1 .pa{width:46px;height:46px;background:#ededed;color:#0a0a0a;border:0;box-shadow:0 0 24px rgba(255,255,255,.18)}
.pc.me .pa{outline:2px solid #ededed;outline-offset:3px}
.pc .pn{font-size:12px;font-weight:600;text-align:center}
.pc .pm{font-size:11px;color:#8f8f8f;font-variant-numeric:tabular-nums}
.pc .bar{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(#1f1f1f,#151515);border:1px solid #262626;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:Outfit,Inter,sans-serif;font-size:22px;color:#6f6f6f;transform-origin:bottom;box-sizing:border-box}
.pc.p1 .bar{background:linear-gradient(#2a2a2a,#171717);border-color:#3a3a3a;color:#d0d0d0}
.pod-note{font-size:12.5px;color:#bdbdbd;text-align:center;margin-top:10px}
.pod-note b{color:#fff}
.empty2{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
/* shift */
.nxt{font-size:12.5px;color:#9a9a9a;margin-top:6px;line-height:1.5}.nxt b{color:#fff}
.slide{position:relative;display:block;width:100%;height:56px;border-radius:28px;background:#171717;border:1px solid #262626;overflow:hidden;margin-top:14px;cursor:pointer;padding:0;font:inherit;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.slide .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;font-size:13.5px;font-weight:600;background:linear-gradient(100deg,#6f6f6f 35%,#fff 50%,#6f6f6f 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hSh 2.6s linear infinite}
@keyframes hSh{from{background-position:120% 0}to{background-position:-120% 0}}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:28px;background:rgba(60,207,145,.18)}
.slide .knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#ededed;color:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.slide .knob svg{width:20px;height:20px}
.slide.anim .knob,.slide.anim .fill{transition:left .45s cubic-bezier(.6,0,.3,1),width .45s cubic-bezier(.6,0,.3,1)}
.slide:not(.drag):not(.anim) .knob{animation:hNudge 2.4s ease-in-out 3s infinite}
@keyframes hNudge{0%,70%,100%{transform:none}80%{transform:translateX(14px)}90%{transform:translateX(0)}}
.mdl{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#8f8f8f}
.mdl select{width:auto;min-width:140px;height:34px;padding:0 10px;font-size:13px}
.live{display:flex;align-items:center;gap:12px;margin-top:12px}
.live .dot{width:10px;height:10px;border-radius:50%;background:#3ccf91;animation:hPl 2s ease-out infinite;flex-shrink:0}
@keyframes hPl{0%{box-shadow:0 0 0 0 rgba(60,207,145,.5)}100%{box-shadow:0 0 0 10px rgba(60,207,145,0)}}
.live .tm{font-family:Outfit,Inter,sans-serif;font-weight:300;font-size:34px;font-variant-numeric:tabular-nums}
.live .stop{margin-left:auto}
.wk{margin-top:16px;border-top:1px solid #1c1c1c;padding-top:6px;display:none}
@media(min-width:1000px){.wk{display:block}}
.wk div{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid #191919;color:#bdbdbd}
.wk div:last-child{border:0}.wk b{color:#fff;font-weight:600}
/* fil d'activité */
.feed{display:flex;flex-direction:column;margin-top:10px}
.fi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1b1b1b;font-size:12.5px}
.fi:last-child{border:0}
.fi.new{animation:hFin .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes hFin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.fi .fa{width:28px;height:28px;border-radius:50%;background:#1c1c1c;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.fi .ft{flex:1;min-width:0;color:#cfcfcf;line-height:1.4}.fi .ft b{color:#fff}
.fi .ago{font-size:11px;color:#6f6f6f;white-space:nowrap}
.tg{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 7px;margin-left:4px;white-space:nowrap}
.tg.g{color:#5fd3a2;background:rgba(95,211,162,.1)}.tg.o{color:#e0b060;background:rgba(224,176,96,.1)}.tg.r{color:#e0a3a3;background:rgba(224,163,163,.1)}
.livebadge{position:absolute;right:18px;top:18px;display:flex;align-items:center;gap:6px;font-size:11px;color:#8f8f8f}
.livebadge i{width:7px;height:7px;border-radius:50%;background:#e06060;animation:hPl2 1.6s ease-in-out infinite}
@keyframes hPl2{50%{opacity:.3}}
/* compteur à rouleaux */
.odo{display:inline-flex;font-variant-numeric:tabular-nums}
.oc{display:inline-block;width:.6em;height:1.15em;overflow:hidden;vertical-align:bottom;-webkit-mask-image:linear-gradient(transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 22%,#000 78%,transparent 100%)}
.os{display:flex;flex-direction:column;align-items:center}
.os span{display:block;height:1.15em;line-height:1.15em}

/* ===================== Ouverture (1 fois par session) ===================== */
.open .b{opacity:0;animation:hUnfold .85s cubic-bezier(.2,1.15,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes hUnfold{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.84);filter:blur(6px)}60%{filter:none}to{opacity:1;transform:none;filter:none}}
.open .stars{opacity:0;animation:hDrift 60s linear infinite,hOn .9s ease 1s forwards}
@keyframes hOn{to{opacity:1}}
.open .spl{stroke-dasharray:300;stroke-dashoffset:300;animation:hDraw 1.5s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--sd,1.6s)}
.open .spa{opacity:0;animation:hOn .8s ease 2.4s forwards}
@keyframes hDraw{to{stroke-dashoffset:0}}
.open .pc .bar{transform:scaleY(0);animation:hGrow .8s cubic-bezier(.2,.9,.25,1.15) forwards;animation-delay:var(--bd,1.8s)}
.open .pc .pa{opacity:0;animation:hPop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--pd,2.3s)}
@keyframes hGrow{to{transform:scaleY(1)}}
@keyframes hPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.quick .b{animation:hQuick .4s cubic-bezier(.2,.75,.2,1) both;animation-delay:var(--qd,0s)}
@keyframes hQuick{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx{position:fixed;inset:0;z-index:150;pointer-events:none;overflow:hidden}
.comet{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;offset-rotate:auto;opacity:0;animation:hFly .95s cubic-bezier(.55,0,.25,1) .15s forwards}
.comet svg{position:absolute;inset:0;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,255,255,.7))}
.comet .tail{position:absolute;right:8px;top:50%;width:130px;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9))}
@keyframes hFly{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.burst{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1px solid rgba(255,255,255,.7);opacity:0;animation:hBst .9s cubic-bezier(.2,.7,.2,1) 1.05s forwards}
.burst.b2{animation-delay:1.15s;border-color:rgba(255,255,255,.4)}
@keyframes hBst{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(6)}}
.sweep{position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.07) 49%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.07) 51%,transparent 58%);background-size:300% 100%;background-position:120% 0;opacity:0;animation:hSwp 1.3s cubic-bezier(.4,0,.2,1) 2.5s forwards}
@keyframes hSwp{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}
.kick .lg-sh .star{animation:hKick .6s cubic-bezier(.3,1.6,.5,1) .05s}
@keyframes hKick{40%{transform:scale(2.2) rotate(45deg)}100%{transform:none}}

/* ===================== Accueil manager v2 ===================== */
.hm.adm .a-goal{grid-column:1/-1;grid-row:auto}.hm.adm .a-k1{grid-column:1}.hm.adm .a-k2{grid-column:2}.hm.adm .a-k3{display:block;grid-column:1/-1}
@media(min-width:1000px){
  .hm.adm{min-height:calc(100dvh - 76px);grid-template-rows:auto auto minmax(260px,1fr)}
  .hm.adm .a-goal{grid-column:4;grid-row:1/3}.hm.adm .a-k1{grid-column:1}.hm.adm .a-k2{grid-column:2}.hm.adm .a-k3{grid-column:3}
  .hm.adm .a-feed{overflow:hidden}
}
@media(hover:hover) and (min-width:1000px){
  .b{transition:translate .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s}
  .b::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.06),transparent 45%)}
  .b:hover{translate:0 -3px;border-color:#2c2c2c;box-shadow:0 18px 40px -18px rgba(0,0,0,.9)}
  .b:hover::after{opacity:1}
}
.hero2{position:relative;display:flex;flex-direction:column;gap:18px}
@media(min-width:1000px){.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:stretch}.hero2 .hl{display:flex;flex-direction:column}.adm .hi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:32px}}
.acts{position:relative;display:flex;gap:6px;margin-top:16px}
@media(min-width:1000px){.acts{flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:16px}}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:11px;border:1px solid #2a2a2a;background:rgba(255,255,255,.03);color:#d6d6d6;font-size:12px;font-weight:600;white-space:nowrap;text-decoration:none;transition:background .25s,border-color .25s,color .25s;flex:1 1 auto;min-width:0}
@media(min-width:1000px){.act{flex:0 0 auto}}
.act:hover{background:rgba(255,255,255,.07);border-color:#3a3a3a;color:#fff}
.act.hot{background:#ededed;color:#0a0a0a;border-color:#ededed}.act.hot:hover{background:#fff;color:#0a0a0a}
.act .n{min-width:18px;height:18px;border-radius:9px;background:#e0a050;color:#0a0a0a;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
.act.dim{color:#6f6f6f;border-style:dashed}.act.dim .n{background:#262626;color:#8f8f8f}
.act svg{width:14px;height:14px;flex-shrink:0}
@media(max-width:999px){.act svg,.act .lx{display:none}}
.chart{position:relative;display:flex;flex-direction:column;min-width:0}
.chart .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chart .hd small{font-size:12px;color:#8f8f8f}
.chart .hd b{font-family:Outfit,Inter,sans-serif;font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .lg2{display:flex;gap:12px;font-size:11px;color:#8f8f8f;margin-top:2px;flex-wrap:wrap}
.chart .lg2 i{display:inline-block;width:14px;height:0;border-top:2px solid #ededed;vertical-align:middle;margin-right:5px}
.chart .lg2 i.d{border-top:2px dashed #6a6a6a}.chart .lg2 i.p{border-top:2px dotted #5fd3a2}.chart .lg2 i.p.o{border-color:#e0a050}
.plot{position:relative;flex:1;min-height:110px;margin-top:10px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.today{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;animation:hTdy 2.4s ease-out infinite}
@keyframes hTdy{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.hz{position:absolute;top:0;bottom:0}
.hz .gl{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.12);opacity:0;transition:opacity .15s}
.hz .tt,.bw .tt{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translate(-50%,4px);white-space:nowrap;background:#1d1d1d;border:1px solid #333;border-radius:8px;padding:5px 8px;font-size:11px;color:#bdbdbd;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;z-index:5}
.hz .tt b,.bw .tt b{color:#fff}
.hz:hover .gl,.hz:hover .tt,.bw:hover .tt{opacity:1}.hz:hover .tt,.bw:hover .tt{transform:translate(-50%,0)}
.xax{display:flex;justify-content:space-between;font-size:10.5px;color:#5f5f5f;margin-top:6px;font-variant-numeric:tabular-nums}
.open .cl{stroke-dasharray:1000;stroke-dashoffset:1000;animation:hDraw 1.6s cubic-bezier(.4,0,.2,1) forwards;animation-delay:1.4s}
.open .ca,.open .cp,.open .today{opacity:0;animation:hOn .8s ease forwards;animation-delay:2.6s}
.open .today{animation:hOn .3s ease 2.9s forwards,hTdy 2.4s ease-out 3s infinite}
.ringw.r2{width:134px;height:134px;margin:0;flex-shrink:0}
@media(min-width:1000px){.ringw.r2{width:190px;height:190px;margin:12px auto 6px}.ringw.r2 .ctr b{font-size:28px}}
.ringw.r2 .ctr b{font-size:16px}.ringw.r2 .ctr small{font-size:10.5px}
.ringw.r2 svg.tk{transform:none;position:absolute;inset:0}
.tick{stroke:#262626;stroke-width:1.4;stroke-linecap:round}.tick.lit{stroke:#7a7a7a}
.open .tick.lit{opacity:0;animation:hOn .2s ease forwards}
.pace{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px}
.open .pace{opacity:0;animation:hOn .4s ease 3.4s forwards}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap}
.status.g{color:#5fd3a2;background:rgba(95,211,162,.1)}.status.o{color:#e0a050;background:rgba(224,160,80,.1)}.status.n{color:#9a9a9a;background:#1a1a1a}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor}
.legend{font-size:11px;color:#6f6f6f;display:flex;align-items:center;gap:5px}
.a-goal.g2{gap:8px}
.a-goal.g2 h3{margin-bottom:2px}
@media(max-width:999px){.a-goal.g2{flex-direction:row;align-items:center;text-align:left;gap:16px}.g2 .gtx{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}}
@media(min-width:1000px){.a-goal.g2{justify-content:center}.g2 .gtx{display:contents}}
.bars{display:flex;align-items:flex-end;gap:5px;height:46px;margin-top:12px}
.bw{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.br{width:100%;border-radius:4px 4px 2px 2px;background:#2a2a2a;transform-origin:bottom;min-height:3px}
.bw:last-child .br{background:#ededed}
.bw:hover .br{background:#5a5a5a}.bw:last-child:hover .br{background:#fff}
.open .br{transform:scaleY(0);animation:hGrow .7s cubic-bezier(.2,.9,.25,1.1) forwards;animation-delay:var(--bd,1.8s)}
.days{display:flex;gap:5px;margin-top:5px}.days span{flex:1;text-align:center;font-size:10px;color:#5a5a5a;text-transform:uppercase}
.kp .tr{white-space:nowrap}

<script>
const pad = n => String(n).padStart(2, "0");
const todayIso = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const dayLbl = d => d === todayIso ? "Aujourd'hui" : new Date(d + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric" }).replace(/^./, c => c.toUpperCase());
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const desk = () => innerWidth >= 1000;
let ME = null, D = null, MODE = "quick", tick = null, T0 = 0, PICK = null;

/* ---------------- Petits outils ---------------- */
const STAR4 = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.2 9.8 22.5 12 14.2 14.2 12 22.5 9.8 14.2 1.5 12 9.8 9.8Z" fill="#fff"/></svg>';
function stars() { let h = ""; for (let i = 0; i < 55; i++) { const r = (0.8 + Math.random() * 1.2).toFixed(1); h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;width:${r}px;height:${r}px;opacity:${(.25 + Math.random() * .55).toFixed(2)};animation-delay:${(-Math.random() * 5).toFixed(1)}s;animation-duration:${(3 + Math.random() * 4).toFixed(1)}s"></i>`; } return h; }
function spark(vals, delay) {
  const w = 100, h = 30, n = vals.length, mx = Math.max(...vals), mn = Math.min(...vals);
