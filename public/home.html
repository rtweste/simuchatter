<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StellADS">
<link rel="stylesheet" href="/style.css">
<style>
/* ===================== Accueil « bento » ===================== */
.hm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:10px}
.hm > *{min-width:0}
.b{background:#111;border:1px solid #1f1f1f;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-sizing:border-box}
.b h3{margin:0;font-size:13px;font-weight:600;color:#d0d0d0}
.a-hero{grid-column:1/-1}.a-goal{grid-column:1;grid-row:span 2}.a-k1{grid-column:2}.a-k2{grid-column:2}.a-k3{display:none}
.a-shift,.a-pod,.a-feed{grid-column:1/-1}
@media(min-width:1000px){
  .hm{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .a-hero{grid-column:1/4;grid-row:1}.a-goal{grid-column:4;grid-row:1/3}
  .a-k1{grid-column:1;grid-row:2}.a-k2{grid-column:2;grid-row:2}.a-k3{display:block;grid-column:3;grid-row:2}
  .a-shift,.a-feed{grid-column:1/3;grid-row:3}.a-pod{grid-column:3/5;grid-row:3}
  .hm.adm .a-pod{grid-column:1/3}.hm.adm .a-feed{grid-column:3/5}
}
/* en-tête vivant */
.hero{background:#0c0c0e;border-color:#1d1d22;padding:20px 22px}
.stars{position:absolute;inset:0;pointer-events:none;animation:hDrift 60s linear infinite}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:hTw ease-in-out infinite}
@keyframes hTw{50%{opacity:.15}}
@keyframes hDrift{to{transform:translateY(-40px)}}
.hero .glow{position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);pointer-events:none;animation:hBr 7s ease-in-out infinite}
@keyframes hBr{50%{transform:scale(1.12);opacity:.7}}
@media(max-width:600px){.hp{display:none}}
.hi{position:relative;font-family:Outfit,Inter,sans-serif;font-weight:300;font-size:34px;line-height:1.15;margin-top:6px}
@media(max-width:600px){.hi{font-size:30px}}
.hline{position:relative;margin-top:10px;font-size:14px;color:#bdbdbd;line-height:1.5}
.hline b{color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 11px;font-size:12.5px;color:#e6e6e6;white-space:nowrap;margin-right:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:#555}
.pill.on i{background:#3ccf91;box-shadow:0 0 0 3px rgba(60,207,145,.15)}
/* objectif */
.a-goal{display:flex;flex-direction:column;align-items:center;text-align:center}
.ringw{position:relative;margin:12px auto 6px;width:128px;height:128px}
@media(min-width:1000px){.ringw{width:170px;height:170px}}
.ringw svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
.ringw .fg{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
.ringw .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringw .ctr b{font-family:Outfit,Inter,sans-serif;font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
@media(min-width:1000px){.ringw .ctr b{font-size:30px}}
.ringw .ctr small{font-size:11.5px;color:#8f8f8f;margin-top:2px}
.proj{font-size:12.5px;color:#9a9a9a;line-height:1.5}
.proj b{color:#fff;font-weight:600}
.goal-done .fg{stroke:#5fd3a2}
/* chiffres + mini-courbes */
.kp small{display:block;font-size:12px;color:#8f8f8f}
.kp .v{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:6px}
.kp .v b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(min-width:1000px){.kp .v b{font-size:24px}}
.kp .tr{font-size:11.5px;font-weight:600;color:#5fd3a2}
.kp .tr.dn{color:#c99a62}.kp .tr.nt{color:#8f8f8f}
.spk{display:block;width:100%;height:40px;margin-top:10px}
/* podium */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:14px;min-height:180px}
.pc{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pc .pa{width:38px;height:38px;border-radius:50%;background:#1d1d1d;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-transform:uppercase}
.pc.p1 .pa{width:46px;height:46px;background:#ededed;color:#0a0a0a;border:0;box-shadow:0 0 24px rgba(255,255,255,.18)}
.pc.me .pa{outline:2px solid #ededed;outline-offset:3px}
.pc .pn{font-size:12px;font-weight:600;text-align:center}
.pc .pm{font-size:11px;color:#8f8f8f;font-variant-numeric:tabular-nums}
.pc .bar{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(#1f1f1f,#151515);border:1px solid #262626;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:Outfit,Inter,sans-serif;font-size:22px;color:#6f6f6f;transform-origin:bottom;box-sizing:border-box}
.pc.p1 .bar{background:linear-gradient(#2a2a2a,#171717);border-color:#3a3a3a;color:#d0d0d0}
.pod-note{font-size:12.5px;color:#bdbdbd;text-align:center;margin-top:10px}
.pod-note b{color:#fff}
.empty2{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
/* shift */
.nxt{font-size:12.5px;color:#9a9a9a;margin-top:6px;line-height:1.5}.nxt b{color:#fff}
.slide{position:relative;display:block;width:100%;height:56px;border-radius:28px;background:#171717;border:1px solid #262626;overflow:hidden;margin-top:14px;cursor:pointer;padding:0;font:inherit;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.slide .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:40px;font-size:13.5px;font-weight:600;background:linear-gradient(100deg,#6f6f6f 35%,#fff 50%,#6f6f6f 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hSh 2.6s linear infinite}
@keyframes hSh{from{background-position:120% 0}to{background-position:-120% 0}}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:28px;background:rgba(60,207,145,.18)}
.slide .knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#ededed;color:#0a0a0a;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.slide .knob svg{width:20px;height:20px}
.slide.anim .knob,.slide.anim .fill{transition:left .45s cubic-bezier(.6,0,.3,1),width .45s cubic-bezier(.6,0,.3,1)}
.slide:not(.drag):not(.anim) .knob{animation:hNudge 2.4s ease-in-out 3s infinite}
@keyframes hNudge{0%,70%,100%{transform:none}80%{transform:translateX(14px)}90%{transform:translateX(0)}}
.mdl{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#8f8f8f}
.mdl select{width:auto;min-width:140px;height:34px;padding:0 10px;font-size:13px}
.live{display:flex;align-items:center;gap:12px;margin-top:12px}
.live .dot{width:10px;height:10px;border-radius:50%;background:#3ccf91;animation:hPl 2s ease-out infinite;flex-shrink:0}
@keyframes hPl{0%{box-shadow:0 0 0 0 rgba(60,207,145,.5)}100%{box-shadow:0 0 0 10px rgba(60,207,145,0)}}
.live .tm{font-family:Outfit,Inter,sans-serif;font-weight:300;font-size:34px;font-variant-numeric:tabular-nums}
.live .stop{margin-left:auto}
.wk{margin-top:16px;border-top:1px solid #1c1c1c;padding-top:6px;display:none}
@media(min-width:1000px){.wk{display:block}}
.wk div{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid #191919;color:#bdbdbd}
.wk div:last-child{border:0}.wk b{color:#fff;font-weight:600}
/* fil d'activité */
.feed{display:flex;flex-direction:column;margin-top:10px}
.fi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1b1b1b;font-size:12.5px}
.fi:last-child{border:0}
.fi.new{animation:hFin .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes hFin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.fi .fa{width:28px;height:28px;border-radius:50%;background:#1c1c1c;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.fi .ft{flex:1;min-width:0;color:#cfcfcf;line-height:1.4}.fi .ft b{color:#fff}
.fi .ago{font-size:11px;color:#6f6f6f;white-space:nowrap}
.tg{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 7px;margin-left:4px;white-space:nowrap}
.tg.g{color:#5fd3a2;background:rgba(95,211,162,.1)}.tg.o{color:#e0b060;background:rgba(224,176,96,.1)}.tg.r{color:#e0a3a3;background:rgba(224,163,163,.1)}
.livebadge{position:absolute;right:18px;top:18px;display:flex;align-items:center;gap:6px;font-size:11px;color:#8f8f8f}
.livebadge i{width:7px;height:7px;border-radius:50%;background:#e06060;animation:hPl2 1.6s ease-in-out infinite}
@keyframes hPl2{50%{opacity:.3}}
/* compteur à rouleaux */
.odo{display:inline-flex;font-variant-numeric:tabular-nums}
.oc{display:inline-block;width:.6em;height:1.15em;overflow:hidden;vertical-align:bottom;-webkit-mask-image:linear-gradient(transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 22%,#000 78%,transparent 100%)}
.os{display:flex;flex-direction:column;align-items:center}
.os span{display:block;height:1.15em;line-height:1.15em}

/* ===================== Ouverture (1 fois par session) ===================== */
.open .b{opacity:0;animation:hUnfold .85s cubic-bezier(.2,1.15,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes hUnfold{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.84);filter:blur(6px)}60%{filter:none}to{opacity:1;transform:none;filter:none}}
.open .stars{opacity:0;animation:hDrift 60s linear infinite,hOn .9s ease 1s forwards}
@keyframes hOn{to{opacity:1}}
.open .spl{stroke-dasharray:300;stroke-dashoffset:300;animation:hDraw 1.5s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--sd,1.6s)}
.open .spa{opacity:0;animation:hOn .8s ease 2.4s forwards}
@keyframes hDraw{to{stroke-dashoffset:0}}
.open .pc .bar{transform:scaleY(0);animation:hGrow .8s cubic-bezier(.2,.9,.25,1.15) forwards;animation-delay:var(--bd,1.8s)}
.open .pc .pa{opacity:0;animation:hPop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--pd,2.3s)}
@keyframes hGrow{to{transform:scaleY(1)}}
@keyframes hPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.quick .b{animation:hQuick .4s cubic-bezier(.2,.75,.2,1) both;animation-delay:var(--qd,0s)}
@keyframes hQuick{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fx{position:fixed;inset:0;z-index:150;pointer-events:none;overflow:hidden}
.comet{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;offset-rotate:auto;opacity:0;animation:hFly .95s cubic-bezier(.55,0,.25,1) .15s forwards}
.comet svg{position:absolute;inset:0;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,255,255,.7))}
.comet .tail{position:absolute;right:8px;top:50%;width:130px;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9))}
@keyframes hFly{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
.burst{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1px solid rgba(255,255,255,.7);opacity:0;animation:hBst .9s cubic-bezier(.2,.7,.2,1) 1.05s forwards}
.burst.b2{animation-delay:1.15s;border-color:rgba(255,255,255,.4)}
@keyframes hBst{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(6)}}
.sweep{position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.07) 49%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.07) 51%,transparent 58%);background-size:300% 100%;background-position:120% 0;opacity:0;animation:hSwp 1.3s cubic-bezier(.4,0,.2,1) 2.5s forwards}
@keyframes hSwp{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}
.kick .lg-sh .star{animation:hKick .6s cubic-bezier(.3,1.6,.5,1) .05s}
@keyframes hKick{40%{transform:scale(2.2) rotate(45deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.open .b,.quick .b,.open .spl,.open .pc .bar,.open .pc .pa{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}.fx{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <div class="wrap"><div class="hm" id="hm">
      <div class="b sk-card a-hero"><div class="sk" style="width:220px;height:10px"></div><div class="sk" style="width:240px;height:30px;margin-top:12px"></div><div class="sk" style="width:60%;height:12px;margin-top:14px"></div></div>
      <div class="b sk-card a-goal"><div class="sk" style="width:130px;height:130px;border-radius:50%;margin:20px auto"></div></div>
      <div class="b sk-card a-k1"><div class="sk" style="width:60%;height:10px"></div><div class="sk" style="width:50%;height:20px;margin-top:12px"></div><div class="sk" style="height:34px;margin-top:12px"></div></div>
      <div class="b sk-card a-k2"><div class="sk" style="width:60%;height:10px"></div><div class="sk" style="width:50%;height:20px;margin-top:12px"></div><div class="sk" style="height:34px;margin-top:12px"></div></div>
      <div class="b sk-card a-k3"><div class="sk" style="width:60%;height:10px"></div><div class="sk" style="width:50%;height:20px;margin-top:12px"></div><div class="sk" style="height:34px;margin-top:12px"></div></div>
      <div class="b sk-card a-shift"><div class="sk" style="width:120px;height:12px"></div><div class="sk" style="height:56px;border-radius:28px;margin-top:20px"></div></div>
    </div></div>
  </main>
</div>
<script src="/common.js"></script>
<script>
const pad = n => String(n).padStart(2, "0");
const todayIso = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const dayLbl = d => d === todayIso ? "Aujourd'hui" : new Date(d + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric" }).replace(/^./, c => c.toUpperCase());
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const desk = () => innerWidth >= 1000;
let ME = null, D = null, MODE = "quick", tick = null, T0 = 0;

/* ---------------- Petits outils ---------------- */
const STAR4 = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.2 9.8 22.5 12 14.2 14.2 12 22.5 9.8 14.2 1.5 12 9.8 9.8Z" fill="#fff"/></svg>';
function stars() { let h = ""; for (let i = 0; i < 55; i++) { const r = (0.8 + Math.random() * 1.2).toFixed(1); h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;width:${r}px;height:${r}px;opacity:${(.25 + Math.random() * .55).toFixed(2)};animation-delay:${(-Math.random() * 5).toFixed(1)}s;animation-duration:${(3 + Math.random() * 4).toFixed(1)}s"></i>`; } return h; }
function spark(vals, delay) {
  const w = 100, h = 30, n = vals.length, mx = Math.max(...vals), mn = Math.min(...vals);
  const flat = mx === mn, pts = vals.map((v, i) => [i / (n - 1) * w, flat ? h * .6 : h - 3 - (v - mn) / (mx - mn) * (h - 6)]);
  const d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="spa" d="${d} L${w} ${h} L0 ${h} Z" fill="rgba(255,255,255,.05)"/><path class="spl" style="--sd:${delay}s" d="${d}" fill="none" stroke="#ededed" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
const trendTxt = t => t > 0 ? [`↑ ${t} %`, ""] : t < 0 ? [`↓ ${-t} %`, "dn"] : ["stable", "nt"];
// compteur à rouleaux : chaque chiffre est une colonne qui défile
function odo(str) {
  return `<span class="odo" data-odo="${esc(str)}">${String(str).split("").map(c => /\d/.test(c)
    ? `<span class="oc"><span class="os" data-d="${c}">${Array.from({ length: 20 }, (_, i) => `<span>${i % 10}</span>`).join("")}</span></span>` : `<span>${c === " " ? "&nbsp;" : esc(c)}</span>`).join("")}</span>`;
}
function rollOdos(startMs) {
  const cols = [...document.querySelectorAll("#hm .os")];
  if (MODE !== "open" || reduce) { cols.forEach(s => s.style.transform = `translateY(${-(10 + +s.dataset.d) * 1.15}em)`); return; }
  const groups = [...document.querySelectorAll("#hm .odo")];
  const t0 = performance.now();
  const step = now => {
    const el = now - t0; let busy = false;
    groups.forEach((g, gi) => [...g.querySelectorAll(".os")].forEach((s, i) => {
      const target = 10 + +s.dataset.d, dur = 900 + i * 120, x = Math.min(1, Math.max(0, (el - startMs - gi * 120 - i * 90) / dur));
      const q = 1 - Math.pow(1 - x, 4), v = x > 0 && x < 1 ? target * 4 * Math.pow(1 - x, 3) / dur : 0;
      s.style.transform = `translateY(${(-target * q * 1.15).toFixed(3)}em)`; s.style.filter = `blur(${Math.min(2.5, v * 18).toFixed(2)}px)`;
      if (x < 1) busy = true;
    }));
    if (busy) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const ago = t => { const m = Math.round((Date.now() - t) / 6e4); return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.floor(m / 60)} h` : `il y a ${Math.floor(m / 1440)} j`; };

/* ---------------- Blocs ---------------- */
// position de chaque carte dans la vague d'ouverture : délai + direction d'où elle arrive
const WAVE = { hero: [0, 40, 40], goal: [.1, -50, 30], k1: [.16, 30, 0], k2: [.2, 0, 0], k3: [.24, -30, 0], shift: [.3, 40, -40], feed: [.36, -40, -40], pod: [.36, -40, -40] };
const WAVE_M = { hero: [0, 0, 30], goal: [.1, 20, 20], k1: [.16, -20, 20], k2: [.22, -20, 10], k3: [.22, 0, 0], shift: [.28, 0, -20], feed: [.28, 0, -20], pod: [.34, 0, -30] };
const wv = k => { const [d, x, y] = (desk() ? WAVE : WAVE_M)[k]; return `--d:${(d + .9).toFixed(2)}s;--dx:${x}px;--dy:${y}px;--qd:${(d * .4).toFixed(2)}s`; };
function heroB(name, pill, pillOn, line) {
  const h = new Date().getHours(), hello = h < 5 ? "Bonne nuit" : h < 18 ? "Bonjour" : "Bonsoir";
  const date = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  return `<div class="b hero a-hero" style="${wv("hero")}"><div class="stars">${stars()}</div><span class="glow"></span>
    <div class="eyebrow" style="position:relative;margin:0">${esc(date)}<span class="hp"> · période du ${esc(D.period.label)}</span></div>
    <div class="hi" id="hello">${hello} ${esc(name.charAt(0).toUpperCase() + name.slice(1))}</div>
    <div class="hline">${pill ? `<span class="pill ${pillOn ? "on" : ""}"><i></i>${pill}</span>` : ""}</div>
    <div class="hline" style="margin-top:8px">${line}</div></div>`;
}
function goalB(title, valStr, target, pct, proj) {
  const R = 79, C = 2 * Math.PI * R, p = Math.max(0, Math.min(1, pct));
  return `<div class="b a-goal ${pct >= 1 ? "goal-done" : ""}" style="${wv("goal")}"><h3>${title}</h3>
    <div class="ringw"><svg viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="${R}" fill="none" stroke="#1b1b1b" stroke-width="12"/>
      <circle class="fg" cx="85" cy="85" r="${R}" fill="none" stroke="#ededed" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${(C * (1 - p)).toFixed(1)}" style="filter:drop-shadow(0 0 6px rgba(255,255,255,.25))"/></svg>
      <div class="ctr" role="img" aria-label="${esc(valStr)} sur ${esc(target)}"><b>${odo(valStr)}</b><small>sur ${esc(target)}</small></div></div>
    <div class="proj">${proj}</div></div>`;
}
function kpiB(k, label, valStr, trend, vals, href) {
  const [tt, tc] = Array.isArray(trend) ? trend : [trend, "nt"];
  const tag = href ? "a" : "div";
  return `<${tag} class="b kp a-${k}" ${href ? `href="${href}" style="text-decoration:none;color:inherit;${wv(k)}"` : `style="${wv(k)}"`}><small>${label}</small>
    <div class="v"><b>${odo(valStr)}</b><span class="tr ${tc}">${tt}</span></div>${spark(vals, (WAVE[k][0] + 1.6).toFixed(2))}</${tag}>`;
}
function podB(rows, note) {
  if (!rows.length) return `<div class="b a-pod" style="${wv("pod")}"><h3>Classement de la période</h3><div class="empty2">Aucune vente validée pour l'instant sur la période.</div></div>`;
  const order = [rows[1], rows[0], rows[2]].map((r, i) => r && { ...r, rank: [2, 1, 3][i] }).filter(Boolean);
  const H = desk() ? { 1: 170, 2: 125, 3: 92 } : { 1: 120, 2: 88, 3: 66 }, DL = { 2: 1.85, 1: 2, 3: 2.15 };
  return `<div class="b a-pod" style="${wv("pod")};display:flex;flex-direction:column"><h3>Classement de la période</h3>
    <div class="pod" style="flex:1">${order.map(r => `<div class="pc p${r.rank} ${r.me ? "me" : ""}"><span class="pa" style="--pd:${DL[r.rank] + .5}s">${esc(r.username[0])}</span>
      <span class="pn">${esc(r.username)}${r.me ? " · toi" : ""}</span><span class="pm">${eur(r.total)}</span>
      <div class="bar" style="height:${H[r.rank]}px;--bd:${DL[r.rank]}s">${r.rank}</div></div>`).join("")}</div>
    ${note ? `<div class="pod-note">${note}</div>` : ""}</div>`;
}

/* ---------------- Chatter ---------------- */
function renderChatter() {
  const s = D.sales, today = D.upcoming.filter(x => x.date === todayIso), next = D.upcoming[0];
  const pill = D.open ? `En shift sur ${esc(D.open.model_name)}` : next ? `Prochain shift ${next.date === todayIso ? "à " + next.start : dayLbl(next.date).toLowerCase() + " à " + next.start}` : "Aucun shift prévu";
  const gapBest = D.best > 0 ? D.best - s.validated : 0;
  const line = D.best > 0 && s.validated >= D.best ? `<b>Nouveau record</b> : tu as dépassé ta meilleure période (${eur(D.best)}) !`
    : gapBest > 0 ? `Plus que <b>${eur(gapBest)}</b> de ventes pour battre ta meilleure période`
    : s.pending > 0 ? `<b>${eur(s.pending)}</b> en attente de validation par le manager`
    : `Déclare tes ventes avec la capture : elles comptent pour ta commission.`;
  const proj = s.commission > 0 ? `À ce rythme, tu finis à<br><b>${eur(D.projection)}</b> de commission` : `Ta commission de la période<br>apparaîtra ici`;
  const note = D.rank === 1 ? `Tu es <b>1ᵉʳ</b> de la période, bravo !` : D.rank ? `Tu es <b>${D.rank}ᵉ</b>, à <b>${eur(D.gap)}</b> de ${esc(D.above)}` : "";
  $("hm").className = "hm " + MODE;
  $("hm").innerHTML = heroB(ME.username, pill, !!D.open, line)
    + goalB("Objectif commission", eur(s.commission), eur(D.goal).replace(/,00/, ""), D.goal ? s.commission / D.goal : 0, proj)
    + kpiB("k1", "Ventes validées", eur(s.validated), trendTxt(D.trend.sales), D.series.sales, "/ventes")
    + kpiB("k2", "Heures pointées", hrs(D.hours), trendTxt(D.trend.hours), D.series.hours, "/planning")
    + kpiB("k3", "En attente", eur(s.pending), [`${D.series.pending.reduce((a, b) => a + b, 0) || "aucune"} vente${D.series.pending.reduce((a, b) => a + b, 0) > 1 ? "s" : ""}`, "nt"], D.series.pending, "/ventes")
    + shiftB(today, next)
    + podB(D.leaderboard, note);
  bindShift();
}
function shiftB(today, next) {
  const sel = D.models.map(m => `<option value="${m.id}" ${next && next.model_name === m.name ? "selected" : ""}>${esc(m.name)}</option>`).join("");
  const wk = D.upcoming.slice(D.open ? 0 : 1, 4).map(x => `<div><span><b>${dayLbl(x.date)}</b> · ${esc(x.model_name)}</span><span>${x.start} – ${x.end}</span></div>`).join("");
  return `<div class="b a-shift" style="${wv("shift")}"><h3>Mon shift</h3>${D.open
    ? `<div class="nxt">En shift sur <b>${esc(D.open.model_name)}</b> depuis ${new Date(D.open.start_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</div>
       <div class="live"><span class="dot"></span><span class="tm" id="timer">00:00:00</span><button class="btn ghost small stop" id="outBtn">Terminer</button></div>`
    : `<div class="nxt">${next ? `Prochain créneau : <b>${dayLbl(next.date).toLowerCase()} ${next.start} – ${next.end}</b> · ${esc(next.model_name)}` : "Aucun créneau prévu : tu peux quand même pointer."}</div>
       <button class="slide" id="slide" aria-label="Glisser pour commencer mon shift"><span class="fill" id="sFill"></span><span class="lbl">Glisser pour commencer mon shift</span><span class="knob" id="sKnob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></button>
       <label class="mdl">Créatrice <select id="inModel">${sel}</select></label>`}
    ${wk ? `<div class="wk">${wk}</div>` : ""}</div>`;
}
function bindShift() {
  clearInterval(tick);
  if (D.open) {
    const upd = () => { const t = Math.floor((Date.now() - D.open.start_at) / 1000); if ($("timer")) $("timer").textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`; };
    upd(); tick = setInterval(upd, 1000);
    $("outBtn").onclick = async () => { $("outBtn").disabled = true; const dur = (Date.now() - D.open.start_at) / 3.6e6;
      try { await api("/api/clock/out", { body: {} }); notify("Shift terminé", `${hrs(dur)} pointées sur ${D.open.model_name}`, "ok"); } catch (e) { notify("Impossible de terminer le shift", e.message, "err"); }
      MODE = "static"; load(); };
    return;
  }
  // glisser (ou toucher) pour commencer
  const sl = $("slide"), kn = $("sKnob"), fl = $("sFill"); let x0 = null, max = 0, done = false;
  const setX = x => { kn.style.left = (4 + x) + "px"; fl.style.width = (56 + x) + "px"; };
  const go = async () => {
    if (done) return; done = true; sl.classList.add("anim"); setX(max); SND.shift();
    const name = $("inModel").selectedOptions[0]?.textContent || "";
    try { await api("/api/clock/in", { body: { model_id: $("inModel").value } }); notify("Shift commencé", `${name} · bon courage !`, "ok"); }
    catch (e) { notify("Impossible de pointer", e.message, "err"); }
    setTimeout(() => { MODE = "static"; load(); }, 450);
  };
  sl.addEventListener("pointerdown", e => { if (done) return; x0 = e.clientX; max = sl.clientWidth - 56; sl.classList.add("drag"); sl.classList.remove("anim"); sl.setPointerCapture(e.pointerId); });
  sl.addEventListener("pointermove", e => { if (x0 == null || done) return; setX(Math.max(0, Math.min(max, e.clientX - x0))); });
  const end = e => { if (x0 == null || done) return; const dx = e.clientX - x0; x0 = null; sl.classList.remove("drag");
    if (dx > max * .7 || Math.abs(dx) < 6) go(); else { sl.classList.add("anim"); setX(0); } };
  sl.addEventListener("pointerup", end); sl.addEventListener("pointercancel", () => { x0 = null; sl.classList.add("anim"); setX(0); });
  sl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); max = sl.clientWidth - 56; go(); } });
}

/* ---------------- Manager ---------------- */
function renderAdmin() {
  const t = D.totals, ps = D.pendingSales;
  const line = ps.n ? `<b>${ps.n} vente${ps.n > 1 ? "s" : ""}</b> attend${ps.n > 1 ? "ent" : ""} ta validation · <a href="/ventes" style="color:#fff">Valider →</a>`
    : D.missingRevenue.length ? `CA brut à saisir pour <b>${D.missingRevenue.map(esc).join(", ")}</b> · <a href="/compta" style="color:#fff">Compta →</a>`
    : `Tout est à jour. Belle période !`;
  const proj = t.brut > 0 ? `Projection fin de période :<br><b>${eur(D.projection)}</b>` : `Saisissez le CA brut dans la Compta<br>pour suivre l'objectif`;
  const goalTxt = desk() ? eur(t.brut).replace(/,00/, "") : (t.brut >= 1000 ? (Math.round(t.brut / 100) / 10).toString().replace(".", ",") + " k€" : eur(t.brut));
  $("hm").className = "hm adm " + MODE;
  $("hm").innerHTML = heroB(ME.username, `${D.live.length} chatter${D.live.length > 1 ? "s" : ""} en shift`, D.live.length > 0, line)
    + goalB("Objectif CA de la période", goalTxt, desk() ? eur(D.goal).replace(/,00/, "") : (D.goal >= 1000 ? Math.round(D.goal / 1000) + " k€" : eur(D.goal)), D.goal ? t.brut / D.goal : 0, proj)
    + kpiB("k1", "Marge de l'agence", eur(t.margin), trendTxt(D.marginTrend), D.series.sales, "/compta")
    + kpiB("k2", "Ventes à valider", String(ps.n), [eur(ps.total) + " brut", "nt"], D.series.pending, "/ventes")
    + kpiB("k3", "En shift maintenant", String(D.live.length), [`sur ${D.activeChatters}`, "nt"], D.series.shifts, "/planning")
    + feedB()
    + podB(D.leaderboard.slice(0, 3), "");
}
let FEED_KEYS = new Set();
function feedB() {
  const items = D.feed.slice(0, desk() ? 6 : 5);
  const html = items.map(e => { const k = e.t + e.who + e.text, isNew = FEED_KEYS.size && !FEED_KEYS.has(k);
    return `<div class="fi ${isNew ? "new" : ""}"><span class="fa">${esc(e.who[0])}</span><span class="ft"><b>${esc(e.who)}</b> ${esc(e.text)}${e.tag ? `<span class="tg ${e.cls}">${esc(e.tag)}</span>` : ""}</span><span class="ago">${ago(e.t)}</span></div>`; }).join("");
  FEED_KEYS = new Set(items.map(e => e.t + e.who + e.text));
  return `<div class="b a-feed" style="${wv("feed")}"><h3>Activité en direct</h3><span class="livebadge"><i></i>en direct</span>
    <div class="feed" id="feed">${html || `<div class="empty2">Rien pour l'instant. Les ventes, pointages et simulations apparaîtront ici.</div>`}</div></div>`;
}

/* ---------------- Ouverture ---------------- */
function opening() {
  document.body.classList.add("kick");
  const logo = [...document.querySelectorAll("#sidebar .logo")].find(e => e.offsetParent) || document.querySelector("#sidebar .logo");
  const hello = $("hello"); if (!logo || !hello) return;
  const a = logo.getBoundingClientRect(), b = hello.getBoundingClientRect(), W = innerWidth;
  const sx = a.left + a.width * .62, sy = a.top + a.height / 2, ex = b.left + 40, ey = b.top + b.height / 2;
  const path = `M ${sx} ${sy} C ${sx + W * .5} ${sy - 90}, ${ex + W * .45} ${ey + 240}, ${ex} ${ey}`;
  const fx = document.createElement("div"); fx.className = "fx";
  fx.innerHTML = `<span class="comet" style="offset-path:path('${path}')"><span class="tail"></span>${STAR4}</span>
    <span class="burst" style="left:${ex}px;top:${ey}px"></span><span class="burst b2" style="left:${ex}px;top:${ey}px"></span><span class="sweep"></span>`;
  document.body.appendChild(fx); setTimeout(() => fx.remove(), 4200);
  const t0 = performance.now(), n = document.querySelectorAll("#hm .b").length;
  // affiché juste après l'intro : c'est la page de connexion (qui a reçu le clic) qui joue les sons
  if (EMBED) { try { window.top.postMessage({ type: "stSound", n }, location.origin); } catch (e) {} return; }
  SND.opening(n, t0).then(ok => {
    if (ok) return;
    // son bloqué par le navigateur : au premier geste, on joue la suite de l'ouverture (ou un petit son de bienvenue si elle est finie)
    const once = () => { removeEventListener("pointerdown", once, true); removeEventListener("keydown", once, true);
      SND.unlock(); if (performance.now() - t0 < 3200) SND.opening(n, t0); else if (performance.now() - t0 < 8000) SND.welcome(); };
    addEventListener("pointerdown", once, true); addEventListener("keydown", once, true);
  });
}
function afterRender() {
  // cercle de l'objectif
  const fg = document.querySelector(".ringw .fg");
  if (fg) { const go = () => fg.style.strokeDashoffset = fg.dataset.off; if (MODE === "open" && !reduce) setTimeout(go, 1800); else if (MODE === "quick") setTimeout(go, 80); else { fg.style.transition = "none"; go(); } }
  rollOdos(1250);
  if (MODE === "open" && !reduce) opening();
}

/* ---------------- Chargement ---------------- */
async function load() {
  D = await api("/api/home");
  D.role === "admin" ? renderAdmin() : renderChatter();
  afterRender();
  MODE = "static";
}
(async () => {
  // préparé pendant l'intro : on charge tout, puis on attend le signal de la page de connexion
  let pre = null;
  if (EMBED) {
    pre = api("/api/home");
    await new Promise(res => {
      const t = setTimeout(res, 20000);
      addEventListener("message", e => { if (e.origin !== location.origin || e.data?.type !== "stOpen") return;
        const r = document.documentElement.style; r.setProperty("--sat-in", (e.data.sat || 0) + "px"); r.setProperty("--sab-in", (e.data.sab || 0) + "px");
        clearTimeout(t); res(); });
      try { window.top.postMessage({ type: "stReady" }, location.origin); } catch (e) {}
    });
  }
  ME = await api("/api/me");
  renderShell("home", ME);
  // grande ouverture une seule fois par session (juste après l'intro), version courte ensuite
  try { if (!sessionStorage.getItem("stHome")) { MODE = "open"; sessionStorage.setItem("stHome", "1"); } } catch (e) {}
  if (MODE === "open") await new Promise(r => setTimeout(r, 120));
  if (pre) { try { D = await pre; D.role === "admin" ? renderAdmin() : renderChatter(); afterRender(); MODE = "static"; } catch (e) { await load(); } }
  else await load();
  // le manager voit le fil d'activité se mettre à jour tout seul
  if (ME.role === "admin") setInterval(async () => { try { const d = await api("/api/home"); if (JSON.stringify(d.feed) !== JSON.stringify(D.feed) || d.pendingSales.n !== D.pendingSales.n) { D = d; const f = document.querySelector(".a-feed"); if (f) { const tmp = document.createElement("div"); tmp.innerHTML = feedB(); f.replaceWith(tmp.firstElementChild); } updateBadge(d.pendingSales.n); } } catch (e) {} }, 30000);
  // redessine si on passe de téléphone à ordinateur (taille du podium, textes)
  let wasDesk = desk(); addEventListener("resize", () => { if (desk() !== wasDesk) { wasDesk = desk(); MODE = "static"; D.role === "admin" ? renderAdmin() : renderChatter(); afterRender(); } });
})();
</script>
