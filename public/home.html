<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StellADS">

<link rel="stylesheet" href="/style.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpis .card{padding:18px}
.kpis .card b{font-size:22px}
.kpis a.card{text-decoration:none;color:var(--text);transition:.15s}
.kpis a.card:hover{border-color:#3a3a3a}
.dash{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
.dash > *{min-width:0}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 a{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.card h2 a:hover{color:var(--text)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.list li:last-child{border-bottom:0}
.list .muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.todo li a{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px;width:100%}
.todo .ic{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.todo .ic svg{width:15px;height:15px}
.shift{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shift .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.shift .dot.on{background:var(--good);box-shadow:0 0 0 4px rgba(60,207,145,.15)}
.shift .timer{font-family:Outfit,Inter,sans-serif;font-size:26px;font-weight:300}
.shift select{width:auto;min-width:150px}
.rank{display:flex;align-items:center;gap:10px}
.rank i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.rank i.g{background:#3d3218;color:var(--warn)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shortcuts a{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none;font-weight:500;font-size:13px;background:var(--panel)}
.shortcuts a:hover{border-color:#3a3a3a}
.shortcuts svg{width:18px;height:18px;color:var(--muted)}
/* ===== Motion design ===== */
.kpis .card,.dash .card,.shortcuts a{transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s}
.kpis .card:hover,.dash .card:hover,.shortcuts a:hover{transform:translateY(-3px);border-color:#3a3a3a}
.kpis .card{position:relative;overflow:hidden}
.kpis b{font-variant-numeric:tabular-nums}
.play .rise{opacity:0;transform:translateY(16px);animation:rise .75s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{to{opacity:1;transform:none}}
.play .kpis .card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);transform:translateX(-100%);animation:glint 1.4s ease-out forwards;animation-delay:calc(.5s + var(--i,0) * 70ms)}
@keyframes glint{to{transform:translateX(100%)}}
.play .list li{opacity:0;animation:rise .6s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:calc(.35s + var(--i,0) * 70ms + var(--j,0) * 60ms);transform:translateY(8px)}
.wrap.wait{opacity:0}
.lb-row{flex-wrap:wrap}
.lb-bar{flex-basis:100%;height:5px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:2px}
.lb-bar i{display:block;height:100%;border-radius:5px;background:var(--text);transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.6s + var(--j,0) * 100ms)}
.lb-row:first-child .lb-bar i{background:var(--warn)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shift .dot.on,.live-dot{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,207,145,.5)}100%{box-shadow:0 0 0 10px rgba(60,207,145,0)}}
.shift .timer{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.play .rise,.play .list li{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-area">
    <div class="wrap">
      <div class="pagehead"><div><div class="eyebrow" id="today"></div><h1 id="hello">Bonjour</h1></div></div>
      <div id="content"><div class="card sk-card" style="margin-bottom:20px;display:flex;gap:14px;align-items:center"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div style="flex:1"><div class="sk" style="width:110px;height:10px"></div><div class="sk" style="width:170px;height:20px;margin-top:10px"></div></div><div class="sk" style="width:150px;height:40px;border-radius:10px"></div></div>
        <div class="sk-kpis"><div class="card sk-card"><div class="sk" style="width:60%;height:10px;margin-bottom:14px"></div><div class="sk" style="width:45%;height:20px;margin-bottom:0px"></div></div><div class="card sk-card"><div class="sk" style="width:60%;height:10px;margin-bottom:14px"></div><div class="sk" style="width:45%;height:20px;margin-bottom:0px"></div></div><div class="card sk-card"><div class="sk" style="width:60%;height:10px;margin-bottom:14px"></div><div class="sk" style="width:45%;height:20px;margin-bottom:0px"></div></div><div class="card sk-card"><div class="sk" style="width:60%;height:10px;margin-bottom:14px"></div><div class="sk" style="width:45%;height:20px;margin-bottom:0px"></div></div></div><div class="sk-grid"><div class="card sk-card"><div class="sk" style="width:140px;height:14px;margin-bottom:20px"></div><div class="sk" style="width:100%;height:12px;margin-bottom:12px"></div><div class="sk" style="width:85%;height:12px;margin-bottom:12px"></div><div class="sk" style="width:92%;height:12px;margin-bottom:12px"></div></div><div class="card sk-card"><div class="sk" style="width:140px;height:14px;margin-bottom:20px"></div><div class="sk" style="width:100%;height:12px;margin-bottom:12px"></div><div class="sk" style="width:85%;height:12px;margin-bottom:12px"></div><div class="sk" style="width:92%;height:12px;margin-bottom:12px"></div></div></div></div>
      <h2 id="shortcuts-title" style="font-size:13px;color:var(--muted);font-weight:500;margin:26px 0 10px">Accès rapide</h2>
      <div class="shortcuts" id="shortcuts"></div>
    </div>
  </main>
</div>
<script src="/common.js"></script>
<script>
const pad = n => String(n).padStart(2, "0");
const todayIso = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const dayLbl = d => d === todayIso ? "Aujourd'hui" : new Date(d + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });
// opts.count = [nombre, format] : le chiffre défile jusqu'à sa valeur
const kpi = (label, value, opts = {}) => `<${opts.href ? `a href="${opts.href}"` : "div"} class="card kpi"><small>${label}</small><b ${opts.color ? `style="color:${opts.color}"` : ""} ${opts.count ? `data-count="${Number(opts.count[0]) || 0}" data-fmt="${opts.count[1]}"` : ""}>${value}</b>${opts.sub ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">${opts.sub}</div>` : ""}</${opts.href ? "a" : "div"}>`;
let tick = null;

/* ---------- Chatter ---------- */
function renderChatter(d) {
  const s = d.sales;
  $("content").innerHTML = `
  <div class="card" style="margin-bottom:20px"><div class="shift" id="shiftBox"></div></div>
  <div class="eyebrow" style="margin:0 0 10px">Période du ${esc(d.period.label)}</div>
  <div class="kpis">
    ${kpi("Ventes validées", eur(s.validated), { color: "var(--good)", href: "/ventes", count: [s.validated, "eur"] })}
    ${kpi("En attente de validation", eur(s.pending), { color: s.pending ? "var(--warn)" : "", href: "/ventes", count: [s.pending, "eur"] })}
    ${kpi("Commission estimée", eur(s.commission), { count: [s.commission, "eur"], sub: `${String(s.pct).replace(".", ",")} % de vos ventes validées` })}
    ${kpi("Heures pointées", hrs(d.hours), { href: "/planning", count: [d.hours, "hrs"] })}
  </div>
  <div class="dash">
    <div class="card"><h2>Mes prochains créneaux <a href="/planning">Planning →</a></h2>
      <ul class="list">${d.upcoming.length ? d.upcoming.map(x => `<li><span><b>${dayLbl(x.date)}</b> <span class="muted">· ${esc(x.model_name)}</span></span><span>${x.start} – ${x.end}</span></li>`).join("") : `<li class="empty">Aucun créneau prévu pour l'instant.</li>`}</ul></div>
    <div class="card"><h2>Simulateur <a href="/app">S'entraîner →</a></h2>
      ${d.simu.last ? `<div class="kpi"><small>Dernier score</small><b style="font-size:30px;color:${scoreColor(d.simu.last.score)}">${d.simu.last.score}<span style="font-size:14px;color:var(--muted)"> /100</span></b></div>
        <p class="empty">${d.simu.week} simulation(s) cette semaine${d.simu.avg !== null ? ` · moyenne ${d.simu.avg}/100` : ""}</p>`
        : `<p class="empty">Pas encore de simulation. Entraînez-vous face à un fan simulé pour progresser.</p><a class="btn small" href="/app" style="text-decoration:none;display:inline-block;margin-top:6px">Lancer une simulation</a>`}
    </div>
  </div>`;
  renderShift(d);
}
function renderShift(d) {
  clearInterval(tick);
  if (d.open) {
    $("shiftBox").innerHTML = `<span class="dot on"></span><div><div class="eyebrow" style="margin:0">En shift sur ${esc(d.open.model_name)}</div><div class="timer" id="timer"></div></div><div class="spacer"></div><button class="btn" id="outBtn">Terminer mon shift</button>`;
    const upd = () => { const t = Math.floor((Date.now() - d.open.start_at) / 1000); $("timer").textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`; };
    upd(); tick = setInterval(upd, 1000);
    $("outBtn").onclick = async () => { $("outBtn").disabled = true; const dur = (Date.now() - d.open.start_at) / 3.6e6;
      try { await api("/api/clock/out", { body: {} }); notify("Shift terminé", `${hrs(dur)} pointées sur ${d.open.model_name}`, "ok"); } catch (e) { notify("Impossible de terminer le shift", e.message, "err"); }
      load(); };
  } else {
    const next = d.upcoming[0];
    $("shiftBox").innerHTML = `<span class="dot"></span><div><div class="eyebrow" style="margin:0">Pointage</div><b>Pas de shift en cours</b></div><div class="spacer"></div>
      <select id="inModel" aria-label="Créatrice">${d.models.map(m => `<option value="${m.id}" ${next && next.model_name === m.name ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
      <button class="btn" id="inBtn">Commencer mon shift</button>`;
    $("inBtn").onclick = async () => { $("inBtn").disabled = true; const name = $("inModel").selectedOptions[0]?.textContent || "";
      try { await api("/api/clock/in", { body: { model_id: $("inModel").value } }); notify("Shift commencé", `${name} · bon courage !`, "ok"); } catch (e) { notify("Impossible de pointer", e.message, "err"); }
      load(); };
  }
}

/* ---------- Manager ---------- */
function renderAdmin(d) {
  const t = d.totals, todo = [];
  if (d.pendingSales.n) todo.push(["receipt", `<b>${d.pendingSales.n} vente(s)</b> à valider · ${eur(d.pendingSales.total)}`, "/ventes"]);
  if (d.missingRevenue.length) todo.push(["euro", `CA brut à saisir pour <b>${d.missingRevenue.map(esc).join(", ")}</b>`, "/compta"]);
  if (!d.todayShifts.length) todo.push(["calendar", "Aucun créneau prévu aujourd'hui", "/planning"]);
  $("content").innerHTML = `
  <div class="eyebrow" style="margin:0 0 10px">Période du ${esc(d.period.label)}</div>
  <div class="kpis">
    ${kpi("CA brut", eur(t.brut), { href: "/compta", count: [t.brut, "eur"] })}
    ${kpi("Marge de l'agence", eur(t.margin), { color: t.margin >= 0 ? "var(--good)" : "var(--bad)", href: "/compta", count: [t.margin, "eur"] })}
    ${kpi("Ventes à valider", d.pendingSales.n, { color: d.pendingSales.n ? "var(--warn)" : "", href: "/ventes", count: [d.pendingSales.n, "int"], sub: d.pendingSales.n ? eur(d.pendingSales.total) + " brut" : "Tout est à jour" })}
    ${kpi("En shift maintenant", d.live.length, { href: "/planning", color: d.live.length ? "var(--good)" : "", count: [d.live.length, "int"] })}
  </div>
  <div class="dash">
    <div class="card"><h2>À faire</h2>
      <ul class="list todo">${todo.length ? todo.map(([ic, txt, href]) => `<li><a href="${href}"><span class="ic">${icon(ic)}</span><span style="flex:1">${txt}</span><span class="muted">→</span></a></li>`).join("") : `<li class="empty">Rien à faire pour l'instant. 👍</li>`}</ul></div>
    <div class="card"><h2>En shift maintenant <a href="/planning">Planning →</a></h2>
      <ul class="list">${d.live.length ? d.live.map(c => `<li><span><span class="live-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:8px"></span><b>${esc(c.username)}</b> <span class="muted">· ${esc(c.model_name)}</span></span><span class="muted">depuis ${hrs((Date.now() - c.start_at) / 3.6e6)}</span></li>`).join("") : `<li class="empty">Personne n'est en shift.</li>`}</ul></div>
  </div>
  <div class="dash">
    <div class="card"><h2>Planning du jour <a href="/planning">Voir la semaine →</a></h2>
      <ul class="list">${d.todayShifts.length ? d.todayShifts.map(s => `<li><span><b>${esc(s.username)}</b> <span class="muted">· ${esc(s.model_name)}</span></span><span>${s.start} – ${s.end}</span></li>`).join("") : `<li class="empty">Aucun créneau aujourd'hui.</li>`}</ul></div>
    <div class="card"><h2>Meilleurs vendeurs <a href="/ventes">Ventes →</a></h2>
      <ul class="list">${d.leaderboard.length ? d.leaderboard.map((r, i) => `<li class="lb-row"><span class="rank"><i class="${i === 0 ? "g" : ""}">${i + 1}</i><b>${esc(r.username)}</b></span><span>${eur(r.total)}</span><span class="lb-bar"><i style="--j:${i};width:${Math.max(4, Math.round(r.total / (d.leaderboard[0].total || 1) * 100))}%"></i></span></li>`).join("") : `<li class="empty">Aucune vente validée sur la période.</li>`}</ul>
      <p class="empty" style="margin-top:10px">Simulateur : ${d.simu.week} session(s) cette semaine${d.simu.avg !== null ? ` · score moyen ${d.simu.avg}/100` : ""}</p></div>
  </div>`;
}

/* ---------- Animations d'arrivée ---------- */
let played = false;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function fmtCount(v, f) { return f === "eur" ? eur(v) : f === "hrs" ? hrs(v) : Math.round(v).toLocaleString("fr-FR"); }
function countUp(el) {
  const to = Number(el.dataset.count), f = el.dataset.fmt, D = 1300, delay = 300 + (Number(el.closest(".rise")?.style.getPropertyValue("--i")) || 0) * 70;
  if (!to || reduceMotion) return;
  el.textContent = fmtCount(0, f);
  const t0 = performance.now() + delay;
  const step = now => { const x = Math.min(1, Math.max(0, (now - t0) / D)); el.textContent = fmtCount(to * (1 - Math.pow(1 - x, 3)), f); if (x < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function animateIn() {
  if (played) return; played = true;
  document.querySelector(".wrap").classList.remove("wait");
  const items = [document.querySelector(".pagehead"), ...document.querySelectorAll("#content > .card, #content > .eyebrow, .kpis > .card, .dash > .card, #shortcuts-title, .shortcuts > a")].filter(Boolean);
  items.forEach((el, i) => { el.classList.add("rise"); el.style.setProperty("--i", i); el.querySelectorAll(".list li").forEach((li, j) => { li.style.setProperty("--i", i); li.style.setProperty("--j", j); }); });
  document.querySelectorAll("[data-count]").forEach(countUp);
  document.querySelector(".wrap").classList.add("play");
  setTimeout(() => document.querySelector(".wrap").classList.remove("play"), 3500);  // les mises à jour suivantes s'affichent sans rejouer
}

async function load() {
  const d = await api("/api/home");
  d.role === "admin" ? renderAdmin(d) : renderChatter(d);
  animateIn();
}
(async () => {
  const me = await api("/api/me");
  renderShell("home", me);
  $("hello").textContent = `Bonjour ${me.username}`;
  const t = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  $("today").textContent = t.charAt(0).toUpperCase() + t.slice(1);
  $("shortcuts").innerHTML = MODULES.filter(m => m.id !== "home" && m.roles.includes(me.role)).map(m => `<a href="${m.href}">${icon(m.icon)}${esc(m.label)}</a>`).join("");
  await load();
})();
</script>
</body>
</html>
