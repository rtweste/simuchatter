<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventes — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StellADS">

<link rel="stylesheet" href="/style.css">
<style>
.drop{border:1.5px dashed #3a3a3a;border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;position:relative}
.drop:hover,.drop.over{border-color:var(--text);color:var(--text)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:220px;max-width:100%;border-radius:8px;display:block;margin:0 auto 8px}
.st{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.st.pending{background:#3d3218;color:var(--warn)}.st.validated{background:#173a2c;color:var(--good)}.st.refused{background:#3d1b21;color:var(--bad)}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--panel2)}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.qcard .img{height:260px;background:#000;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.qcard .img img{max-width:100%;max-height:100%;object-fit:contain}
.qcard .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.qcard .meta{font-size:13px;color:var(--muted);line-height:1.5}
.qcard .amount{display:flex;align-items:center;gap:8px}
.qcard .amount input{width:130px;font-size:18px;font-weight:700;text-align:right;padding:8px 10px}
.qcard .actions{display:flex;gap:8px;margin-top:auto}
.qcard .actions .btn{flex:1}
.btn.ok{background:var(--good);color:#06130d}.btn.ok:hover{filter:brightness(1.08)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.mine li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mine{list-style:none;margin:0;padding:0}
.mine .grow{flex:1;min-width:0;font-size:13px;line-height:1.5}
.mine .grow b{font-size:14px}
.strike{text-decoration:line-through;color:var(--muted);font-weight:400;margin-right:6px}
/* ===== Mes ventes en cartes ===== */
.seg{display:flex;background:#141414;border:1px solid #222;border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;height:32px;border:0;border-radius:9px;background:transparent;color:#8f8f8f;font:inherit;font-size:12.5px;font-weight:600;padding:0 6px;white-space:nowrap;transition:background .3s,color .3s}
.seg button.on{background:#ededed;color:#0a0a0a}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.vc{position:relative;background:#111;border:1px solid #1f1f1f;border-radius:16px;overflow:hidden;animation:fadeUp .5s cubic-bezier(.2,.75,.2,1) both;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s}
.vc:hover{transform:translateY(-2px);border-color:#2e2e2e}
.vc .shot{height:150px;background:#161616;position:relative;cursor:zoom-in;overflow:hidden}
.vc .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;opacity:0;transition:opacity .4s}
.vc .shot img.ld{opacity:1}
.vc .shot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(transparent,#111);pointer-events:none}
.vc .meta{padding:9px 12px 12px}
.vc .amt{font-family:Outfit,Inter,sans-serif;font-size:21px;font-weight:400}
.vc .amt .strike{font-size:13px}
.vc small{display:block;color:#8f8f8f;font-size:11.5px;margin-top:2px;line-height:1.4}
.vc .why{font-size:11.5px;color:#d99a9a;margin-top:6px;line-height:1.4}
.bd{position:absolute;top:8px;left:8px;z-index:2;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;border-radius:20px;padding:4px 9px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bd i{width:6px;height:6px;border-radius:50%;background:currentColor}
.bd.validated{color:#5fd3a2;background:rgba(18,38,30,.88)}
.bd.pending{color:#e0b060;background:rgba(40,32,16,.88)}
.bd.pending i{animation:blink 1.4s ease-in-out infinite}
.bd.refused{color:#e0a3a3;background:rgba(40,20,20,.88)}
@keyframes blink{50%{opacity:.25}}
.vc .del{position:absolute;top:6px;right:6px;z-index:3;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#ddd;display:flex;align-items:center;justify-content:center;padding:0}
.emptyv{color:var(--muted);font-size:13px;padding:10px 2px}
.qcard{position:relative;transition:border-color .3s}
@media(max-width:600px){.vg{grid-template-columns:1fr 1fr;gap:10px}.vc .shot{height:130px}.seg button{font-size:11.5px;padding:0 3px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-area">
<div class="wrap">
  <div class="pagehead"><div><div class="eyebrow">Organisation</div><h1>Ventes</h1></div></div>

  <!-- ============ CHATTER ============ -->
  <div id="chatterView" class="hidden">
    <div class="grid">
      <form class="card" id="saleForm">
        <h2>Déclarer une vente</h2>
        <label for="fModel">Créatrice</label><select id="fModel" required></select>
        <label for="fAmount">Montant brut de la vente (€)</label>
        <input id="fAmount" inputmode="decimal" placeholder="ex. 25" required autocomplete="off">
        <label for="fDate">Date et heure de la vente</label><input id="fDate" type="datetime-local" required>
        <label>Capture d'écran de la vente</label>
        <div class="drop" id="drop"><div id="dropTxt">📎 Touchez pour choisir la capture<br><small>ou glissez-la ici</small></div>
          <input type="file" id="fFile" accept="image/*" aria-label="Capture d'écran"></div>
        <label for="fNote">Note (optionnel)</label><input id="fNote" maxlength="300" placeholder="ex. vidéo personnalisée pour Marc">
        <button class="btn" id="fBtn" style="width:100%;margin-top:16px">Envoyer pour validation</button>
        <div class="err" id="fErr"></div>
      </form>
      <div>
        <div class="eyebrow" id="myPeriod" style="margin:0 0 8px"></div>
        <div class="grid3" id="myKpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px"></div>
        <div class="card"><h2>Mes ventes</h2>
          <div class="seg" id="mySeg" role="group" aria-label="Filtrer"><button data-f="" class="on">Toutes</button><button data-f="pending">En attente</button><button data-f="validated">Validées</button><button data-f="refused">Refusées</button></div>
          <div class="vg" id="myList"></div></div>
      </div>
    </div>
  </div>

  <!-- ============ MANAGER ============ -->
  <div id="adminView" class="hidden">
    <div class="tabs">
      <button data-t="queue" class="on" id="tabQueue">À valider</button>
      <button data-t="hist">Historique</button>
    </div>
    <section id="t-queue"><div class="queue" id="queue"></div></section>
    <section id="t-hist" class="hidden">
      <div class="card">
        <div class="row" style="flex-wrap:wrap;margin-bottom:14px">
          <select id="hStatus" style="max-width:180px" aria-label="Statut"><option value="">Tous les statuts</option><option value="validated">Validées</option><option value="refused">Refusées</option><option value="pending">En attente</option></select>
          <select id="hUser" style="max-width:180px" aria-label="Chatter"></select>
          <select id="hPeriod" style="max-width:200px" aria-label="Période"></select>
        </div>
        <div id="histSum" style="margin-bottom:10px;color:var(--muted);font-size:13px"></div>
        <div class="tablewrap" id="hist"></div>
      </div>
    </section>
  </div>
</div>
</main>
</div>
<div class="lightbox hidden" id="lb"><img id="lbImg" alt="Capture d'écran de la vente"></div>

<script src="/common.js"></script>
<script>
const STATUS = { pending: "En attente", validated: "Validée", refused: "Refusée" };
const pad = n => String(n).padStart(2, "0");
const toLocalInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDT = ms => new Date(ms).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const img = id => `/api/sales/${id}/image`;
const parseNum = v => Number(String(v).replace(/\s/g, "").replace(",", "."));
function zoom(src) { $("lbImg").src = src; $("lb").classList.remove("hidden"); }
$("lb").onclick = () => $("lb").classList.add("hidden");
const periodKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${d.getDate() <= 15 ? "A" : "B"}`; };
const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const periodLabel = k => { const [y, m, h] = k.split("-"); const last = new Date(+y, +m, 0).getDate(); return h === "A" ? `1 – 15 ${MONTHS[m - 1]} ${y}` : `16 – ${last} ${MONTHS[m - 1]} ${y}`; };

/* ---------- Réduction de la capture avant envoi (plus rapide, moins lourd) ---------- */
async function compress(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }   // format non lisible par le navigateur : envoi tel quel
}

/* ================= CHATTER ================= */
let FILE = null;
function setFile(f) {
  if (!f || !f.type.startsWith("image/")) { $("fErr").textContent = "Choisissez une image (capture d'écran)."; return; }
  FILE = f; $("fErr").textContent = "";
  const url = URL.createObjectURL(f);
  $("dropTxt").innerHTML = `<img src="${url}" alt="Aperçu"><small>${esc(f.name)} · toucher pour changer</small>`;
}
$("fFile").onchange = e => setFile(e.target.files[0]);
["dragover", "dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, () => $("drop").classList.remove("over")));
$("drop").addEventListener("drop", e => { e.preventDefault(); setFile(e.dataTransfer.files[0]); });

$("saleForm").onsubmit = async e => {
  e.preventDefault(); $("fErr").textContent = "";
  const amount = parseNum($("fAmount").value);
  if (!(amount > 0)) { $("fErr").textContent = "Indiquez le montant brut de la vente."; return; }
  if (!FILE) { $("fErr").textContent = "Ajoutez la capture d'écran de la vente."; return; }
  $("fBtn").disabled = true; $("fBtn").textContent = "Envoi…";
  try {
    const blob = await compress(FILE);
    const q = new URLSearchParams({ model_id: $("fModel").value, amount, sold_at: new Date($("fDate").value).getTime(), note: $("fNote").value });
    const r = await fetch("/api/sales?" + q, { method: "POST", headers: { "Content-Type": blob.type || "image/jpeg" }, body: blob, credentials: "same-origin" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Erreur " + r.status);
    FILE = null; $("fFile").value = ""; $("fAmount").value = ""; $("fNote").value = "";
    $("dropTxt").innerHTML = "Vente envoyée pour validation<br><small>Touchez pour ajouter la suivante</small>";
    notify("Vente envoyée", `${eur(amount)} · en attente de validation par le manager`, "ok");
    $("fDate").value = toLocalInput(Date.now());
    loadMine();
  } catch (err) { $("fErr").textContent = err.message; }
  $("fBtn").disabled = false; $("fBtn").textContent = "Envoyer pour validation";
};

async function loadMine() {
  if (!MINE.length && !$("myList").children.length) $("myList").innerHTML = SK.tiles(4, 200).replace('class="sk-tiles"', 'class="sk-tiles" style="grid-column:1/-1"');
  const d = await api("/api/sales/mine");
  if (!$("fModel").options.length) $("fModel").innerHTML = d.models.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const cur = periodKey(Date.now()), inP = d.sales.filter(s => s.period === cur);
  const sum = st => inP.filter(s => s.status === st).reduce((t, s) => t + s.amount, 0);
  $("myKpis").innerHTML = [["Validé", eur(sum("validated")), "var(--good)"], ["En attente", eur(sum("pending")), "var(--warn)"], ["Refusées", inP.filter(s => s.status === "refused").length, ""]]
    .map(([l, v, c]) => `<div class="card kpi" style="padding:14px"><small>${l}</small><b style="font-size:18px;${c ? "color:" + c : ""}">${v}</b></div>`).join("");
  $("myPeriod").textContent = `Période du ${periodLabel(cur)}`;
  MINE = d.sales; renderMine();
}
let MINE = [], FILTER = "";
document.querySelectorAll("#mySeg button").forEach(b => b.onclick = () => { FILTER = b.dataset.f; document.querySelectorAll("#mySeg button").forEach(x => x.classList.toggle("on", x === b)); renderMine(); });
function renderMine() {
  const list = MINE.filter(s => !FILTER || s.status === FILTER);
  $("myList").innerHTML = !list.length ? `<div class="emptyv">${MINE.length ? "Aucune vente dans ce filtre." : "Aucune vente déclarée pour l'instant."}</div>` :
    list.map((s, i) => `<div class="vc" style="animation-delay:${Math.min(i, 10) * 0.05}s">
      <span class="bd ${s.status}"><i></i>${STATUS[s.status]}</span>
      ${s.status === "pending" ? `<button class="del" data-del="${s.id}" aria-label="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>` : ""}
      <div class="shot" data-z="${s.id}"><img src="${img(s.id)}" alt="Capture de la vente" loading="lazy" onload="this.classList.add('ld')"></div>
      <div class="meta"><div class="amt">${s.amount !== s.declared_amount ? `<span class="strike">${eur(s.declared_amount)}</span>` : ""}${eur(s.amount)}</div>
        <small>${esc(s.model_name)} · ${fmtDT(s.sold_at)}${s.note ? "<br>" + esc(s.note) : ""}</small>
        ${s.status === "refused" && s.reason ? `<div class="why">${esc(s.reason)}</div>` : ""}</div></div>`).join("");
  document.querySelectorAll("#myList [data-z]").forEach(i => i.onclick = () => zoom(img(i.dataset.z)));
  document.querySelectorAll("#myList [data-del]").forEach(b => b.onclick = async e => {
    e.stopPropagation(); const card = b.closest(".vc");
    await api(`/api/sales/${b.dataset.del}`, { method: "DELETE" }); await slideAway(card);
    notify("Vente supprimée", "", "info"); loadMine();
  });
}

/* ================= MANAGER ================= */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("t-queue").classList.toggle("hidden", b.dataset.t !== "queue"); $("t-hist").classList.toggle("hidden", b.dataset.t !== "hist");
  b.dataset.t === "queue" ? loadQueue() : loadHist();
});

async function loadQueue() {
  if (!$("queue").children.length) $("queue").innerHTML = SK.tiles(3, 380).replace('class="sk-tiles"', 'class="sk-tiles" style="grid-column:1/-1;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))"');
  const d = await api("/api/admin/sales?status=pending");
  $("tabQueue").textContent = `À valider (${d.pending})`;
  updateBadge(d.pending);
  $("queue").innerHTML = !d.sales.length ? "<div class='card fade-in' style='color:var(--muted)'>Aucune vente en attente : tout est à jour.</div>" :
    d.sales.map((s, i) => `<div class="qcard fade-in" id="q${s.id}" style="animation-delay:${Math.min(i, 8) * 0.05}s">
      <div class="img" data-z="${s.id}"><img src="${img(s.id)}" alt="Capture de la vente" loading="lazy"></div>
      <div class="body">
        <div><b>${esc(s.username)}</b> · ${esc(s.model_name)}</div>
        <div class="meta">${fmtDT(s.sold_at)}${s.note ? "<br>« " + esc(s.note) + " »" : ""}</div>
        <div class="amount"><input inputmode="decimal" value="${String(s.amount).replace(".", ",")}" data-amt="${s.id}" aria-label="Montant brut"> <span>€ brut</span></div>
        <input placeholder="Motif si refus (optionnel)" data-reason="${s.id}" maxlength="300">
        <div class="actions"><button class="btn danger small" data-ref="${s.id}">Refuser</button><button class="btn ok small" data-val="${s.id}">Valider</button></div>
        <div class="err" id="qe${s.id}"></div>
      </div></div>`).join("");
  document.querySelectorAll("[data-z]").forEach(i => i.onclick = () => zoom(img(i.dataset.z)));
  const review = async (id, decision) => {
    const amount = document.querySelector(`[data-amt="${id}"]`).value, reason = document.querySelector(`[data-reason="${id}"]`).value;
    try {
      const card = $("q" + id), who = card.querySelector(".body b").textContent;
      card.querySelectorAll("button").forEach(x => x.disabled = true);
      await api(`/api/admin/sales/${id}/review`, { body: { decision, amount, reason } });
      await stamp(card, decision === "validated" ? "ok" : "ko");
      notify(decision === "validated" ? "Vente validée" : "Vente refusée",
        decision === "validated" ? `${eur(parseNum(amount))} ajoutés à la compta de ${who}` : `${who} sera prévenu${reason ? " · " + reason : ""}`, decision === "validated" ? "ok" : "info");
      await slideAway(card); loadQueue();
    } catch (e) { $("qe" + id).textContent = e.message; $("q" + id).querySelectorAll("button").forEach(x => x.disabled = false); }
  };
  document.querySelectorAll("[data-val]").forEach(b => b.onclick = () => review(b.dataset.val, "validated"));
  document.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => review(b.dataset.ref, "refused"));
}

let HP = null;
async function loadHist() {
  if (!$("hist").children.length) $("hist").innerHTML = SK.table(6);
  const q = new URLSearchParams();
  if ($("hStatus").value) q.set("status", $("hStatus").value);
  if ($("hUser").value) q.set("user", $("hUser").value);
  if ($("hPeriod").value) q.set("period", $("hPeriod").value);
  const d = await api("/api/admin/sales?" + q);
  if (!HP) {
    HP = true;
    $("hUser").innerHTML = `<option value="">Tous les chatters</option>` + d.people.map(p => `<option value="${p.id}">${esc(p.username)}</option>`).join("");
    const keys = []; let t = new Date(); t.setDate(t.getDate() <= 15 ? 1 : 16);
    for (let i = 0; i < 12; i++) { keys.push(periodKey(t.getTime())); t = t.getDate() === 16 ? new Date(t.getFullYear(), t.getMonth(), 1) : new Date(t.getFullYear(), t.getMonth() - 1, 16); }
    $("hPeriod").innerHTML = `<option value="">Toutes les périodes</option>` + keys.map(k => `<option value="${k}">${periodLabel(k)}</option>`).join("");
    $("hPeriod").value = keys[0];
    return loadHist();
  }
  const val = d.sales.filter(s => s.status === "validated");
  $("histSum").textContent = `${d.sales.length} vente(s) · validé : ${eur(val.reduce((t, s) => t + s.amount, 0))} brut`;
  $("hist").innerHTML = !d.sales.length ? "<div style='color:var(--muted)'>Aucune vente.</div>" :
    `<table><tr><th></th><th>Date</th><th>Chatter</th><th>Créatrice</th><th style="text-align:right">Montant brut</th><th>Statut</th><th></th></tr>` +
    d.sales.map(s => `<tr><td><img class="thumb" src="${img(s.id)}" alt="Capture" loading="lazy" data-z="${s.id}"></td>
      <td style="white-space:nowrap">${fmtDT(s.sold_at)}</td><td><b>${esc(s.username)}</b></td><td>${esc(s.model_name)}</td>
      <td style="text-align:right;white-space:nowrap">${s.amount !== s.declared_amount ? `<span class="strike">${eur(s.declared_amount)}</span>` : ""}<b>${eur(s.amount)}</b></td>
      <td><span class="st ${s.status}">${STATUS[s.status]}</span>${s.reviewer ? `<br><small style="color:var(--muted)">par ${esc(s.reviewer)}</small>` : ""}${s.reason ? `<br><small style="color:var(--bad)">${esc(s.reason)}</small>` : ""}</td>
      <td style="text-align:right;white-space:nowrap">${s.status !== "pending" ? `<button class="btn ghost small" data-back="${s.id}">Remettre en attente</button>` : ""} <button class="btn danger small" data-hdel="${s.id}" aria-label="Supprimer">✕</button></td></tr>`).join("") + "</table>";
  document.querySelectorAll("#hist [data-z]").forEach(i => i.onclick = () => zoom(img(i.dataset.z)));
  document.querySelectorAll("[data-back]").forEach(b => b.onclick = async () => { await api(`/api/admin/sales/${b.dataset.back}/review`, { body: { decision: "pending" } }); loadHist(); refreshCount(); });
  document.querySelectorAll("[data-hdel]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirmer ?"; return; }
    await api(`/api/sales/${b.dataset.hdel}`, { method: "DELETE" }); loadHist(); refreshCount();
  });
}
["hStatus", "hUser", "hPeriod"].forEach(id => $(id).onchange = loadHist);
async function refreshCount() { try { const c = await api("/api/admin/sales/count"); $("tabQueue").textContent = `À valider (${c.pending})`; updateBadge(c.pending); } catch (e) {} }

(async () => {
  const me = await api("/api/me");
  renderShell("ventes", me);
  if (me.role === "admin") { $("adminView").classList.remove("hidden"); loadQueue(); }
  else { $("chatterView").classList.remove("hidden"); $("fDate").value = toLocalInput(Date.now()); loadMine(); }
