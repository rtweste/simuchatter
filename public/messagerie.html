<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messagerie — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/style.css">
<style>
/* ===== Messagerie — DA sobre : noir, blanc, gris. La couleur ne sert qu'à porter une info. ===== */
.main-area.mxm{padding:0!important;height:100dvh;overflow:hidden}
.mx{--b:#0a0a0a;--s:#0e0e0e;--h:#1b1b1b;--h2:#262626;--t:#f5f5f5;--t2:#9a9a9a;--t3:#5f5f5f;--ok:#5fd3a2;--wt:#f0b54a;--ko:#f06272;--r:10px;--e:cubic-bezier(.2,.8,.2,1);
  height:100dvh;display:flex;flex-direction:column;min-width:0;background:var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1}
.mx button{font-family:inherit;color:inherit}
.mx :focus-visible{outline:2px solid var(--t);outline-offset:2px}
/* barre du haut */
.mx-top{display:flex;align-items:center;gap:22px;height:56px;padding:0 20px;border-bottom:1px solid var(--h);flex:none}
.mx-top h1{margin:0;font:800 17px Inter;letter-spacing:-.02em}
.mx-tabs{position:relative;display:flex;gap:2px;height:100%;align-items:stretch}
.mx-tabs button{background:none;border:0;padding:0 12px;font:600 13px Inter;color:var(--t3);cursor:pointer;transition:color .15s}
.mx-tabs button:hover{color:var(--t2)}.mx-tabs button.on{color:var(--t)}
.mx-tabs button small{font:600 11px Inter;color:var(--wt);margin-left:5px}
.mx-ind{position:absolute;bottom:-1px;height:2px;background:var(--t);border-radius:2px;transition:left .3s var(--e),width .3s var(--e)}
.mx-tr{margin-left:auto;display:flex;align-items:center;gap:18px;font:500 12px Inter;color:var(--t3)}
.mx-live{display:inline-flex;align-items:center;gap:7px}.mx-live i{width:6px;height:6px;border-radius:50%;background:var(--t3)}.mx-live.on{color:var(--t2)}.mx-live.on i{background:var(--ok)}
.mx-sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;background:none;border:0;font:500 12px Inter;color:var(--t3);padding:0}
.mx-sw i{width:28px;height:16px;border-radius:999px;background:var(--h2);position:relative;transition:background .2s}.mx-sw i:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#777;transition:left .25s var(--e),background .2s}
.mx-sw.on{color:var(--t)}.mx-sw.on i{background:var(--t)}.mx-sw.on i:after{left:14px;background:var(--b)}
.mx-kbd{font:600 10.5px Inter;color:var(--t3);border:1px solid var(--h2);border-radius:5px;padding:1px 5px}
.mx-cmd{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--h);background:none;color:var(--t3);font:500 12px Inter;cursor:pointer}
.mx-cmd:hover{border-color:var(--h2);color:var(--t2)}
/* colonnes */
.mx-body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 300px;position:relative;overflow:hidden}
.mx-ls{border-right:1px solid var(--h);display:flex;flex-direction:column;min-height:0}
.mx-fl{display:flex;align-items:center;gap:4px;padding:12px 12px 8px}
.mx-fl button{height:28px;padding:0 10px;border-radius:7px;border:0;background:none;font:600 12.5px Inter;color:var(--t3);cursor:pointer}
.mx-fl button.on{background:#161616;color:var(--t)}.mx-fl button:hover:not(.on){color:var(--t2)}
.mx-se{margin:0 12px 6px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--h);color:var(--t3)}
.mx-se:focus-within{border-color:var(--h2)}.mx-se input{flex:1;min-width:0;border:0;background:none;color:var(--t);font:500 13px Inter;outline:none}
.mx-cl{flex:1;overflow:auto;padding:4px 6px 16px;scrollbar-width:thin;scrollbar-color:#222 transparent}
.mx-c{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:0 11px;align-items:center;width:100%;padding:10px 10px;border:0;border-radius:var(--r);background:none;text-align:left;cursor:pointer;transition:background .12s}
.mx-c:hover{background:#111}.mx-c.on{background:#161616}
.mx-c.nw{animation:mxIn .32s var(--e) both}
@keyframes mxIn{from{opacity:0;transform:translateY(6px)}}
.mx-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 13px Inter;color:var(--t2);background:#1a1a1a center/cover;flex:none}
.mx-c .nm{display:flex;align-items:baseline;gap:8px;min-width:0}.mx-c b{font:600 14px Inter;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-c .tg{font:600 10.5px Inter;color:var(--t3);letter-spacing:.02em;flex:none}
.mx-c small{display:block;font:400 12.5px Inter;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mx-c.un small{color:var(--t)}
.mx-c .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:500 11px Inter;color:var(--t3);white-space:nowrap}
.mx-c .w{color:var(--wt)}.mx-c .w.late{color:var(--ko)}
.mx-c .ud{width:7px;height:7px;border-radius:50%;background:var(--t)}
.mx-more{margin:8px auto;display:block;height:30px;padding:0 14px;border-radius:8px;border:1px solid var(--h);background:none;color:var(--t2);font:500 12px Inter;cursor:pointer}
.sk{background:linear-gradient(90deg,#121212 25%,#191919 50%,#121212 75%);background-size:200% 100%;animation:sk 1.3s infinite linear;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
/* conversation */
.mx-th{display:flex;flex-direction:column;min-height:0;min-width:0;transition:transform .32s var(--e)}
.mx-hd{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;border-bottom:1px solid var(--h);flex:none}
.mx-hd b{display:block;font:700 15px Inter;letter-spacing:-.01em}.mx-hd small{display:block;font:500 12px Inter;color:var(--t3);margin-top:2px}
.mx-hd .sp{margin-left:auto;display:flex;gap:6px}
.mx-ib{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--h);background:none;color:var(--t2);font:500 12.5px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,color .15s}
.mx-ib:hover{border-color:var(--h2);color:var(--t)}.mx-ib svg{width:15px;height:15px}
.mx-bk,.mx-fb{display:none}
.mx-sc{flex:1;overflow:auto;padding:22px 28px 8px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#222 transparent}
.mx-day{align-self:center;margin:18px 0 12px;font:600 11px Inter;letter-spacing:.06em;color:var(--t3)}
.mx-g{display:flex;flex-direction:column;gap:3px;max-width:min(560px,72%);margin-bottom:14px}.mx-g.me{align-self:flex-end;align-items:flex-end}
.mx-g.nw{animation:mxUp .26s var(--e) both}@keyframes mxUp{from{opacity:0;transform:translateY(8px)}}
.mx-b{padding:9px 13px;border-radius:14px;background:#161616;color:var(--t);font:400 14.5px/1.5 Inter;white-space:pre-wrap;word-break:break-word}
.mx-g.me .mx-b{background:var(--t);color:#0a0a0a}
.mx-g .meta{font:500 11px Inter;color:var(--t3);padding:2px 4px 0;display:flex;gap:6px;align-items:center}
.mx-g .meta b{font-weight:600;color:var(--t2)}
.mx-g .meta .ko{color:var(--ko);cursor:pointer;text-decoration:underline}
.mx-g.tmp .mx-b{opacity:.55}
/* PPV */
.mx-ppv{width:300px;border-radius:14px;border:1px solid var(--h);overflow:hidden;background:var(--s)}
.mx-ppv .md{display:grid;gap:2px}.mx-ppv .md.n1{grid-template-columns:1fr}.mx-ppv .md.n2,.mx-ppv .md.n3{grid-template-columns:repeat(2,1fr)}
.mx-ppv .md button{padding:0;border:0;background:#161616;aspect-ratio:4/3;cursor:zoom-in;position:relative;overflow:hidden}
.mx-ppv .md.n1 button{aspect-ratio:16/11}
.mx-ppv img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s,transform .4s var(--e)}
.mx-ppv .md button:hover img{transform:scale(1.03)}
.mx-ppv .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff}.mx-ppv .pl svg{width:28px;height:28px;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
.mx-ppv .ft{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mx-ppv .pr{font:700 17px Inter;letter-spacing:-.02em}
.mx-ppv .st{display:inline-flex;align-items:center;gap:6px;font:500 12px Inter;color:var(--t3)}
.mx-ppv .st i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--t3)}
.mx-ppv.ok .st{color:var(--t)}.mx-ppv.ok .st i{background:var(--ok);border-color:var(--ok)}
.mx-ppv.ok{border-color:#203a30}
.mx-ppv.ko .st i{border-color:var(--ko)}
.mx-ppv.bought{animation:mxBuy 1.2s var(--e)}
@keyframes mxBuy{0%{box-shadow:0 0 0 0 rgba(95,211,162,.5)}100%{box-shadow:0 0 0 14px rgba(95,211,162,0)}}
.blur .mx-ppv img,.blur .mx-vf img,.blur .mx-al img,.blur .mx-hi img{filter:blur(14px)}.blur .mx-ppv button:hover img,.blur .mx-vf label:hover img{filter:none}
.mx-rq{display:flex;gap:6px;margin-top:4px}
.mx-btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--h2);background:none;color:var(--t);font:600 12.5px Inter;cursor:pointer;transition:background .15s,border-color .15s}
.mx-btn:hover{border-color:#3a3a3a}.mx-btn.pri{background:var(--t);color:#0a0a0a;border-color:var(--t)}.mx-btn.pri:hover{background:#fff}
.mx-old{align-self:center;margin:2px 0 14px;font:500 12px Inter;color:var(--t3)}
/* saisie */
.mx-cpw{padding:8px 24px calc(18px + env(safe-area-inset-bottom));flex:none}
.mx-off{margin-bottom:8px;font:500 12px Inter;color:var(--t3);display:flex;align-items:center;gap:8px}
.mx-cp{display:flex;align-items:flex-end;gap:8px;padding:6px;border-radius:14px;border:1px solid var(--h2);background:var(--s);transition:border-color .2s}
.mx-cp:focus-within{border-color:#3a3a3a}
.mx-cp textarea{flex:1;min-height:22px;max-height:170px;resize:none;border:0;background:none;color:var(--t);font:400 14.5px/1.45 Inter;padding:8px 6px;outline:none}
.mx-cp button{width:36px;height:36px;border-radius:10px;border:0;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s,background .2s,opacity .2s}
.mx-cp button:active{transform:scale(.92)}.mx-cp .md{background:none;color:var(--t2)}.mx-cp .md:hover{color:var(--t)}
.mx-cp .go{background:var(--t);color:#0a0a0a}.mx-cp .go.idle{opacity:.25}
.mx-cp button[disabled]{opacity:.25;cursor:not-allowed}.mx-cp svg{width:18px;height:18px}
.mx-hint{display:flex;gap:14px;padding:8px 4px 0;font:500 11px Inter;color:var(--t3)}
.mx-empty{flex:1;display:grid;place-items:center;color:var(--t3);font:500 13.5px Inter;text-align:center;padding:30px;line-height:1.7}
/* fiche du fan */
.mx-fan{border-left:1px solid var(--h);overflow:auto;padding:22px 20px 30px;scrollbar-width:thin;scrollbar-color:#222 transparent}
.mx-fan .who{display:flex;align-items:center;gap:12px}.mx-fan .who .mx-av{width:44px;height:44px;font-size:15px}
.mx-fan .who b{display:block;font:700 15px Inter}.mx-fan .who small{font:500 12px Inter;color:var(--t3)}
.mx-lbl{font:600 11px Inter;letter-spacing:.06em;color:var(--t3);margin:26px 0 10px;display:flex;align-items:center}
.mx-lbl span{margin-left:auto;font-weight:500;letter-spacing:0}
.mx-big{font:700 32px/1 Inter;letter-spacing:-.04em}
.mx-kv{display:flex;justify-content:space-between;padding:7px 0;font:500 13px Inter;color:var(--t2);border-bottom:1px solid #151515}.mx-kv b{color:var(--t);font-weight:600}
.mx-note{font:400 13px/1.55 Inter;color:var(--t);white-space:pre-wrap}
.mx-note.mt{color:var(--t3)}
.mx-nb{padding:12px 0;border-top:1px solid #151515}.mx-nb:first-of-type{border-top:0;padding-top:0}
.mx-nb small{display:block;font:600 10.5px Inter;letter-spacing:.06em;color:var(--t3);margin-bottom:5px}
.mx-hi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.mx-hi span.th{width:34px;height:34px;border-radius:7px;overflow:hidden;background:#161616}.mx-hi img{width:100%;height:100%;object-fit:cover}
.mx-hi .tx{font:500 12.5px Inter;color:var(--t)}.mx-hi .tx small{display:block;font:500 11px Inter;color:var(--t3);margin-top:1px}
.mx-hi .p{font:600 13px Inter;text-align:right}.mx-hi .p i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;border:1.5px solid var(--t3)}
.mx-hi.ok .p i{background:var(--ok);border-color:var(--ok)}.mx-hi.no .p{color:var(--t3)}
/* toast d'achat, palette, coffre, visionneuse */
.mx-toast{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;height:48px;padding:0 18px 0 8px;border-radius:999px;background:var(--t);color:#0a0a0a;font:600 13.5px Inter;box-shadow:0 20px 50px -12px rgba(0,0,0,.7);animation:mxT .5s var(--e) both}
.mx-toast .ck{width:32px;height:32px;border-radius:50%;background:#0a0a0a;color:var(--ok);display:grid;place-items:center}
.mx-toast .ck svg{stroke-dasharray:24;stroke-dashoffset:24;animation:mxCk .45s .25s var(--e) forwards}
.mx-toast.out{animation:mxTo .35s var(--e) forwards}
@keyframes mxT{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}@keyframes mxTo{to{opacity:0;transform:translate(-50%,10px)}}@keyframes mxCk{to{stroke-dashoffset:0}}
.mx-ov{position:fixed;inset:0;z-index:70;background:rgba(5,5,5,.72);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:12vh 20px 20px;animation:mxF .18s}
@keyframes mxF{from{opacity:0}}
.mx-pal{width:min(620px,100%);border-radius:14px;border:1px solid var(--h2);background:#0f0f0f;box-shadow:0 40px 90px -20px #000;overflow:hidden;animation:mxPu .22s var(--e)}
@keyframes mxPu{from{opacity:0;transform:translateY(-6px) scale(.985)}}
.mx-pal input{width:100%;box-sizing:border-box;height:54px;border:0;border-bottom:1px solid var(--h);background:none;color:var(--t);font:500 16px Inter;padding:0 18px;outline:none}
.mx-pal .ls{max-height:380px;overflow:auto;padding:6px}
.mx-pal .gh{font:600 10.5px Inter;letter-spacing:.06em;color:var(--t3);padding:10px 12px 6px}
.mx-pal .it{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font:500 13.5px Inter;color:var(--t)}
.mx-pal .it.on{background:#1a1a1a}.mx-pal .it .mx-av{width:26px;height:26px;font-size:11px}.mx-pal .it span.d{margin-left:auto;font:500 12px Inter;color:var(--t3)}
.mx-pal .ft{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--h);font:500 11.5px Inter;color:var(--t3)}
.mx-box{width:min(860px,100%);max-height:80vh;display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--h2);background:#0f0f0f;box-shadow:0 40px 90px -20px #000;overflow:hidden;animation:mxPu .22s var(--e)}
.mx-box .h{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-bottom:1px solid var(--h);flex:none}.mx-box .h b{font:700 14.5px Inter}.mx-box .h small{font:500 12px Inter;color:var(--t3)}.mx-box .h .x{margin-left:auto}
.mx-box .c{flex:1;overflow:auto;padding:16px}
.mx-al{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mx-al button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--t)}
.mx-al .cv{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#161616;display:grid;place-items:center;color:#333;transition:transform .25s var(--e)}.mx-al button:hover .cv{transform:scale(1.02)}
.mx-al img{width:100%;height:100%;object-fit:cover}.mx-al .tx{padding:8px 2px 0;font:600 13px Inter}.mx-al small{display:block;font:500 11.5px Inter;color:var(--t3);margin-top:1px}
.mx-vf{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.mx-vf label{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#161616;cursor:pointer;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s}
.mx-vf label.on{outline-color:var(--t)}.mx-vf img{width:100%;height:100%;object-fit:cover;transition:transform .25s var(--e)}.mx-vf label.on img{transform:scale(.94)}
.mx-vf input{position:absolute;opacity:0}.mx-vf .ck{position:absolute;top:7px;left:7px;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.25);display:grid;place-items:center;color:#0a0a0a;z-index:2}
.mx-vf label.on .ck{background:var(--t);border-color:var(--t)}.mx-vf .ty{position:absolute;bottom:6px;right:6px;font:600 10px Inter;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:2px 5px;z-index:2}
.mx-box .f{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--h);flex-wrap:wrap;flex:none}
.mx-pc{display:flex;gap:4px}.mx-pc button{height:32px;min-width:44px;padding:0 9px;border-radius:8px;border:1px solid var(--h2);background:none;color:var(--t2);font:600 12.5px Inter;cursor:pointer}
.mx-pc button.on{background:var(--t);color:#0a0a0a;border-color:var(--t)}
.mx-box .f input{height:32px;border-radius:8px;border:1px solid var(--h2);background:none;color:var(--t);font:500 13px Inter;padding:0 10px;box-sizing:border-box;outline:none}
.mx-box .f .go{margin-left:auto}
.mx-lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:30px;animation:mxF .18s}
.mx-lb img,.mx-lb video{max-width:100%;max-height:100%;border-radius:8px}
@media(max-width:1180px){.mx-body{grid-template-columns:300px minmax(0,1fr)}.mx-fan{position:absolute;right:0;top:0;bottom:0;width:300px;z-index:30;background:var(--b);transform:translateX(102%);transition:transform .3s var(--e);box-shadow:-30px 0 60px -20px #000}.mx-fan.show{transform:none}.mx-fb{display:inline-flex}}
@media(max-width:900px){.main-area.mxm,.mx{height:calc(100dvh - 55px)}}
@media(max-width:860px){.mx-body{grid-template-columns:1fr}.mx-th{position:absolute;inset:0;transform:translateX(100%);z-index:20;background:var(--b)}.mx.open .mx-th{transform:none}.mx-bk{display:inline-flex}
  .mx-top{gap:12px;padding:0 12px;overflow-x:auto}.mx-top h1,.mx-cmd,.mx-tr .lb{display:none}.mx-g{max-width:86%}.mx-sc{padding:16px 14px 8px}.mx-cpw{padding:6px 12px calc(92px + env(safe-area-inset-bottom))}.mx-cl{padding-bottom:96px}.mx-hint{display:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-area mxm">
  <div class="mx" id="mx">
    <div class="mx-top"><h1>Messagerie</h1><div class="mx-tabs" id="crs"></div>
      <div class="mx-tr"><span class="mx-live" id="live"><i></i><span>Connexion…</span></span>
        <button class="mx-sw on" id="swBlur" title="Floute les photos et vidéos ; survole pour voir"><i></i><span class="lb">Flou</span></button>
        <button class="mx-sw" id="swSend" title="Tant que c'est coupé, rien ne part vers les fans"><i></i><span class="lb">Envoi</span></button>
        <button class="mx-cmd" id="cmdB">Rechercher<span class="mx-kbd">⌘K</span></button></div></div>
    <div class="mx-body blur" id="body">
      <section class="mx-ls"><div class="mx-fl"><button class="on" data-ty="GENERAL">Toutes</button><button data-ty="TO_DELIVER">À livrer</button></div>
        <label class="mx-se"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Rechercher un fan"><span class="mx-kbd">/</span></label>
        <div class="mx-cl" id="cl"></div></section>
      <section class="mx-th" id="th"></section>
      <aside class="mx-fan" id="fan"></aside>
    </div>
  </div>
</main>
</div>
<script src="/common.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);

  const k = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } }, close = () => { m.remove(); removeEventListener("keydown", k, true); };
  addEventListener("keydown", k, true); m.querySelector("[data-x]").onclick = close; m.onclick = e => { if (e.target === m) close(); };
  const SEL = new Set(), vc = m.querySelector("#vc"), go = m.querySelector("#vGo"), pin = m.querySelector("#vPrice"); let price = null;
  const upd = () => { go.disabled = !SEL.size || price === null; go.textContent = !SEL.size ? "Choisis un média" : price === null ? "Choisis un prix" : `Envoyer ${SEL.size > 1 ? SEL.size + " médias" : ""} · ${price ? E(price) : "gratuit"}`; };
  m.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { price = +b.dataset.p; pin.value = ""; m.querySelectorAll("[data-p]").forEach(x => x.classList.toggle("on", x === b)); upd(); });
  pin.oninput = () => { price = pin.value === "" ? null : Math.max(0, +pin.value); m.querySelectorAll("[data-p]").forEach(x => x.classList.remove("on")); upd(); };
  async function albums() {
    vc.innerHTML = `<div class="mx-al">${Array.from({ length: 8 }, () => `<div><div class="sk" style="aspect-ratio:4/3;border-radius:10px"></div></div>`).join("")}</div>`;
    try { const r = await api2("/vault");
      vc.innerHTML = r.albums.length ? `<div class="mx-al">${r.albums.map(a => `<button data-al="${esc(a.id)}" data-n="${esc(a.name)}"><div class="cv">${a.cover ? `<img src="${esc(a.cover)}" alt="" loading="lazy">` : SV(IC.img, 26, 1.5)}</div><div class="tx">${esc(a.name)}<small>${a.count ? a.count + " média" + (a.count > 1 ? "s" : "") : "Album"}</small></div></button>`).join("")}</div>` : `<div class="mx-empty">Le coffre est vide</div>`;
      vc.querySelectorAll("[data-al]").forEach(b => b.onclick = () => files(b.dataset.al, b.dataset.n)); }
    catch (e) { vc.innerHTML = `<div class="mx-empty">${esc(e.message)}</div>`; }
  }
  async function files(id, name) {
    vc.innerHTML = `<div class="mx-vf">${Array.from({ length: 12 }, () => `<div class="sk" style="aspect-ratio:1;border-radius:10px"></div>`).join("")}</div>`;
    try { const r = await api2(`/vault/${encodeURIComponent(id)}`);
      vc.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="mx-ib" id="vBack">${SV(IC.back, 14)}Albums</button><b style="font:600 13.5px Inter">${esc(name)}</b><span style="font:500 12px Inter;color:#5f5f5f">${r.files.length} média${r.files.length > 1 ? "s" : ""}</span></div>
        <div class="mx-vf">${r.files.map(f => `<label class="${SEL.has(f.id) ? "on" : ""}"><input type="checkbox" value="${esc(f.id)}" ${SEL.has(f.id) ? "checked" : ""}><span class="ck">${SV(IC.check, 12, 3)}</span><img src="${esc(f.thumb)}" alt="" loading="lazy">${/video/i.test(f.type) || isVid(f.url) ? '<span class="ty">Vidéo</span>' : ""}</label>`).join("") || '<div class="mx-empty">Album vide</div>'}</div>`;
      vc.querySelector("#vBack").onclick = albums;
      vc.querySelectorAll(".mx-vf input").forEach(i => i.onchange = () => { i.checked ? SEL.add(i.value) : SEL.delete(i.value); i.parentElement.classList.toggle("on", i.checked); upd(); }); }
    catch (e) { vc.innerHTML = `<div class="mx-empty">${esc(e.message)}</div>`; }
  }
  go.onclick = async () => {
    if (!confirm(`Envoyer ${SEL.size} média${SEL.size > 1 ? "s" : ""} à ${CUR.fan.name} ${price ? "pour " + E(price) : "gratuitement"} ?`)) return;
    go.disabled = true; go.textContent = "Envoi…";
    try { await api2("/send-media", { body: { conversationId: CUR.id, fan: CUR.fan.id, files: [...SEL], price, text: m.querySelector("#vTxt").value, acceptId: acceptId || null } });
      close(); await loadMsgs(true); loadList(true); }
    catch (e) { upd(); notify("Média non envoyé", e.message, "err"); }
  };
  albums(); upd();
}

/* ================= fiche du fan ================= */
async function fanCard(quiet) {
  if (!CUR) { $("fan").innerHTML = ""; return; }
  const c = CUR, key = CID + "|" + c.fan.id, crea = ST.creators.find(x => x.id === CID) || {};
  const paint = r => {
    const S = r ? r.stats : {}, pick = re => { const k = Object.keys(S).find(k => re.test(k)); return k != null ? S[k] : null; };
    const total = pick(/totalSpent|spent/i), avg = pick(/average/i), high = pick(/highest|max/i);
    const T = THREADS[c.id], ppv = T ? T.items.filter(m => !m.fromFan && m.type === "FILE" && m.price > 0).reverse() : [];
    const nb = ppv.filter(m => m.status === "accepted").length;
    const note = T && T.note, noteTx = note && (note.note || note.text || note.content || (typeof note === "string" ? note : ""));
    $("fan").innerHTML = `<div class="who">${av(c.fan)}<div style="min-width:0"><b>${esc(c.fan.name)}</b><small>${c.fan.username ? "@" + esc(c.fan.username) : ""}</small></div></div>
      <div class="mx-lbl">TOTAL DÉPENSÉ</div><div class="mx-big">${r ? (total != null ? E(+total) : "—") : `<span class="sk" style="display:inline-block;width:120px;height:28px"></span>`}</div>
      ${r ? `<div style="margin-top:12px">${avg != null ? `<div class="mx-kv">Achat moyen<b>${E(+avg)}</b></div>` : ""}${high != null ? `<div class="mx-kv">Plus gros achat<b>${E(+high)}</b></div>` : ""}${ppv.length ? `<div class="mx-kv">PPV de cette conversation<b>${nb} / ${ppv.length} achetés</b></div>` : ""}</div>` : ""}
      <div class="mx-lbl">NOTES</div>
      <div class="mx-nb"><small>SUR LE FAN</small><div class="mx-note ${noteTx ? "" : "mt"}">${noteTx ? esc(noteTx) : "Aucune note pour l'instant"}</div></div>
      <div class="mx-nb"><small>${esc((crea.label || "CRÉATRICE").toUpperCase())}</small><div class="mx-note ${crea.note ? "" : "mt"}">${crea.note ? esc(crea.note) : "Aucune consigne de la créatrice"}</div></div>
      ${r && r.tags && r.tags.length ? `<div class="mx-lbl">TAGS</div><div style="display:flex;flex-wrap:wrap;gap:6px">${r.tags.map(t => `<span style="height:24px;padding:0 9px;border-radius:6px;border:1px solid #262626;font:500 12px/22px Inter;color:#c9c9c9">${esc(t.name)}</span>`).join("")}</div>` : ""}
      <div class="mx-lbl">MÉDIAS ENVOYÉS<span>${ppv.length ? `${nb} acheté${nb > 1 ? "s" : ""}` : ""}</span></div>
      ${ppv.length ? ppv.slice(0, 12).map(m => { const ok = m.status === "accepted", x = m.medias[0] || {};
        return `<div class="mx-hi ${ok ? "ok" : "no"}"><span class="th">${x.thumb ? `<img src="${esc(x.thumb)}" alt="" loading="lazy">` : ""}</span><span class="tx">${m.medias.length > 1 ? m.medias.length + " médias" : isVid(x.url) ? "Vidéo" : "Photo"}<small>${ago(m.at)}${m.by ? " · " + esc(m.by) : ""}</small></span><span class="p"><i></i>${E(m.price)}</span></div>`; }).join("")
        : `<div class="mx-note mt">${T ? "Aucun média payant dans cette conversation" : "Chargement…"}</div>`}`;
  };
  if (!quiet || !FANS[key]) paint(FANS[key] || null); else paint(FANS[key]);
  if (quiet && FANS[key]) return;
  try { const r = await api2(`/fan/${encodeURIComponent(c.fan.id)}`); FANS[key] = r; if (CUR === c) paint(r); } catch (e) { if (CUR === c && !FANS[key]) paint({ stats: {}, tags: [], recent: [] }); }
}

/* ================= palette ⌘K ================= */
function palette() {
  if (document.querySelector(".mx-pal")) return;
  const o = document.createElement("div"); o.className = "mx-ov";
  o.innerHTML = `<div class="mx-pal" role="dialog" aria-label="Recherche"><input id="pq" placeholder="Chercher un fan, une créatrice, une action…" autocomplete="off"><div class="ls" id="pl"></div>
    <div class="ft"><span><span class="mx-kbd">↑</span> <span class="mx-kbd">↓</span> naviguer</span><span><span class="mx-kbd">Entrée</span> ouvrir</span><span><span class="mx-kbd">Échap</span> fermer</span></div></div>`;
  document.body.appendChild(o);
  let sel = 0, items = [];
  const close = () => { o.remove(); removeEventListener("keydown", k, true); };
  const acts = () => [
    ...ST.creators.filter(c => c.id).map((c, i) => ({ g: "Créatrices", l: c.label, d: String(i + 1), run: () => pickCreator(c.id) })),
    ...(CUR ? [{ g: "Actions", l: "Ouvrir le coffre", d: "M", run: () => vault() }, { g: "Actions", l: "Marquer la conversation comme lue", run: () => $("rd") && $("rd").click() }] : []),
    { g: "Actions", l: $("body").classList.contains("blur") ? "Retirer le flou des médias" : "Flouter les médias", run: () => $("swBlur").click() },
    { g: "Actions", l: "Voir les demandes à livrer", run: () => document.querySelector('.mx-fl [data-ty="TO_DELIVER"]').click() }];
  const fans = () => { const seen = new Set(), out = []; Object.entries(LISTS).forEach(([k, L]) => { const cid = k.split("|")[0], cl = (ST.creators.find(c => c.id === cid) || {}).label || "";
    L.items.forEach(c => { if (seen.has(c.id)) return; seen.add(c.id); out.push({ g: "Fans", l: c.fan.name, d: cl, fan: c.fan, run: () => { if (cid !== CID) pickCreator(cid); setTimeout(() => openConv(c), cid !== CID ? 400 : 0); } }); }); }); return out; };
  const draw = () => {
    const q = $("pq").value.trim().toLowerCase(), norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    items = [...fans(), ...acts()].filter(x => !q || norm(x.l).includes(norm(q))).slice(0, 40); sel = Math.min(sel, Math.max(0, items.length - 1));
    let g = "", h = ""; items.forEach((x, i) => { if (x.g !== g) { h += `<div class="gh">${x.g.toUpperCase()}</div>`; g = x.g; }
      h += `<button class="it ${i === sel ? "on" : ""}" data-i="${i}">${x.fan ? av(x.fan) : ""}${esc(x.l)}${x.d ? `<span class="d">${esc(x.d)}</span>` : ""}</button>`; });
    $("pl").innerHTML = h || `<div class="mx-empty" style="padding:24px">Rien trouvé</div>`;
    $("pl").querySelectorAll("[data-i]").forEach(b => { b.onclick = () => { close(); items[+b.dataset.i].run(); }; b.onmousemove = () => { if (sel !== +b.dataset.i) { sel = +b.dataset.i; draw(); } }; });
    const on = $("pl").querySelector(".on"); if (on) on.scrollIntoView({ block: "nearest" });
  };
  const k = e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } else if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); } else if (e.key === "Enter") { e.preventDefault(); const x = items[sel]; if (x) { close(); x.run(); } } };
  addEventListener("keydown", k, true); o.onclick = e => { if (e.target === o) close(); };
  $("pq").oninput = () => { sel = 0; draw(); }; draw(); $("pq").focus();
}

/* ================= clavier ================= */
addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette(); return; }
  if (typing(e) || e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".mx-ov,.mx-lb")) return;
  const L = LISTS[lkey()], i = L && CUR ? L.items.findIndex(x => x.id === CUR.id) : -1;
  if (e.key === "j" || e.key === "ArrowDown" && !CUR) { if (L && L.items.length) { e.preventDefault(); openConv(L.items[Math.min(L.items.length - 1, i + 1)]); } }
  else if (e.key === "k") { if (L && L.items.length) { e.preventDefault(); openConv(L.items[Math.max(0, i - 1)]); } }
  else if (e.key === "Enter" && $("tx") && !$("tx").disabled) { e.preventDefault(); $("tx").focus(); }
  else if (e.key === "m" && CUR) { e.preventDefault(); vault(); }
  else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
  else if (e.key === "f") $("fan").classList.toggle("show");
  else if (/^[1-9]$/.test(e.key)) { const c = ST.creators.filter(x => x.id)[+e.key - 1]; if (c) pickCreator(c.id); }
});

/* ================= temps réel ================= */
let lT = null;
function stream() {
  const ES = new EventSource("/api/twizz/inbox/stream");
  ES.addEventListener("live", e => { LIVE = !!JSON.parse(e.data).on; liveUi(); });
  ES.addEventListener("tw", e => { const d = JSON.parse(e.data);
    if (CUR && (!d.conv || d.conv === CUR.id)) loadMsgs(true);
    if (d.creator && d.creator !== CID) return;
    clearTimeout(lT); lT = setTimeout(() => loadList(true), 1500); });
  ES.onerror = () => { LIVE = false; liveUi(); };
}
setInterval(() => { if (document.hidden || !CID) return; if (!LIVE) { loadList(true); if (CUR) loadMsgs(true); } }, 30000);
setInterval(() => { if (!document.hidden && CID) renderList(); }, 60000);

(async () => {
  const me = await api("/api/me"); renderShell("messagerie", me);
  if (me.rk !== "founder" || me.viewAs) { $("mx").innerHTML = `<div class="mx-empty">La messagerie Twizz est en test : réservée au fondateur.</div>`; return; }
  try { if (localStorage.getItem("mx:blur") === "0") $("swBlur").click(); } catch (e) {}
  try { ST = await api("/api/twizz/inbox/state"); } catch (e) { $("mx").innerHTML = `<div class="mx-empty">${esc(e.message)}</div>`; return; }
  let saved = null; try { saved = localStorage.getItem("mx:cid"); } catch (e) {}
  CID = ST.creators.some(c => c.id === saved) ? saved : (ST.creators[0] || {}).id || null;
  top(); liveUi(); thread(); fanCard(); if (CID) { loadList(); stream(); }
})();
})();
</script>
