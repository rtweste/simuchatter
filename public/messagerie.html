<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messagerie Twizz — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/style.css">
<style>
:root{--bd:#1b1b1b;--ac:#5fd3a2;--am:#f0b54a;--bl:#7db4ff}
@property --fxa{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.main-area.mxm{padding:0!important;height:100dvh;overflow:hidden}
.mx{height:100dvh;display:flex;flex-direction:column;min-width:0;background:#0a0a0a}
/* ---- barre du haut ---- */
.mx-topw{padding:12px 16px 4px;background:radial-gradient(700px 120px at 50% 0%,rgba(95,211,162,.07),transparent 70%)}
.mx-top{display:flex;align-items:center;gap:14px;padding:7px 8px 7px 18px;border-radius:22px;background:rgba(20,20,20,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 50px -20px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.mx-top h1{margin:0;font:900 18px Inter;letter-spacing:-.035em;white-space:nowrap}.mx-top h1 em{font-style:italic;background:linear-gradient(90deg,#7ee8bd,#5fd3a2);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.mx-badge{height:18px;padding:0 7px;border-radius:999px;background:rgba(240,181,74,.1);border:1px solid rgba(240,181,74,.3);color:var(--am);font:800 9px/16px Inter;letter-spacing:.12em}
.mx-cr{display:flex;gap:6px;margin:0 auto;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.mx-cr button{position:relative;display:flex;align-items:center;height:44px;padding:4px;border-radius:999px;border:1px solid transparent;background:#141414;color:#9a9a9a;font:800 12.5px Inter;cursor:pointer;flex:none;transition:background .45s cubic-bezier(.3,1.3,.5,1),color .3s,padding .5s cubic-bezier(.3,1.3,.5,1),box-shadow .4s}
.mx-cr button:hover{background:#1c1c1c;color:#ddd}
.mx-cr button .nm{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;margin:0;transition:max-width .5s cubic-bezier(.3,1.3,.5,1),opacity .3s,margin .5s}
.mx-cr button.on{background:#f5f5f5;color:#0a0a0a;box-shadow:0 8px 26px -8px rgba(255,255,255,.4);padding-right:16px}
.mx-cr button.on .nm,.mx-cr button:hover .nm{max-width:110px;opacity:1;margin-left:10px}
.mx-cr button:hover:not(.on){padding-right:14px}
.mx-cr .dot{position:absolute;top:1px;left:26px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#e0484a;color:#fff;font:900 9px/13px Inter;text-align:center;border:2px solid #141414;animation:dtIn .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes dtIn{from{transform:scale(0)}}
.mx-cr button.on .dot{display:none}
.mx-tg{display:flex;align-items:center;gap:6px;flex:none}
.mx-live{display:inline-flex;align-items:center;gap:7px;margin-right:6px;font:800 10.5px Inter;letter-spacing:.1em;color:#6f6f6f;white-space:nowrap}
.mx-live i{width:7px;height:7px;border-radius:50%;background:#555}.mx-live.on{color:var(--ac)}.mx-live.on i{background:var(--ac);box-shadow:0 0 0 0 rgba(95,211,162,.6);animation:mxP 1.8s infinite}
@keyframes mxP{70%{box-shadow:0 0 0 7px rgba(95,211,162,0)}100%{box-shadow:0 0 0 0 rgba(95,211,162,0)}}
.tgi{width:44px;height:44px;border-radius:14px;border:1px solid #262626;background:#141414;color:#8a8a8a;display:grid;place-items:center;cursor:pointer;transition:all .3s}
.tgi:hover{color:#ddd}.tgi.on{color:#fff;background:#1f1f1f;border-color:#3a3a3a}
.tgs{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 12px;border-radius:14px;border:1px solid #262626;background:#141414;color:#8a8a8a;font:800 12px Inter;cursor:pointer;white-space:nowrap;transition:all .35s}
.tgs:hover{color:#ddd}
.tgs.on{background:linear-gradient(135deg,#e0484a,#b8323a);border-color:#e0484a;color:#fff;box-shadow:0 10px 30px -10px rgba(224,72,74,.8)}
.mx-warn{display:flex;align-items:center;justify-content:center;gap:8px;height:0;overflow:hidden;font:700 11.5px Inter;color:#ff9aa4;opacity:0;transition:height .35s,opacity .35s,margin .35s}
.mx-warn.on{height:18px;margin-top:6px;opacity:1}
.mx-warn i{width:6px;height:6px;border-radius:50%;background:#e0484a;animation:wrP 1.6s infinite}
@keyframes wrP{0%{box-shadow:0 0 0 0 rgba(224,72,74,.6)}70%{box-shadow:0 0 0 6px rgba(224,72,74,0)}100%{box-shadow:0 0 0 0 rgba(224,72,74,0)}}
/* ---- 3 colonnes ---- */
.mx-body{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 340px;position:relative;overflow:hidden}
.mx-ls{border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;background:#0a0a0a;position:relative}
.mx-seg{display:flex;gap:4px;margin:14px 14px 10px;padding:4px;border-radius:12px;background:#111;border:1px solid var(--bd)}
.mx-seg button{flex:1;height:32px;border-radius:9px;border:0;background:none;color:#8a8a8a;font:700 12.5px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mx-seg button.on{background:#1f1f1f;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.mx-seg .qn{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--am);color:#2a1d05;font:900 10.5px Inter}
.mx-seg .qn:empty{display:none}
.mx-se{display:flex;align-items:center;gap:8px;margin:0 14px 8px;height:38px;border-radius:11px;border:1px solid var(--bd);background:#0f0f0f;padding:0 12px;color:#666}
.mx-se input{flex:1;min-width:0;border:0;background:none;color:#eee;font:500 13px Inter;outline:none;padding:0}
.mx-cl{flex:1;overflow:auto;padding:2px 8px 14px;scrollbar-width:thin}
.mx-c{position:relative;display:flex;gap:11px;align-items:center;width:100%;padding:10px;border:0;border-radius:14px;background:none;color:#ccc;text-align:left;cursor:pointer;transition:background .15s}
.mx-c.nw{animation:mxIn .3s both}
@keyframes mxIn{from{opacity:0;transform:translateY(4px)}}
.mx-c:hover{background:#121212}.mx-c.on{background:#171717}
.mx-c.wait:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--am)}
.mx-av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:900 16px Inter;color:#fff;background:var(--c,#2a2a2a) center/cover}
.mx-c .t{flex:1;min-width:0}.mx-c b{display:block;font:700 14px Inter;color:#f2f2f2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-c small{display:block;font-size:12.5px;color:#6f6f6f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.mx-c.un small{color:#e8e8e8;font-weight:600}.mx-c .wt{color:var(--am);font-weight:700}
.mx-c.un{background:linear-gradient(90deg,rgba(95,211,162,.11),rgba(95,211,162,.025) 65%,transparent)}
.mx-c.un:hover{background:linear-gradient(90deg,rgba(95,211,162,.16),rgba(95,211,162,.05) 65%,transparent)}
.mx-c.un.on{background:linear-gradient(90deg,rgba(95,211,162,.18),#171717 75%)}
.mx-c.un:after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--ac);box-shadow:0 0 12px rgba(95,211,162,.7)}
.mx-c.un b,.mx-c.un .nm{color:#fff;font-weight:800}.mx-c.un small,.mx-c.un .pv{color:#f2f2f2;font-weight:600}
.mx-c.un .r{color:var(--ac);font-weight:700}
.mx-c.un .n{animation:nPl 2.2s ease-out infinite}
@keyframes nPl{0%{box-shadow:0 0 0 0 rgba(95,211,162,.55)}100%{box-shadow:0 0 0 7px rgba(95,211,162,0)}}
.mx-c .pre{font-weight:700;color:color-mix(in srgb,var(--c) 70%,#fff)}.mx-c .pre.tw{color:#9a9a9a}
.mx-c .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:#5f5f5f;flex:none}
.mx-c .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:#05261a;font:800 11px/20px Inter;text-align:center}
.mx-more{margin:8px auto;display:block;height:34px;padding:0 16px;border-radius:10px;border:1px solid #262626;background:#121212;color:#bbb;font:700 12px Inter;cursor:pointer}
.sk{background:linear-gradient(90deg,#141414 25%,#1c1c1c 50%,#141414 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
/* ---- effets du site (accueil, ventes, salle de contrôle) ---- */
.met{font-style:italic;padding-right:.08em;background:linear-gradient(100deg,#fff,#8a8a8a 55%,#e6e6e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl{margin:0;font:900 14px Inter;letter-spacing:-.025em;color:#f0f0f0;white-space:nowrap}.ttl em{font-style:italic;padding-right:.08em;background:linear-gradient(100deg,#fff,#8a8a8a 55%,#e6e6e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.cap{font:800 9.5px Inter;letter-spacing:.18em;text-transform:uppercase;color:#6a6a6a}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.stars i{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
@keyframes spin{to{--fxa:360deg}}@keyframes spin2{to{--ang:360deg}}
.trace{position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--fxa),transparent 0 58%,var(--tc,#5fd3a2) 78%,#fff 86%,transparent 93%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:6;animation:spin 1.6s linear infinite}
.hot{position:relative}
.hot:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 70%,var(--cl,rgba(240,98,114,.95)) 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin2 2.6s linear infinite;pointer-events:none;z-index:6}
.rav{position:relative;display:inline-grid;place-items:center;border-radius:50%;flex:none}
.rav:before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from var(--fxa),var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
.rav>span{position:relative;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:Inter;background-size:cover;background-position:center}
.badge{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:5px;font:900 8.5px/16px Inter;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;flex:none}
.badge.gd{color:#2a1d05;background:linear-gradient(105deg,#fff3d6,#e8c27a 55%,#c99a4e)}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:#1a1a1a;border:1px solid #2e2e2e;border-bottom-width:2px;font:800 10.5px Inter;color:#cfcfcf}
.kh{display:inline-flex;align-items:center;gap:6px;font:600 11.5px Inter;color:#6a6a6a;white-space:nowrap}
.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:#1a1a1a;color:#bdbdbd;border:1px solid #262626}
.ic.g{color:#5fd3a2;background:rgba(95,211,162,.08);border-color:rgba(95,211,162,.22)}
.rl{display:inline-block;height:1em;line-height:1em;overflow:hidden;vertical-align:top}
.rl>span{display:flex;flex-direction:column;transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.rl>span>i{font-style:normal;height:1em;display:block}
.wtb{position:relative;display:flex;padding:3px;border-radius:12px;background:#151515;border:1px solid #222}
.wtb .ind{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:9px;background:#ededed;box-shadow:0 4px 18px rgba(255,255,255,.12);transition:transform .5s cubic-bezier(.3,1.3,.5,1),width .5s cubic-bezier(.3,1.3,.5,1)}
.wtb button{position:relative;z-index:1;flex:1 1 auto;padding:0 8px;border:0;background:transparent;color:#8f8f8f;font:800 11.5px Inter;border-radius:9px;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer;transition:color .3s}
.wtb button.on{color:#0a0a0a}
.wtb .cn{display:inline-flex;min-width:16px;height:16px;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.08);font-size:10px;padding:0 4px}
.wtb button.on .cn{background:rgba(0,0,0,.1)}
.wtb i{width:7px;height:7px;border-radius:50%;flex:none}
.spk{position:absolute;width:12px;height:12px;color:#fff;pointer-events:none;z-index:9;animation:spk 1.3s ease both}
.spk svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px rgba(95,211,162,.9))}
@keyframes spk{0%{opacity:0;transform:scale(0) rotate(0)}35%{opacity:1;transform:scale(1.3) rotate(45deg)}70%{opacity:.9;transform:scale(.8) rotate(90deg)}100%{opacity:0;transform:scale(0) rotate(135deg)}}
.rip{position:absolute;border-radius:50%;border:1.5px solid var(--rc,#5fd3a2);pointer-events:none;z-index:8;animation:rip 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rip{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(6)}}
/* ---- file « À traiter » ---- */
.qhd{padding:4px 16px 6px}
.qhd[hidden]{display:none}
.qhd h2{display:flex;align-items:baseline;gap:7px;margin:0;font:900 25px Inter;letter-spacing:-.045em;line-height:1}
.dsh{display:flex;align-items:center;gap:5px;margin-top:10px;min-height:14px}
.dsh i{height:4px;width:18px;border-radius:999px;background:#2a2a2a;flex:none;transition:background .4s,box-shadow .4s}
.dsh i.d{background:var(--ac);box-shadow:0 0 10px rgba(95,211,162,.6)}.dsh i.c{background:#f5f5f5;box-shadow:0 0 10px rgba(255,255,255,.45)}
.dsh span{margin-left:6px;font:700 11.5px Inter;color:#8a8a8a;white-space:nowrap}.dsh span b{color:#fff}
.kh2{display:flex;gap:12px;margin-top:9px}
.q{align-items:center;padding:9px 10px 9px 8px;border-radius:16px;margin-bottom:2px;transition:background .2s,opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1),max-height .45s cubic-bezier(.2,.8,.2,1),margin .45s,padding .45s;max-height:90px}
.q.out{opacity:0;transform:translateX(-40px) scale(.96);max-height:0;margin:0;padding-top:0;padding-bottom:0;filter:blur(3px)}
.q .qa{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.q .qa .mx-av{width:40px;height:40px;font-size:15px}
.q .qa svg{position:absolute;inset:0;transform:rotate(-90deg)}
.q .qa .tr{stroke:#1d1d1d}.q .qa .vl{stroke:var(--pc);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--pc) 70%,transparent));transition:stroke-dasharray 1s cubic-bezier(.16,1,.3,1)}
.q .t b{display:flex!important;align-items:center;gap:7px}.q .t b .nm{overflow:hidden;text-overflow:ellipsis}
.q b em{margin-left:auto;font:800 11.5px Inter;font-style:normal;color:#8a8a8a;flex:none}.q b em.big{color:#fff}
.rs{display:flex;align-items:center;gap:7px;margin-top:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:800 11px Inter;white-space:nowrap;flex:none}
.chip.red{background:rgba(240,98,114,.12);color:#ff8a95;border:1px solid rgba(240,98,114,.32)}
.chip.am{background:rgba(240,181,74,.1);color:var(--am);border:1px solid rgba(240,181,74,.3)}
.chip.gr{background:rgba(95,211,162,.1);color:var(--ac);border:1px solid rgba(95,211,162,.32)}
.chip.bl{background:rgba(125,180,255,.1);color:var(--bl);border:1px solid rgba(125,180,255,.3)}
.pv{font-size:12.5px;color:#7a7a7a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.q.hot{--cl:rgba(240,98,114,.95);background:linear-gradient(135deg,rgba(240,98,114,.07),transparent 60%),#141414}
.q.gdq{--tc:#e8c27a;background:linear-gradient(135deg,rgba(232,194,122,.09),transparent 60%)}
.q.gdq .trace{border-radius:16px}
.q.done{background:linear-gradient(135deg,rgba(95,211,162,.14),transparent 70%),#141414;box-shadow:inset 0 0 0 1px rgba(95,211,162,.35)}
.q.done:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,rgba(95,211,162,.3) 50%,transparent 70%);background-size:250% 100%;animation:qsw 1s ease both;pointer-events:none}
@keyframes qsw{from{background-position:120% 0}to{background-position:-20% 0}}
.q .dn{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#05261a;z-index:3;box-shadow:0 0 22px rgba(95,211,162,.8);animation:dnIn .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes dnIn{from{transform:scale(0) rotate(-90deg)}}
.qempty{display:grid;place-items:center;text-align:center;padding:40px 20px;color:#7a7a7a;font:600 13px Inter}
.qempty .okc{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:rgba(95,211,162,.1);border:1px solid rgba(95,211,162,.35);color:var(--ac);box-shadow:0 0 40px -10px rgba(95,211,162,.6);animation:dnIn .7s cubic-bezier(.3,1.7,.5,1) both}
.qempty b{display:block;color:#fff;font:900 16px Inter;margin-bottom:4px}
/* ---- conversation ---- */
.mx-th{display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(900px 400px at 50% -200px,rgba(95,211,162,.06),transparent 70%),#0a0a0a;transition:transform .3s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.mx-th>*{position:relative;z-index:1}.mx-th>.stars{position:absolute;z-index:0}
.mx-hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd);min-height:68px;box-sizing:border-box}
.mx-hd .av{width:40px;height:40px;font-size:15px}.mx-hd>div{min-width:0}.mx-hd b{display:block;font:800 15.5px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mx-hd .mx-ib{white-space:nowrap;flex:none}.mx-hd small{color:#6f6f6f;font-size:12px}
.mx-hd .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.crew{display:inline-flex;align-items:center;gap:9px;margin-right:4px}.crew:empty{display:none}
.crew .stk{display:inline-flex}.crew .stk .rav+.rav{margin-left:-7px}
.mx-ib{height:34px;padding:0 12px;border-radius:10px;border:1px solid #262626;background:#121212;color:#cfcfcf;font:700 12px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.mx-ib:hover{background:#1a1a1a}.mx-ib svg{width:15px;height:15px}
.mx-bk,.mx-fb{display:none}
.mx-sc{flex:1;overflow:auto;padding:18px 22px 10px;display:flex;flex-direction:column;scrollbar-width:thin}
.mx-day{align-self:center;margin:14px 0 10px;font:800 10.5px Inter;letter-spacing:.12em;color:#5f5f5f;text-transform:uppercase}
.mx-g{position:relative;display:flex;flex-direction:column;gap:3px;max-width:68%;margin-bottom:12px;align-items:flex-start}.mx-g.nw{animation:mxBub .45s cubic-bezier(.3,1.4,.5,1) both}.mx-g.me{align-self:flex-end;align-items:flex-end}
@keyframes mxBub{from{opacity:0;transform:translateY(14px) scale(.94)}}
.mx-g.me.nw{transform-origin:bottom right}
.mx-b{position:relative;padding:9px 14px;border-radius:18px;background:#141414;border:1px solid #1f1f1f;color:#ededed;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.mx-g.me .mx-b{background:#0d1512;color:#d9ffee;border:0;box-shadow:0 0 22px -8px rgba(95,211,162,.55)}
.mx-g.me .mx-b:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#5fd3a2,#2aa6a0 50%,rgba(95,211,162,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.fgr{display:flex;align-items:flex-end;gap:8px;max-width:74%;margin-bottom:12px;flex:none}
.fgr.nw{animation:mxBub .45s cubic-bezier(.3,1.4,.5,1) both;transform-origin:bottom left}
.fgr .mx-g{max-width:100%;margin-bottom:0;min-width:0}
.mx-av.fav{width:26px;height:26px;font-size:11px;margin-bottom:18px}
.lbl{display:inline-flex;align-items:center;gap:6px;font:800 9.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:#6a6a6a;margin-top:3px;padding:0 3px;white-space:nowrap}
.lbl i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.lbl .vu{color:var(--ac);letter-spacing:.06em}
.mx-g time{font-size:10.5px;color:#565656;margin-top:3px;padding:0 4px}
.mx-g .st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#888;margin-top:3px}.mx-g .st.ko{color:#ff8a8a;cursor:pointer;text-decoration:underline}
.mx-g .st i{width:10px;height:10px;border-radius:50%;border:1.5px solid #3a3a3a;border-top-color:var(--ac);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.sig{display:inline-flex;align-items:center;gap:6px;font:600 11px Inter;color:#7a7a7a;margin-top:3px;padding:0 4px;white-space:nowrap}
.sig .ch{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font:900 8.5px Inter;font-style:normal;background:color-mix(in srgb,var(--c) 20%,#0f0f0f);color:var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.sig .ch.tw{--c:#9a9a9a;background:#1a1a1a;box-shadow:0 0 0 1px #2c2c2c}
.sig b{font-weight:700;color:#d6d6d6}.sig .dt{color:#4a4a4a}.sig time{margin:0;padding:0;font-size:10.5px;color:#5a5a5a}
.tip{position:absolute;right:0;bottom:calc(100% + 8px);z-index:9;width:max-content;max-width:320px;padding:9px 12px;border-radius:12px;background:rgba(22,22,22,.94);backdrop-filter:blur(10px);border:1px solid #2c2c2c;box-shadow:0 18px 40px -12px #000;font:600 12px/1.45 Inter;color:#d8d8d8;opacity:0;transform:translateY(6px) scale(.97);transform-origin:bottom right;transition:opacity .2s,transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.tip b{color:#fff}.mx-g.me:hover .tip{opacity:1;transform:none}
.mx-md{display:grid;gap:4px;border-radius:16px;overflow:hidden}.mx-md.n1{grid-template-columns:240px}.mx-md.n2{grid-template-columns:repeat(2,150px)}.mx-md.n3{grid-template-columns:repeat(3,110px)}
.mx-md button{padding:0;border:0;background:#1d1d1d;aspect-ratio:1;cursor:zoom-in;position:relative;overflow:hidden}
.mx-md img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s}
.mx-md .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff}.mx-md .pl svg{width:34px;height:34px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.blur .mx-md img,.blur .vt img,.blur .fan3 img,.blur .th img,.blur .dk img,.blur .wth img{filter:blur(16px) saturate(.8)}.blur .mx-md button:hover img,.blur .vt:hover img{filter:none}
/* téléphone et tablette (pas de survol) : le coffre n'est jamais flouté, il faut voir ce qu'on envoie */
@media(hover:none),(max-width:860px){.mx-mod.blur .vt img,.mx-mod.blur .dk img,.mx-mod.blur .th img,.mx-mod.blur .wth img{filter:none}}
.mx-pr{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font:800 11.5px Inter;background:#1d1d1d;color:#bbb;margin-top:2px}
.mx-pr.accepted{background:rgba(95,211,162,.14);color:var(--ac)}.mx-pr.refused{background:rgba(224,122,122,.14);color:#ff9a9a}.mx-pr.pending{background:rgba(240,181,74,.12);color:var(--am)}
/* carte PPV */
.pw{position:relative}
.ppv{position:relative;width:300px;display:flex;flex-direction:column;border-radius:16px;background:#0d1512;border:1px solid rgba(95,211,162,.18);transition:border-color .4s,box-shadow .4s}
.ppv .mdw{position:relative;border-radius:15px 15px 0 0;overflow:hidden}
.ppv .mx-md{border-radius:0;grid-template-columns:repeat(var(--n,1),minmax(0,1fr))!important}.ppv .mx-md.n1 button{aspect-ratio:4/3}
.gl{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:rgba(10,10,10,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);font:800 11px Inter;color:#fff;pointer-events:none}
.gl.tl{top:10px;left:10px}.gl.tr{top:10px;right:10px;font-size:10px;letter-spacing:.06em}
.ppv .bar{display:flex;align-items:center;gap:8px;padding:10px 12px;font:700 12px Inter;color:#9a9a9a;white-space:nowrap;border-radius:0 0 15px 15px;transition:background .4s}
.ppv .pr{flex:none;font:900 14px Inter;color:#fff}
.ppv .pst{margin-left:auto;display:inline-flex}.ppv .pst>span{display:inline-flex;align-items:center;gap:6px}
.ppv .ok{color:var(--ac)}.ppv .ko{color:#ff9a9a}.ppv .ko i{width:7px;height:7px;border-radius:50%;background:#ff9a9a}
.ppv .wt{color:var(--am)}.ppv .wt i{width:7px;height:7px;border-radius:50%;background:var(--am);animation:wtP 1.6s infinite}
@keyframes wtP{0%{box-shadow:0 0 0 0 rgba(240,181,74,.55)}70%{box-shadow:0 0 0 6px rgba(240,181,74,0)}100%{box-shadow:0 0 0 0 rgba(240,181,74,0)}}
.ppv.ok{border-color:rgba(95,211,162,.45);box-shadow:0 0 30px -10px rgba(95,211,162,.6)}.ppv.ok .bar{background:rgba(95,211,162,.07)}
.ck{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ac);color:#05261a;flex:none}
/* moment d'achat */
.ppv.won{animation:won 1.6s ease both}
@keyframes won{0%{box-shadow:0 0 0 0 rgba(95,211,162,.5),0 30px 70px -30px rgba(95,211,162,.7);border-color:rgba(95,211,162,.7)}60%{box-shadow:0 0 0 16px rgba(95,211,162,0),0 30px 70px -30px rgba(95,211,162,.5)}100%{box-shadow:0 0 0 0 rgba(95,211,162,0)}}
.ppv.won .trace{border-radius:17px;animation:spin 1.1s linear infinite,trOut 3s ease forwards}
@keyframes trOut{0%,70%{opacity:1}100%{opacity:0}}
.ppv.won .mdw:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.3) 47%,rgba(95,211,162,.22) 53%,transparent 70%);animation:sweep 1s .1s ease both;pointer-events:none}
@keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.ppv.won .pst .ok{animation:okIn .7s cubic-bezier(.3,1.7,.5,1) both}
@keyframes okIn{from{opacity:0;transform:translateY(8px) scale(.85)}}
.plus{position:absolute;right:12px;bottom:34px;z-index:9;font:900 14px Inter;color:#d8ffee;background:linear-gradient(135deg,#1f4a39,#12301f);border:1px solid rgba(95,211,162,.55);padding:5px 11px;border-radius:999px;pointer-events:none;box-shadow:0 12px 34px -8px rgba(95,211,162,.6);animation:plus 2.2s ease both}
@keyframes plus{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(-10px) scale(1.08)}60%{opacity:1;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-44px)}}
.bnw{position:absolute!important;top:78px;left:0;right:0;display:flex;justify-content:center;perspective:900px;z-index:20!important;pointer-events:none}
.bnf{display:flex;align-items:center;gap:11px;width:min(420px,92%);height:58px;padding:0 14px;border-radius:16px;background:rgba(22,22,22,.88);backdrop-filter:blur(14px);border:1px solid rgba(95,211,162,.35);box-shadow:0 30px 60px -18px #000,0 0 40px -14px rgba(95,211,162,.5);font:500 12.5px Inter;color:#cfcfcf;transform-origin:top center;animation:ntf 4.6s ease both}
@keyframes ntf{0%{opacity:0;transform:rotateX(-80deg) translateY(-24px)}9%{opacity:1;transform:rotateX(8deg)}14%,82%{opacity:1;transform:none}100%{opacity:0;transform:rotateX(70deg) translateY(-10px) scale(.96)}}
.bnf .tx{flex:1;min-width:0;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bnf .tx b{color:#fff;font-weight:800}.bnf .tx small{display:block;font-size:11px;color:#7a7a7a}
.bnf>b{font:900 15px Inter;color:var(--ac)}
.mx-rq{display:flex;gap:6px;margin-top:4px}.mx-rq button{height:32px;padding:0 13px;border-radius:10px;border:0;font:800 12px Inter;cursor:pointer}
.mx-rq .y{background:var(--ac);color:#05261a}.mx-rq .n{background:#241414;color:#ff9a9a}
.mx-old{align-self:center;margin:4px 0 12px;font-size:12px;color:#666}
.mx-cpw{padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
.mx-off{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:9px 12px;border-radius:12px;background:rgba(240,181,74,.07);border:1px solid rgba(240,181,74,.25);font-size:12.5px;color:#e9cf9a}
.mx-cp{display:flex;align-items:flex-end;gap:6px;padding:6px;border-radius:20px;border:1px solid #262626;background:#111;transition:border-color .2s,box-shadow .2s}
.mx-cp:focus-within{border-color:#3a3a3a;box-shadow:0 0 0 4px rgba(255,255,255,.03)}
.mx-cpw{position:relative}
.mx-cp .tools{display:flex;gap:4px;flex:none}
.mx-cp .tl2{color:#9a9a9a}.mx-cp .tl2:hover{color:#fff;background:#222}
.mx-cp .tl2.act{background:#f5f5f5;color:#0a0a0a}
.mx-cp .tl2.ai{color:#bfeedb;background:linear-gradient(135deg,rgba(95,211,162,.16),rgba(125,180,255,.12));box-shadow:inset 0 0 0 1px rgba(95,211,162,.25)}
.mx-cp .tl2.ai.act{background:linear-gradient(135deg,#5fd3a2,#7db4ff);color:#05261a;box-shadow:0 8px 24px -8px rgba(95,211,162,.7)}
.mx-cp .tl2.ai svg{animation:aiTw 3.2s ease-in-out infinite}
@keyframes aiTw{0%,80%,100%{transform:none}88%{transform:scale(1.25) rotate(20deg)}}
/* panneaux scripts / IA au-dessus de la barre */
.pnl{position:absolute;left:18px;right:18px;bottom:calc(100% - 2px);z-index:25;display:flex;flex-direction:column;max-height:min(430px,58vh);border-radius:18px;background:rgba(17,17,17,.96);backdrop-filter:blur(16px);border:1px solid #2a2a2a;box-shadow:0 -24px 60px -20px #000,0 0 0 1px rgba(255,255,255,.02);overflow:hidden;animation:pnIn .45s cubic-bezier(.16,1,.3,1) both;transform-origin:bottom center}
@keyframes pnIn{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(4px)}}
.pnl .ph{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:1px solid #1f1f1f}
.pnl .pt{display:inline-flex;align-items:center;gap:8px;font:900 14px Inter;letter-spacing:-.02em;white-space:nowrap}
.pnl .ph input{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid #262626;background:#0d0d0d;color:#eee;font:500 13px Inter;padding:0 11px}
.pnl .px{width:32px;height:32px;border-radius:9px;border:0;background:#1a1a1a;color:#9a9a9a;cursor:pointer;display:grid;place-items:center;flex:none}
.pnl .px:hover{color:#fff;background:#222}
.pcats{display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none}
.pcats button{height:28px;padding:0 11px;border-radius:999px;border:1px solid #262626;background:#141414;color:#9a9a9a;font:700 11.5px Inter;cursor:pointer;white-space:nowrap;transition:all .25s}
.pcats button.on{background:#f5f5f5;color:#0a0a0a;border-color:#f5f5f5}
.plst{flex:1;min-height:0;overflow:auto;padding:6px 8px 10px;scrollbar-width:thin}
.srow{position:relative;display:flex;align-items:stretch;border-radius:13px;animation:hrIn .45s cubic-bezier(.16,1,.3,1) both}
.srow .si{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:9px 78px 9px 12px;border:0;background:none;border-radius:13px;color:#ddd;text-align:left;cursor:pointer;transition:background .15s}
.srow .si:hover,.srow.sel .si{background:#1b1b1b}
.srow.sel .si{box-shadow:inset 0 0 0 1px #333}
.srow .si b{display:flex;align-items:center;gap:8px;font:800 13px Inter;color:#fff}
.srow .si b .ct{font:800 9.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a;padding:2px 7px;border-radius:6px;background:#1d1d1d}
.srow .si b .smd{display:inline-flex;align-items:center;gap:4px;font:800 10px Inter;color:#f3dcae;padding:2px 7px;border-radius:6px;background:rgba(232,194,122,.12);border:1px solid rgba(232,194,122,.3)}
/* ---- déroulé d'un script sur le fan (au-dessus de la barre d'envoi) ---- */
.rnb{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px;padding:7px 7px 7px 10px;border-radius:16px;border:1px solid rgba(125,180,255,.28);background:linear-gradient(135deg,rgba(125,180,255,.1),rgba(95,211,162,.04) 60%,transparent),#0f1114;box-shadow:0 12px 30px -16px rgba(125,180,255,.55)}
.rnb.nw{animation:vchIn .5s cubic-bezier(.16,1,.3,1) both}
.rnb.fin{border-color:rgba(95,211,162,.35);background:linear-gradient(135deg,rgba(95,211,162,.1),transparent 60%),#0f1311}
.rnh{display:flex;align-items:center;gap:8px;flex:none}
.rni{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(125,180,255,.15);color:#9cc6ff;flex:none}
.rnb.fin .rni{background:rgba(95,211,162,.15);color:#5fd3a2}
.rnh b{font:800 12.5px Inter;color:#f2f2f2;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnd{display:flex;gap:3px}.rnd i{width:14px;height:4px;border-radius:2px;background:#2a2a2a;transition:all .4s}.rnd i.ok{background:#5fd3a2}.rnd i.cur{background:#7db4ff;box-shadow:0 0 8px #7db4ff;animation:rnP 1.6s ease-in-out infinite}
@keyframes rnP{50%{opacity:.45}}
.rns{font:800 11px Inter;color:#9cc6ff;white-space:nowrap}.rnb.fin .rns{color:#5fd3a2}
.rnbr{order:2;flex-basis:100%;height:0}.rnbr+.rnx{padding-left:34px}.rnchip{order:3}
.rnx{order:4;flex:1 1 160px;min-width:0;padding:0 2px 1px 0;font:500 12.5px Inter;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnx em{font-style:normal;color:#f3dcae;font-weight:800}
.rna{display:flex;gap:5px;flex:none;margin-left:auto}
.rng{height:32px;padding:0 12px;border-radius:10px;border:0;background:#7db4ff;color:#06142b;font:800 12px Inter;cursor:pointer;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(125,180,255,.8);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.rng:active{transform:scale(.95)}.rng.rdy{background:#5fd3a2;color:#05261a;box-shadow:0 8px 20px -8px rgba(95,211,162,.8)}
.rnk,.rnc{height:32px;padding:0 10px;border-radius:10px;border:1px solid #2a2a2a;background:#151515;color:#9a9a9a;font:800 12px Inter;cursor:pointer}
.rnk:hover,.rnc:hover{color:#fff;border-color:#3a3a3a}.rnc{width:32px;padding:0;display:grid;place-items:center}
.rnchip{flex:none;order:3;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;font:800 11px Inter;white-space:nowrap;border:1px solid transparent}
.rnchip.ok{color:#bff3dc;background:rgba(95,211,162,.12);border-color:rgba(95,211,162,.35)}
.rnchip.rl{color:#f6d79a;background:rgba(240,181,74,.12);border-color:rgba(240,181,74,.45);cursor:pointer;animation:rnP 2.2s ease-in-out infinite}
.srow .si b .ct.st{color:#9cc6ff;background:rgba(125,180,255,.12)}.srow .si b .ct.ps{color:#f0b54a;background:rgba(240,181,74,.12)}
.ask-b{width:min(460px,92vw);padding:22px 22px 18px;border-radius:22px;background:#121212;border:1px solid #262626;box-shadow:0 40px 100px -30px #000;animation:dcIn .45s cubic-bezier(.3,1.3,.5,1) both}
.ask-b h3{margin:0 0 8px;font:900 17px Inter;letter-spacing:-.02em;color:#f2f2f2}.ask-b p{margin:0 0 18px;font:500 13px/1.55 Inter;color:#9a9a9a}
.ask-a{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.ask-a button{height:38px;padding:0 14px;border-radius:12px;border:1px solid #2a2a2a;background:#181818;color:#cfcfcf;font:800 12.5px Inter;cursor:pointer}
.ask-a button.pri{background:#5fd3a2;border-color:#5fd3a2;color:#05261a;box-shadow:0 10px 26px -10px rgba(95,211,162,.8)}.ask-a button.dng{color:#f08a96;border-color:rgba(240,98,114,.4);background:rgba(240,98,114,.08)}
.rnb.rnp{border-color:rgba(240,181,74,.3)}.rnb.rnp .rni{color:#f0b54a}

/* ---- fiche du fan (version B) ---- */

.fc-lbs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}

.fc-ft{margin-top:10px;font:500 12.5px/1.45 Inter;color:#bdbdbd}
.fc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.fc-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:800 10.5px Inter;border:1px solid}

.fc-chip.g{color:#bff3dc;background:rgba(95,211,162,.1);border-color:rgba(95,211,162,.3)}
.fc-menu{display:grid;gap:3px;margin-top:10px;padding:6px;border-radius:13px;background:#161616;border:1px solid #2a2a2a;animation:tpIn .35s cubic-bezier(.16,1,.3,1) both}

.fc-menu button small{margin-left:auto;font:600 11px Inter;color:#6a6a6a}
.fc-menu .rs{color:#b49cff}
.fc-run{display:flex;align-items:center;gap:9px}
.fc-run .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(125,180,255,.15);color:#9cc6ff;flex:none}

.fc-run .dots{display:flex;gap:3px;flex:none}.fc-run .dots i{width:12px;height:4px;border-radius:2px;background:#2a2a2a}.fc-run .dots i.ok{background:#5fd3a2}.fc-run .dots i.cu{background:#7db4ff;box-shadow:0 0 8px #7db4ff}
.fc-run+p{margin:7px 0 0 35px;font:500 12px Inter;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-pr{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #191919;min-height:44px}
.fc-pr:last-child{border-bottom:0}
.fc-pr .pi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#171717;border:1px solid #262626;color:#bdbdbd;flex:none}
.fc-pr .pl{font:700 12.5px Inter;color:#cfcfcf;white-space:nowrap}
.fc-pr .pv{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-width:0;font:600 12.5px Inter;color:#e8e8e8;text-align:right;background:none;border:0;padding:0;cursor:pointer}

.fc-pr .pv.add{color:#7db4ff;font-weight:800}.fc-pr .pv.ro{cursor:default}

.fc-pr input{margin-left:auto;width:60%;height:30px;border-radius:9px;border:1px solid #3a3a3a;background:#0b0b0b;color:#eee;font:600 12.5px Inter;padding:0 9px;outline:none}
.fc-pr .cal{flex:none;font:800 9px Inter;letter-spacing:.08em;color:#6a6a6a;padding:2px 6px;border-radius:5px;background:#1a1a1a}
.ftab{grid-template-columns:repeat(3,1fr);margin-bottom:12px}.ftab .ind{width:calc((100% - 6px)/3)}.ftab .ind.p1{transform:translateX(100%)}.ftab .ind.p2{transform:translateX(200%)}.ftab button{height:32px}

.fc-val{position:relative;border-radius:18px;padding:15px;margin-bottom:10px;border:1px solid rgba(95,211,162,.25);background:linear-gradient(135deg,rgba(95,211,162,.12),rgba(95,211,162,.02) 60%),#0e1411;overflow:hidden}

.fc-val .lst{margin-left:auto;text-align:right;font:600 11.5px Inter;color:#7aa894;white-space:nowrap}.fc-val .lst b{display:block;font:800 14px Inter;color:#eafff6;margin-top:2px}
.fc-val .bars{margin-left:auto;height:28px}
.fc-val .fc-mc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px;padding-top:11px;border-top:1px solid rgba(95,211,162,.15)}
.fc-val .fc-mc small{display:block;font:800 9px Inter;letter-spacing:.12em;color:#7aa894;text-transform:uppercase}.fc-val .fc-mc b{display:block;font:900 14px Inter;margin-top:3px;white-space:nowrap}

.fc-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.fc-row2.one{grid-template-columns:1fr}
.fc-cv{display:flex;align-items:center;gap:11px;margin-top:7px}
.fc-rg{position:relative;width:44px;height:44px;flex:none}.fc-rg svg{transform:rotate(-90deg)}.fc-rg .tr{stroke:#222}.fc-rg .vl{stroke:#5fd3a2;transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)}
.fc-rg b{position:absolute;inset:0;display:grid;place-items:center;font:900 9.5px Inter;margin:0;letter-spacing:-.02em}
.fc-kp .fc-sub,.fc-sub{display:inline-flex;width:auto;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:800 11px Inter;margin-top:7px}.fc-sub i{width:6px;height:6px;border-radius:50%;background:currentColor}
.fc-sub.ok{color:#5fd3a2;background:rgba(95,211,162,.1);border:1px solid rgba(95,211,162,.3)}.fc-sub.ex{color:#9a9a9a;background:#171717;border:1px solid #2a2a2a}
.fc-buy{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #181818}.fc-buy:last-child{border-bottom:0}
.fc-buy .bi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(95,211,162,.1);border:1px solid rgba(95,211,162,.25);color:#5fd3a2}
.fc-buy .bi.tp{background:rgba(180,156,255,.1);border-color:rgba(180,156,255,.3);color:#b49cff}
.fc-buy b{display:block;font:800 12.5px Inter}.fc-buy small{display:block;font:600 11px Inter;color:#6a6a6a;margin-top:1px}.fc-buy em{margin-left:auto;font:900 13px Inter;font-style:normal;color:#eafff6}

.tgp{--c:#9a9a9a;position:relative;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 6px;border-radius:999px;font:800 10.5px Inter;white-space:nowrap;flex:none;color:color-mix(in srgb,var(--c) 78%,#fff);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}

.tgp.sp{color:#02240f;background:linear-gradient(105deg,#c9ffdf,#3dff8a 50%,#12d96a);border-color:#3dff8a;overflow:hidden;box-shadow:0 0 14px -2px rgba(61,255,138,.65)}

.tgp.lg{height:30px;padding:0 5px 0 11px;font-size:12.5px;gap:7px}.tgp.lg.nx{padding-right:12px}.tgp.lg .d{width:6px;height:6px}

.tgp.out{animation:tgOut .3s ease-in forwards}
@keyframes tgPop{0%{transform:scale(.3);opacity:0;filter:blur(5px)}55%{transform:scale(1.14);filter:none}100%{transform:none}}
