<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IA de secours — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/style.css">
<style>
.main-area.iam{padding:0!important}
.ia-w{position:relative;min-height:100dvh;padding:28px 32px 70px;background:radial-gradient(1100px 380px at 18% -8%,rgba(95,211,162,.07),transparent 70%),#0a0a0a;box-sizing:border-box;color:#ededed;font-family:Inter,system-ui,sans-serif}
.ia-in{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.gslot:empty{display:none}.gslot .gtabs{margin:0}
.ia-w :focus-visible{outline:2px solid #8be8c2;outline-offset:2px}
.up{animation:up .5s cubic-bezier(.16,1,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.up,.dot{animation:none!important}}
/* en-tête */
.hd{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.hl{display:flex;align-items:center;gap:14px;min-width:0}
.hlogo{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(95,211,162,.12);border:1px solid rgba(95,211,162,.3);display:grid;place-items:center;color:#5fd3a2}
.hd h1{margin:0;font:800 28px/1.05 Inter;letter-spacing:-.02em}.hd h1 em{font-style:italic;color:#8f8f8f}
.hd p{margin:4px 0 0;font:500 13px/1.4 Inter;color:#9b9b9b}
.hr{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.crw{position:relative}.crw[hidden]{display:none}
.crb{display:flex;align-items:center;gap:10px;height:48px;padding:4px 14px 4px 5px;border-radius:999px;border:1px solid #2a2a2a;background:#141414;color:#ededed;font:800 13.5px Inter;cursor:pointer;max-width:100%}
.crb:hover{background:#191919}.crb>svg{flex:none;color:#8f8f8f}.crb>b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cav{flex:none;width:38px;height:38px;border-radius:50%;background:#1d3b2f;color:#9ff0cc;display:grid;place-items:center;font:800 14px Inter}
.tg{flex:none;display:inline-flex;align-items:center;gap:6px;font:800 11px Inter;padding:4px 9px;border-radius:999px;background:#1d1d1d;color:#9b9b9b;white-space:nowrap}
.tg.ok{background:rgba(95,211,162,.1);color:#9ff0cc}.tg.run{background:rgba(95,211,162,.14);color:#9ff0cc}.tg.run i{width:6px;height:6px;border-radius:50%;background:#5fd3a2}
.crm{position:absolute;z-index:30;top:calc(100% + 8px);right:0;min-width:290px;max-height:60vh;overflow:auto;padding:6px;border-radius:18px;background:#141414;border:1px solid #2a2a2a;box-shadow:0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px}
.crm[hidden]{display:none}
.crm button{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:12px;border:0;background:transparent;color:#ededed;font:800 13px Inter;cursor:pointer;text-align:left}
.crm button b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crm button .cav{width:32px;height:32px;font-size:12px}
.crm button:hover,.crm button:focus-visible{background:#1d1d1d}.crm button[aria-selected="true"]{background:#16241e}
.auto{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 14px;border-radius:999px;border:1px solid #2a2a2a;background:#141414;box-sizing:border-box}.auto[hidden]{display:none}
.auto .al{font:800 12.5px Inter;color:#cfcfcf;white-space:nowrap}
#warns{display:flex;flex-direction:column;gap:8px}#warns:empty{display:none}
.warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(240,180,90,.08);border:1px solid rgba(240,180,90,.3);color:#f3cf94;font:600 13px/1.45 Inter}.warn svg{flex:none;margin-top:1px}.warn b{color:#ffe0b0}
/* onglets */
.iatabs{display:flex;gap:4px;padding:5px;border-radius:16px;background:#111;border:1px solid #1e1e1e;align-self:flex-start;max-width:100%;box-sizing:border-box;overflow-x:auto;scrollbar-width:none}
.iatabs[hidden]{display:none}.iatabs::-webkit-scrollbar{display:none}
.iatabs button{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:0;background:transparent;color:#b5b5b5;font:700 13.5px Inter;cursor:pointer;white-space:nowrap}
.iatabs button:hover{color:#ededed;background:#171717}
.iatabs button[aria-selected="true"]{background:#f2f2f2;color:#0a0a0a;font-weight:800}
.iatabs .all{font:800 10.5px Inter;color:#8ab8ff;background:rgba(125,180,255,.12);padding:2px 7px;border-radius:999px}
.iatabs button[aria-selected="true"] .all{color:#1b4a8a;background:#dbe9ff}
.tab{display:flex;flex-direction:column;gap:18px}.tab[hidden]{display:none}
.gl{margin:0;display:flex;align-items:center;gap:10px;font:600 13px/1.4 Inter;color:#b9d3ff}.gl svg{flex:none;color:#8ab8ff}
/* mise en page et cartes */
.lay{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.lay>.mn{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:18px}
.lay>.as{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:18px}
.pn{position:relative;padding:20px;border-radius:22px;background:#111;border:1px solid #1e1e1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);box-sizing:border-box;min-width:0}
.pn h2{margin:0;font:800 16px Inter;letter-spacing:-.005em}.pn h2 em,.pn h3 em{font-style:italic;color:#8f8f8f}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:10px}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 14px Inter}
.ic.g{background:rgba(95,211,162,.12);color:#5fd3a2}.ic.a{background:rgba(240,180,90,.12);color:#f0b45a}.ic.b{background:rgba(125,180,255,.12);color:#8ab8ff}.ic.n{background:rgba(255,255,255,.06);color:#cfcfcf}
.sht{flex:1;min-width:180px}.sht small{display:block;margin-top:2px;font:500 12.5px/1.4 Inter;color:#9b9b9b}
.shr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:13px 0;border-top:1px solid #1b1b1b}.row[hidden]{display:none}
.row .t{flex:1;min-width:160px}.row .t b{display:block;font:700 13.5px Inter;color:#ededed}.row .t small{display:block;margin-top:2px;font:500 12px/1.45 Inter;color:#9b9b9b}
.row.bl{display:block}.row.bl .t{margin-bottom:9px}
.inp{height:36px;border-radius:11px;border:1px solid #2a2a2a;background:#161616;color:#ededed;font:700 13px Inter;padding:0 11px;color-scheme:dark;box-sizing:border-box;min-width:0}
.inp:focus{border-color:#3d6b58;outline:none}.inp:disabled{opacity:.5}
textarea.inp{display:block;width:100%;height:auto;min-height:90px;padding:11px 13px;border-radius:12px;font:500 13px/1.6 Inter;resize:vertical}
select.inp{width:auto;padding-right:8px;cursor:pointer}
#left:empty{display:none}.qh svg{flex:none}
textarea.mono{font:500 12.5px/1.6 ui-monospace,Menlo,monospace;min-height:260px;color:#e6e6e6}
.stp{flex:none;display:inline-flex;align-items:center;border-radius:11px;border:1px solid #2a2a2a;background:#161616;overflow:hidden}
.stp .sb{width:34px;height:36px;border:0;background:transparent;color:#cfcfcf;font:800 16px Inter;cursor:pointer}.stp .sb:hover{background:#1f1f1f;color:#fff}
.stp .inp{width:50px;height:36px;border:0;border-radius:0;background:transparent;text-align:center;padding:0 2px;font-weight:800;-moz-appearance:textfield;appearance:textfield}
.stp .inp::-webkit-inner-spin-button,.stp .inp::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stp .u{font:700 12px Inter;color:#8f8f8f;padding-right:2px;white-space:nowrap}
.unit{font:700 12px Inter;color:#8f8f8f}
.sw{flex:none;position:relative;width:44px;height:26px;border-radius:999px;border:0;background:#2a2a2a;cursor:pointer;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8a8a8a;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s}
.sw.on{background:#5fd3a2}.sw.on i{transform:translateX(18px);background:#062a1d}.sw:disabled{opacity:.45;cursor:not-allowed}
.btn{height:38px;padding:0 14px;border-radius:11px;border:1px solid #2c2c2c;background:#181818;color:#ededed;font:800 12.5px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.btn[hidden]{display:none}.btn:hover{background:#1f1f1f;color:#fff}.btn.w{background:#f2f2f2;color:#0a0a0a;border-color:#f2f2f2}.btn.w:hover{background:#fff;color:#0a0a0a}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:32px;padding:0 11px;font-size:12px;border-radius:10px}.btn.big{height:46px;padding:0 20px;border-radius:13px;font-size:13.5px}
.btn.stop{border-color:#6a2e2e;background:#261313;color:#ffb8b8}.btn.stop:hover{background:#311818;color:#ffd0d0}
.lnk{border:0;background:none;padding:6px 4px;color:#5fd3a2;font:800 12.5px Inter;cursor:pointer;text-decoration:none;white-space:nowrap}.lnk:hover{color:#8be8c2}
.ib{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid #2a2a2a;background:#181818;color:#cfcfcf;display:grid;place-items:center;cursor:pointer}.ib:hover{background:#1f1f1f;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{height:32px;padding:0 12px;border-radius:999px;border:1px solid #2c2c2c;background:#171717;color:#cfcfcf;font:700 12px Inter;cursor:pointer}
.chips button.on{background:#f2f2f2;color:#0a0a0a;border-color:#f2f2f2;font-weight:800}.hint{font:600 12px Inter;color:#8f8f8f;align-self:center}
.seg{flex:none;display:inline-flex;padding:3px;border-radius:11px;background:#161616;border:1px solid #262626}
.seg button{height:30px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#b5b5b5;font:700 12px Inter;cursor:pointer}
.seg button[aria-pressed="true"]{background:#5fd3a2;color:#062a1d;font-weight:800}
.seg.wide{display:flex;background:#0b0b0b;border-color:#222;border-radius:12px}.seg.wide button{flex:1;height:32px;border-radius:9px;font-size:11.5px}.seg.wide button[aria-pressed="true"]{background:#f2f2f2;color:#0a0a0a}
.emp{padding:14px;text-align:center;font:600 13px/1.5 Inter;color:#8f8f8f}
.cnt{margin-top:6px;text-align:right;font:600 12px Inter;color:#8f8f8f}
/* vue d'ensemble */
.pn.live{background:#0f1915;border-color:#1f3a2f}
.lvh{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.lvh .t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
.kick{font:800 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#8f8f8f}.kick.g{color:#7fcfa9}
.lvh .t b{font:800 20px/1.25 Inter;letter-spacing:-.01em}.lvh .t small{font:500 13px/1.45 Inter;color:#9b9b9b}.pn.live .lvh .t small{color:#a9cbbb}
.dot{flex:none;width:14px;height:14px;border-radius:50%;background:#5fd3a2;box-shadow:0 0 0 6px rgba(95,211,162,.16),0 0 18px rgba(95,211,162,.5);animation:pl 1.8s infinite}
.dot.off{background:#3a3a3a;box-shadow:0 0 0 6px rgba(255,255,255,.04);animation:none}@keyframes pl{50%{opacity:.45}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;margin-top:18px}
.stats>*{padding:14px 16px;border-radius:15px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none}
.stats span{font:700 12px Inter;color:#a9cbbb}.stats b{font:800 28px Inter;letter-spacing:-.02em}
.stats .am{background:rgba(240,180,90,.08);border-color:rgba(240,180,90,.28)}.stats .am span,.stats .am b{color:#f3cf94}
.lerr{margin-top:14px;display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(240,180,90,.08);border:1px solid rgba(240,180,90,.25);font:600 12.5px/1.45 Inter;color:#f3cf94}.lerr svg{flex:none;margin-top:1px}
.lf{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:#0c0c0c;border:1px solid #222;margin-top:8px}
.lf .cav{background:#262626;color:#ededed}.lf .t{flex:1;min-width:200px}.lf .t b{display:block;font:800 14px Inter}.lf .t small{display:block;margin-top:3px;font:500 12.5px/1.4 Inter;color:#e3be8f}
.bars{display:flex;gap:4px}.bars i{width:26px;height:6px;border-radius:999px;background:#f0b45a}.bars i.g{background:#5fd3a2}
.ck{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid #1b1b1b}
.ck>span{flex:none;display:grid}.ck>span.g{color:#5fd3a2}.ck>span.a{color:#f0b45a}
.ck .t{flex:1;min-width:0}.ck .t b{display:block;font:700 13.5px Inter}.ck .t small{display:block;margin-top:2px;font:500 12px/1.45 Inter;color:#9b9b9b}
.duo{display:flex;flex-wrap:wrap;gap:18px}.duo>.pn{flex:1 1 320px}
.cb{display:flex;flex-direction:column;gap:6px;margin-top:12px}.cbt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font:600 12.5px Inter;color:#8f8f8f}.cbt>span:first-child{color:#b5b5b5;font-weight:700}.cbt b{color:#9ff0cc}
.cbb{display:flex;gap:4px;height:6px}.cbb i{border-radius:999px;background:#3a3a3a;min-width:4px}.cbb i:first-child{background:#5fd3a2}.cbb.z i{background:#262626}
.cmpl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid #1b1b1b;font:700 12px Inter;color:#b5b5b5}
.cmpn{margin:8px 0 0;font:500 11.5px/1.5 Inter;color:#8f8f8f}
.pill{flex:none;width:auto;height:30px;border-radius:999px;font-size:11.5px;padding:0 10px}
.hs{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #1b1b1b}.hs:first-child{border-top:0}
.hs i{flex:none;width:8px;height:8px;border-radius:50%;background:#3a3a3a}.hs i.on{background:#5fd3a2}
.hs .w{flex:1;min-width:0;font:600 12.5px Inter;color:#b5b5b5}.hs b{font:800 12.5px Inter;text-align:right}
.hsl{margin:-4px 0 8px 18px;font:600 11.5px/1.4 Inter;color:#e3be8f}
.try{padding:0;overflow:hidden;display:flex;flex-direction:column}
.tryh{padding:16px 18px;border-bottom:1px solid #1e1e1e;display:flex;flex-direction:column;gap:10px}
.tryt{display:flex;align-items:flex-start;gap:10px}
.fanx{font:600 11.5px Inter;color:#8f8f8f}
.chat{display:flex;flex-direction:column;gap:8px;padding:16px;background:#0c0c0c;min-height:400px;max-height:560px;overflow:auto}
.bb{max-width:80%;padding:9px 13px;font:500 13.5px/1.45 Inter;white-space:pre-wrap;word-break:break-word;box-sizing:border-box}
.bb.f{align-self:flex-start;background:#1d1d1d;color:#ededed;border-radius:17px 17px 17px 6px}
.bb.a{align-self:flex-end;background:#234033;color:#eafff5;border-radius:17px 17px 6px 17px}
.bb.x{align-self:center;max-width:90%;background:rgba(240,180,90,.1);border:1px solid rgba(240,180,90,.25);color:#f3cf94;font-size:12px;border-radius:12px}
.bb.s{align-self:flex-end;width:80%;padding:0;background:#17263a;border:1px solid rgba(125,180,255,.3);border-radius:17px 17px 6px 17px;overflow:hidden;color:#e6f1ff;white-space:normal}
.mph{height:84px;display:grid;place-items:center;align-content:center;gap:4px;background:repeating-linear-gradient(135deg,#1e3149 0 10px,#1a2b41 10px 20px);font:800 11.5px Inter;color:#9cc6ff}
.mph.pd{background:repeating-linear-gradient(135deg,#2a2414 0 10px,#241f12 10px 20px);color:#f3d491}
.sbd{padding:9px 12px;display:flex;flex-direction:column;gap:4px}.sbd>span{white-space:pre-wrap}
.stl{font:800 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:#9cc6ff}
.bb small{display:block;margin-top:4px;font:700 11px/1.4 Inter;color:#9fd9bd;white-space:normal}.bb.s small{color:#9cc6ff;margin-top:0}
.bb .buy{display:block;margin-top:6px;height:30px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:800 11.5px Inter;cursor:pointer}
.bb .ok{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font:800 11.5px Inter;color:#7be0b0}
.md{align-self:center;max-width:90%;font:800 11px/1.4 Inter;color:#9cc6ff;padding:4px 10px;border-radius:999px;background:rgba(125,180,255,.08);text-align:center}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid #1e1e1e}.cin .inp{flex:1;height:44px;border-radius:12px}
.snd{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:#5fd3a2;color:#062a1d;display:grid;place-items:center;cursor:pointer}.snd:disabled{opacity:.5;cursor:wait}
/* vente */
.howh{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #1b1b1b}
.howh .t{flex:1}.howh b{display:block;font:800 15px Inter}.howh small{display:block;margin-top:2px;font:500 12.5px/1.4 Inter;color:#9b9b9b}
.how3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px;transition:opacity .2s}
.how3>div{display:flex;gap:12px;align-items:flex-start}
.how3 .n{flex:none;width:32px;height:32px;border-radius:50%;background:#262626;color:#ededed;display:grid;place-items:center;font:800 14px Inter}.how3 .n.g{background:#5fd3a2;color:#062a1d}
.how3 b{display:block;font:800 14px Inter}.how3 small{display:block;margin-top:3px;font:500 12.5px/1.45 Inter;color:#9b9b9b}
.how.off .how3{opacity:.4}
.scs{display:flex;flex-direction:column;gap:12px}
.sc{padding:16px;border-radius:18px;background:#0c0c0c;border:1px solid #222;display:flex;flex-direction:column;gap:14px}
.sct{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sct>b{font:800 15px Inter}
.scw{margin-left:auto;font:500 12px/1.4 Inter;color:#9b9b9b;max-width:100%}
.bdg{display:inline-flex;align-items:center;gap:6px;font:800 11px Inter;padding:3px 9px;border-radius:999px;white-space:nowrap}.bdg.g{background:#5fd3a2;color:#062a1d}.bdg.a{background:rgba(240,180,90,.1);border:1px solid rgba(240,180,90,.3);color:#f3cf94;white-space:normal}
.lad{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;row-gap:8px}
.lad li{display:flex;align-items:center}.lad li+li::before{content:"";width:22px;height:2px;background:#2a2a2a}
.nd{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:#161616;border:1px solid #262626}
.nd .k{flex:none;width:26px;height:26px;border-radius:50%;background:#3a3a3a;color:#ededed;display:grid;place-items:center;font:800 12px Inter}
.nd b{display:block;font:800 12.5px Inter}.nd small{display:block;font:600 11.5px Inter;color:#9b9b9b}
.nd.fr{background:#13221c;border-color:#22413a}.nd.fr .k{background:#5fd3a2;color:#062a1d}.nd.fr small{color:#9ff0cc}
.nd.pd{background:#221d10;border-color:#3d3317}.nd.pd .k{background:#f0b45a;color:#2a1c05}.nd.pd small{color:#f3cf94}
.scm{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 12px Inter;color:#9b9b9b}
.nos{padding:12px 14px;border-radius:14px;background:rgba(240,180,90,.07);border:1px solid rgba(240,180,90,.25);font:600 12.5px/1.5 Inter;color:#f3cf94}
.an{display:flex;align-items:center;gap:10px;margin-top:8px}.an span{flex:none;width:140px;font:700 12.5px Inter;color:#cfcfcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.an .inp{flex:1}
/* comportement */
.p7{display:flex;gap:16px}
.rail{flex:none;width:32px;display:flex;flex-direction:column;align-items:center}

      <div><h1>IA de <em>secours</em></h1><p>Elle répond aux fans quand un chatter manque, et s'arrête dès qu'il reprend.</p></div></div>
    <div class="hr"><div class="crw" id="crw"></div><div class="auto" id="auto" hidden></div></div>

</div></div>

<script src="/common.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id), enc = encodeURIComponent;
let D = null, CID = null, INFO = {}, CHAT = {}, TST = {};   // TST : état du script dans l'essai, par créatrice
let TAB = "main", PH = "style", ADV = false, MENU = false; const FAN = {};   // onglet, phase ouverte, « Avancé » ouvert, menu des créatrices, fan de l'essai
// détails de la créatrice : clé, libellé, exemple, champ large
const DTL = [["prenom", "Prénom", "Léa"], ["age", "Âge", "22 ans"], ["naissance", "Date de naissance", "18 mars"], ["genre", "Genre", "femme"], ["origine", "Origine", "française"], ["ville", "Ville", "Paris"], ["fuseau", "Fuseau", "Paris"],
  ["cheveux", "Cheveux", "blonds"], ["yeux", "Yeux", "verts"], ["taille", "Taille", "1,68 m"], ["poids", "Poids", "54 kg"], ["pointure", "Pointure", "39"], ["poitrine", "Tour de poitrine", "85B"], ["langues", "Langues", "français, anglais"],
  ["hobbies", "Passions", "sport, musique pop, séries, skincare", 1], ["traits", "Personnalité", "timide au début, sportive, coquine une fois en confiance", 1], ["signes", "Signes distinctifs", "tatouage rose sur l'avant-bras, piercing au nombril", 1]];
const GRP = [["Identité", "Les questions qu'on lui pose en premier", "g", ["prenom", "age", "naissance", "genre", "origine", "ville", "fuseau", "langues"]],
  ["Apparence", "Quand un fan demande à quoi elle ressemble", "a", ["cheveux", "yeux", "taille", "poids", "pointure", "poitrine", "signes"]],
  ["Personnalité", "Ce qui la rend différente des autres", "b", ["hobbies", "traits"]]];
const TABS = [["main", "Vue d'ensemble", "grid"], ["vente", "Vente", "tag"], ["comp", "Comportement", "chat", 1], ["prof", "Profil", "user"], ["regl", "Réglages", "sliders", 1]];
// les 7 phases d'une conversation (textes pour toutes les créatrices) : clé, nom, résumé, explication
const PHS = [["style", "Langage", "Longueur, ponctuation, emojis, questions", "Comment elle écrit : longueur des messages, ponctuation, emojis, questions."],
  ["kyc", "Découverte du fan", "", "Ce qu'elle cherche à savoir sur lui avant de vendre. Elle arrête de lui poser des questions quand le site connaît déjà son prénom et sa ville ou son métier, ou après les limites ci-dessous."],
  ["launch", "Lancer un script", "Quand elle a le droit de vendre", "Quand elle lance un script. Le site bloque déjà tout script avant « Messages avant le premier média » et pendant la pause après un script (onglet Vente)."],
  ["sex", "Sexualisation", "Jusqu'où elle va, et quand", "Jusqu'où elle va, et quand."],

  ["relance", "Relances", "Comment elle revient vers un fan silencieux", "Comment elle revient vers un fan qui ne répond plus. Les moments des relances se règlent dans l'onglet Réglages."]];
// ce que le site fait toujours, quels que soient les textes
const ALW = [["Fan occupé ou qui part", "Une seule bulle courte, pas de vente, pas de relance, et rien après son « ok »"],
  ["Une seule question par réponse", "Les bulles de questions en trop sont retirées avant l'envoi"],

  ["Refus de Grok", "Le fan est laissé à l'équipe et les managers sont prévenus"]];
const MDL = { fast: ["Rapide", "Répond en quelques secondes, se perd plus vite dans une longue conversation"], smart: ["Plus réfléchi", "Suit mieux la conversation et les règles, un peu plus lent", "conseillé"] };
const IC = { grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  tag: '<path d="M20 13l-7 7-9-9V4h7z"/><circle cx="8" cy="8" r="1.4"/>', chat: '<path d="M20 12a8 8 0 0 1-11.5 7.2L4 20l1-4.3A8 8 0 1 1 20 12z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 4.5-6 8-6s6.4 2 8 6"/>', sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  chev: '<path d="M6 9l6 6 6-6"/>', right: '<path d="M9 6l6 6-6 6"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>', alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/>', doc: '<path d="M7 4h10l3 3v13H4V4z"/><path d="M8 11h8M8 15h5"/>', box: '<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M10 14h4"/>',
  back: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', ok: '<path d="M5 12l5 5 9-10"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  code: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>', book: '<path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5z"/><path d="M8 7h6M8 11h6"/>', pen: '<path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  clock: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>', pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>', moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>', reload: '<path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>', ticket: '<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10"/>' };
const ico = (k, s = 16, w = 2.2) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const STOP = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const PLAY = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
// petits morceaux d'interface : titre de carte, interrupteur, champ avec − et +
const head = (ic, tone, title, sub, right) => `<div class="sh"><span class="ic ${tone}">${ico(ic, 17)}</span><div class="sht"><h2>${title}</h2>${sub ? `<small>${sub}</small>` : ""}</div>${right ? `<div class="shr">${right}</div>` : ""}</div>`;
const sw = (on, attrs, label) => `<button type="button" class="sw ${on ? "on" : ""}" aria-pressed="${!!on}" aria-label="${esc(label)}" ${attrs || ""}><i></i></button>`;
const stp = (attr, label, val, min, max, unit, step) => `<span class="stp"><button type="button" class="sb" data-d="-1" aria-label="Moins : ${esc(label)}">−</button><input class="inp n" type="number" inputmode="numeric" min="${min}" max="${max}" step="${step || 1}" ${attr} aria-label="${esc(label)}" value="${val}">${unit ? `<span class="u">${unit}</span>` : ""}<button type="button" class="sb" data-d="1" aria-label="Plus : ${esc(label)}">+</button></span>`;
const row = (title, sub, ctl, attrs) => `<div class="row" ${attrs || ""}><div class="t"><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</div>${ctl}</div>`;
const hfr = m => (m = Math.round(m)) < 60 ? m + " min" : Math.floor(m / 60) + " h" + (m % 60 ? " " + String(m % 60).padStart(2, "0") : "");
const pl = (n, a, b) => `${n} ${n > 1 ? b : a}`;
try { CID = localStorage.getItem("ia:cid"); TAB = localStorage.getItem("ia:tab") || "main"; } catch (e) {}
if (!TABS.some(t => t[0] === TAB)) TAB = "main";
const cur = () => D && D.creators.find(c => c.id === CID);
const init = c => (String((c && c.label) || "?").trim()[0] || "?").toUpperCase();
const hm = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const day = t => new Date(t).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const rel = t => { const d = new Date(t).toDateString(); return d === new Date().toDateString() ? "Aujourd'hui" : d === new Date(Date.now() - 864e5).toDateString() ? "Hier" : day(t); };
const eur = n => String((+n || 0).toFixed(2)).replace(".", ",") + " €";
const eu = n => String(Math.round((+n || 0) * 100) / 100).replace(".", ",") + " €";
const line = r => `${r.replies} réponse${r.replies > 1 ? "s" : ""}${r.medias ? ` · ${r.medias} média${r.medias > 1 ? "s" : ""}` : ""}${r.sales && r.sales.n ? ` · ${eur(r.sales.net)}` : ""}`;
const filled = c => DTL.filter(([k]) => String(((c.cfg.details || {})[k]) || "").trim()).length;

async function load(keep) {
  D = await api("/api/twizz/ai", { fresh: true });
  if (!D.creators.length) { $("crw").innerHTML = ""; $("tabs").hidden = true; $("body").innerHTML = `<div class="pn emp">Aucune créatrice Twizz : teste d'abord la connexion Twizz dans Réglages fondateur.</div>`; return; }
  if (!cur()) CID = D.creators[0].id;
  paintAuto(); paintWarns(); paintCrs(); paintTabs(); if (!keep) await paintBody(); else { paintRun(); paintHist(); paintReady(); }
}
const save = async (url, body) => { try { D = await api(url, { body }); return true; } catch (e) { notify("Réglage refusé", e.message, "err"); await load(); return false; } };
function paintAuto() {
  const A = $("auto"); A.hidden = false; A.title = (D.on ? "Allumée : les managers peuvent la lancer." : "Coupée : personne ne peut la lancer.") + (D.founder ? "" : " Réglée par le fondateur.");
  A.innerHTML = `<span class="al">${D.on ? "IA allumée" : "IA coupée"}</span>${sw(D.on, `id="autoSw" ${D.founder ? "" : "disabled"}`, "Allumer ou couper l'IA de secours")}`;
  if (D.founder) $("autoSw").onclick = async () => { if (!D.on && !confirm("Allumer l'IA de secours ?\n\nLes managers pourront la lancer sur une créatrice : elle répondra vraiment aux fans sur Twizz, avec Grok.")) return;
    if (await save("/api/twizz/ai/switch", { on: !D.on })) { notify(D.on ? "IA de secours allumée" : "IA de secours coupée", "", D.on ? "ok" : "info"); paintAuto(); paintCrs(); paintRun(); } };

function paintWarns() {

  $("warns").innerHTML = (!D.key ? w("Clé Grok manquante : ajoute la variable <b>XAI_API_KEY</b> dans Railway, puis redémarre le site.") : "")
    + (!D.send ? w("L'envoi vers les fans est coupé dans la messagerie : l'IA ne pourrait rien envoyer.") : "");
}
// choix de la créatrice : un bouton et sa liste (caché sur les onglets qui valent pour toutes)
function paintCrs() {
  const c = cur(), box = $("crw"); if (!c) return;
  const tg = x => x.run ? `<span class="tg run"><i></i>En cours</span>` : x.cfg.ok ? `<span class="tg ok">Accord</span>` : `<span class="tg">Pas d'accord</span>`;
  box.innerHTML = `<button type="button" class="crb" id="crb" aria-haspopup="listbox" aria-expanded="${MENU}" aria-label="Choisir la créatrice, ${esc(c.label)}"><span class="cav">${esc(init(c))}</span><b>${esc(c.label)}</b>${tg(c)}${ico("chev", 16, 2.4)}</button>
    <div class="crm" role="listbox" aria-label="Créatrices" ${MENU ? "" : "hidden"}>${D.creators.map(x => `<button type="button" role="option" aria-selected="${x.id === CID}" data-c="${esc(x.id)}"><span class="cav">${esc(init(x))}</span><b>${esc(x.label)}</b>${tg(x)}</button>`).join("")}</div>`;
  box.hidden = TAB === "comp" || TAB === "regl";
  $("crb").onclick = e => { e.stopPropagation(); MENU = !MENU; paintCrs(); if (MENU) { const s = box.querySelector('[aria-selected="true"]'); if (s) s.focus(); } };
  box.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { MENU = false; const changed = b.dataset.c !== CID; CID = b.dataset.c; try { localStorage.setItem("ia:cid", CID); } catch (e) {}
    paintCrs(); if (changed) paintBody(); $("crb").focus(); });
}
function paintTabs() {
  const N = $("tabs"); N.hidden = false;
  N.innerHTML = TABS.map(([k, l, i, all]) => `<button type="button" role="tab" id="tb-${k}" aria-controls="t-${k}" aria-selected="${TAB === k}" tabindex="${TAB === k ? 0 : -1}" data-tab="${k}">${ico(i)}${l}${all ? `<span class="all">toutes</span>` : ""}</button>`).join("");
}
function setTab(k, focus) {
  if (!TABS.some(t => t[0] === k)) return; TAB = k; try { localStorage.setItem("ia:tab", k); } catch (e) {} MENU = false; paintTabs(); paintCrs();
  document.querySelectorAll(".tab").forEach(s => { const on = s.id === "t-" + k; s.hidden = !on; if (on) { s.classList.remove("up"); void s.offsetWidth; s.classList.add("up"); } });
  if (focus) $("tb-" + k).focus();
}

const kindOf = s => s.v && !s.p ? (s.v > 1 ? `${s.v} vidéos` : "Vidéo") : s.p && !s.v ? (s.p > 1 ? `${s.p} photos` : "Photo") : pl(s.n, "média", "médias");

const hsel = (k, v, label) => `<select class="inp" data-g="${k}" aria-label="${label}">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${+v === h ? "selected" : ""}>${h} h</option>`).join("")}</select>`;
const flip = (b, v) => { if (!b) return; b.classList.toggle("on", !!v); b.setAttribute("aria-pressed", !!v); };

function scHtml(x, G) {
  const P = x.path || [], paid = P.some(s => s.price > 0), rm = (P.find(s => s.price > 0 && s.relanceMin) || {}).relanceMin || G.relanceAfter;
  const node = (s, i) => s.n && s.price > 0 ? `<li><span class="nd pd"><span class="k">${i + 1}</span><span><b>${kindOf(s)} · ${eu(s.price)}</b><small>${s.floor ? `plancher ${eu(s.floor)}` : "pas de plancher"}${s.tease ? " · teasing avant" : ""}</small></span></span></li>`
    : s.n ? `<li><span class="nd fr"><span class="k">${i + 1}</span><span><b>${kindOf(s)}</b><small>offert${s.tease ? " · teasing avant" : ""}</small></span></span></li>`
    : `<li><span class="nd"><span class="k">${i + 1}</span><span><b>Message</b><small>sans média</small></span></span></li>`;
  return `<article class="sc"><div class="sct"><b>${esc(x.title)}</b>${x.first ? `<span class="bdg g">Premier script</span>` : ""}${x.when ? `<span class="scw">Quand : ${esc(x.when)}</span>` : `<span class="bdg a">${ico("alert", 12, 2.6)}Ajoute une description dans Scripts : elle saura quand le lancer</span>`}</div>
    <ol class="lad" aria-label="Étapes de ${esc(x.title)}">${P.map(node).join("")}</ol>
    <div class="scm">${paid && G.relance ? `<span>Relance s'il n'achète pas : ${hfr(rm)}</span>` : ""}<span>Quitte le script après ${String(x.timeout).replace(".", ",")} h sans réponse</span></div></article>`;
}

function idHead(c) {
  const Dt = c.cfg.details || {}, n = filled(c), nm = String(Dt.prenom || c.label).trim(), age = String(Dt.age || "").trim(), C = 94.25;
  const tip = n >= 17 ? "Tout est rempli" : !(String(Dt.age || "").trim() && String(Dt.ville || "").trim() && String(Dt.cheveux || "").trim()) ? "Commence par l'âge, la ville et le physique" : "Plus c'est rempli, moins elle invente";
  return `<span class="big" aria-hidden="true">${esc(init({ label: nm }))}</span><div class="t"><span class="kick">Ce que l'IA sait d'elle</span><b>${esc(nm)}${age ? ", " + esc(age) : ""}</b><small>Elle donne ces infos comme des faits, sans jamais se contredire. Laisse vide ce que tu ne veux pas dire.</small></div>
    <div class="ring"><svg role="img" aria-label="${n} champs remplis sur 17" width="54" height="54" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#262626" stroke-width="4"/>${n ? `<circle cx="18" cy="18" r="15" fill="none" stroke="${n >= 6 ? "#5fd3a2" : "#f0b45a"}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(n / 17 * C).toFixed(1)} ${C}" transform="rotate(-90 18 18)"/>` : ""}</svg><div><b>${n} sur 17</b><small>${tip}</small></div></div>`;
}

          <tbody>${S.map(x => `<tr style="border-top:1px solid rgba(255,255,255,.06)"><td style="padding:6px 4px">${esc(x.label)}</td><td style="padding:6px 4px;text-align:right">${x.n}</td><td style="padding:6px 4px;text-align:right">${x.back}</td><td style="padding:6px 4px;text-align:right${x.old >= 5 && x.lost / x.old >= .5 ? ";color:#ff8a8a" : ""}">${x.lost}${x.old ? " (" + Math.round(100 * x.lost / x.old) + " %)" : ""}</td></tr>`).join("")}</tbody></table>
          <small class="mut" style="display:block;padding:8px 2px 4px;line-height:1.55">Chaque réponse de l'IA est rangée dans l'étape où en était le fan. « Sans suite » : il n'a pas réécrit plus d'une heure après. Un fan qui part se coucher compte aussi : ce chiffre sert à comparer les étapes entre elles et d'un jour à l'autre, pas à juger une conversation.</small></div>`; })()}
        ${(() => { const U = D.usage || { week: 0, today: 0, budget: G.budget, byCreator: {}, byKind: {} }, B = +G.budget || 0, pc = B ? Math.min(100, Math.round(100 * U.week / B)) : 0, $ = v => (v || 0).toFixed(2).replace(".", ",") + " $";

  $("base").onchange = async () => { if (await save("/api/twizz/ai/cfg", { base: $("base").value })) { notify("Instructions enregistrées", "Elles valent pour toutes les créatrices", "ok"); INFO = {}; loadInfo(true); } };

  $("profReset").onclick = async () => { if (!confirm(`Revenir à la fiche de ${cur().label} ?\n\nLe texte écrit à la main sera effacé.`)) return; if (await save(`/api/twizz/ai/cfg/${enc(CID)}`, { profile: "" })) { notify("Fiche reprise", "", "ok"); loadInfo(true); } };

  $("scanB").onclick = async () => { const b = $("scanB"); b.disabled = true; if (await save(`/api/twizz/ai/scan/${enc(CID)}`, {})) { notify("Analyse du coffre lancée", "Grok décrit chaque média, une seule fois", "ok"); scanPoll(); } else b.disabled = false; };
  if (c.scan && c.scan.running) scanPoll();
  document.querySelectorAll("[data-dt]").forEach(i => { i.oninput = () => i.parentNode.classList.toggle("on", !!i.value.trim());
    i.onchange = async () => { const d = {}; document.querySelectorAll("[data-dt]").forEach(x => { if (x.value.trim()) d[x.dataset.dt] = x.value.trim(); });

  const W = $("frw"), at = x => { const r = W.getBoundingClientRect(); return snap((x - r.left) / r.width * 1440); };
  W.onclick = e => { if (e.target.closest(".frp")) return; if (P0.length >= 4) return notify("4 relances au plus", "Retire un moment avant d'en ajouter un", "info");
    const m = at(e.clientX); if (!P0.includes(m)) setPoints(P0.concat(m), "Relance ajoutée"); };
  W.querySelectorAll(".frp").forEach(b => { const i = +b.dataset.i; let drag = null, kT = null;
    const show = m => { b.style.left = m / 14.4 + "%"; b.querySelector("b").textContent = hfr(m); };
    b.onpointerdown = e => { if (e.button) return; e.preventDefault(); b.focus(); b.setPointerCapture(e.pointerId); drag = { x: e.clientX, m: P0[i], moved: false }; b.classList.add("drag"); };
    b.onpointermove = e => { if (!drag) return; if (Math.abs(e.clientX - drag.x) > 3) drag.moved = true; if (drag.moved) { drag.m = at(e.clientX); show(drag.m); } };
    b.onpointerup = () => { if (!drag) return; const d = drag; drag = null; b.classList.remove("drag"); if (d.moved && d.m !== P0[i]) { const P = P0.slice(); P[i] = d.m; setPoints(P, "", d.m); } };
    b.onpointercancel = () => { drag = null; b.classList.remove("drag"); show(P0[i]); };
    b.onclick = e => e.stopPropagation();
    b.onkeydown = e => { if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); if (P0.length > 1) setPoints(P0.filter((_, j) => j !== i), "Relance retirée"); return; }
      const d = e.key === "ArrowRight" || e.key === "ArrowUp" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowDown" ? -1 : 0; if (!d) return; e.preventDefault();
      P0[i] = snap(P0[i] + d * (e.shiftKey ? 60 : 15)); show(P0[i]); clearTimeout(kT); kT = setTimeout(() => setPoints(P0, "", P0[i]), 700); }; });
  cc.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => setPoints(P0.filter((_, j) => j !== +b.dataset.rm), "Relance retirée"));
}
function paintChat() {
  const L = CHAT[CID] || [], box = $("chat"); if (!box) return;
  const e2 = v => String(v).replace(".", ","), mk = D.cfg.mark ? " 🤖" : "";

  const media = (paid, label) => `<div class="mph ${paid ? "pd" : ""}">${paid ? ico("lock", 18) : ""}<span>${label}</span></div>`;
  box.innerHTML = (L.length ? L.map(m => m.mode ? `<div class="md">${esc(m.mode)}</div>` : m.fan ? `<div class="bb f">${esc(m.text)}</div>` : m.leave ? `<div class="bb x">Elle laisserait ce fan à l'équipe : ${esc(m.leave)}</div>`
    : m.tk ? `<div class="bb s">${media(true, `${esc(m.text)} · ${e2(m.price)} €`)}<div class="sbd"><span class="stl">Ticket · rien n'est envoyé au Studio pendant l'essai</span>${buy(m)}</div></div>`
    : m.step ? `<div class="bb s">${m.step.medias ? media(m.price > 0, `${m.step.medias > 1 ? m.step.medias + " médias" : "média"} · ${m.price > 0 ? e2(m.price) + " €" : "offert"}`) : ""}<div class="sbd"><span class="stl">Étape ${m.step.k + 1} sur ${m.step.n} · ${esc(m.step.script)}${m.price > 0 && m.step.floor ? ` · plancher ${e2(m.step.floor)} €` : ""}</span>${m.text ? `<span>${esc(m.text)}${mk}</span>` : ""}${m.step.what ? `<small>${esc(m.step.what)}</small>` : ""}${buy(m)}</div></div>`
    : `<div class="bb a">${esc(m.text)}${m.text ? mk : ""}${m.floor ? `<small>+ le même média au prix plancher : ${e2(m.price)} €</small>${buy(m)}` : m.tz ? `<small>teasing de l'étape, juste avant le média</small>` : m.media ? `<small>+ média de « ${esc(m.media)} »${m.what ? ` (${esc(m.what)})` : ""} à ${e2(m.prix)} €${m.remise ? ` · remise ${m.remise} %` : ""}</small>` : m.teaser ? `<small>teasing : elle pourra envoyer le média après ta réponse</small>` : ""}</div>`).join("")
    : `<div class="emp">Commence par un message de fan, par exemple « coucou ça va ? »</div>`) + (WAITING === CID ? `<div class="md">Elle écrit…</div>` : "");

}
async function tryIt() {
  const t = $("tryIn").value.trim(); if (!t || WAITING) return; const cid = CID, L = CHAT[cid] = CHAT[cid] || [];
  const uid = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), T = TST[cid] || (TST[cid] = { state: null, burned: [] });
  L.push({ fan: true, text: t, id: uid() }); $("tryIn").value = ""; WAITING = cid; paintChat(); $("tryGo").disabled = true;
  try { const r = await api(`/api/twizz/ai/try/${enc(cid)}`, { body: { fan: FAN[cid] || "new", state: T.state, burned: T.burned, ticket: T.ticket || null,
      messages: L.filter(m => !m.leave && !m.mode).map(m => ({ fan: !!m.fan, text: m.text || "", teaser: !!m.teaser, id: m.id, price: m.step || m.floor || m.tk ? m.price : undefined, paid: !!m.paid })) } });
    T.state = r.state || null; T.burned = r.burned || T.burned; T.ticket = r.tkState || null;
    if (r.mode) L.push({ mode: r.mode + (r.ended ? ` · fin du script : ${r.ended}` : "") });
    if (r.laisser) L.push({ leave: r.laisser });
    else { r.bulles.forEach((b, i) => { const lst = i === r.bulles.length - 1; L.push({ id: lst && r.floor ? r.floor.id : uid(), text: b, media: lst ? r.album : null, what: lst ? r.media : null, prix: r.prix, remise: lst ? r.remise : null, teaser: lst && r.teaser, gate: lst ? r.gate : "",
        floor: lst && !!r.floor, price: lst && r.floor ? r.floor.price : undefined }); });
      if (r.floor && !r.bulles.length) L.push({ id: r.floor.id, text: "", floor: true, price: r.floor.price });
      if (r.ticket) L.push({ id: r.ticket.id, text: r.ticket.text, tk: r.ticket, price: r.ticket.price });
      if (r.studio) L.push({ mode: "Demande envoyée au Studio : " + r.studio });
      if (r.step) { if (r.step.tease) L.push({ id: uid(), text: r.step.tease, tz: true }); L.push({ id: r.step.id, text: r.step.text, step: r.step, price: r.step.price }); }
      if (r.guarded) notify("Bulle retirée", "L'IA disait envoyer un média alors qu'aucun ne partait", "info"); } }
  catch (e) { notify("Essai impossible", e.message, "err"); L.pop(); if (cid === CID && $("tryIn")) $("tryIn").value = t; }
  WAITING = null; if ($("tryGo")) $("tryGo").disabled = false; if (cid === CID) paintChat();
}

document.addEventListener("click", e => {

  if (sb) { const i = sb.parentNode.querySelector("input"); if (!i || i.disabled) return; const st = +i.step || 1, mn = i.min === "" ? -Infinity : +i.min, mx = i.max === "" ? Infinity : +i.max;
    const v = Math.min(mx, Math.max(mn, Math.round(((+i.value || 0) + st * +sb.dataset.d) / st) * st)); if (v === +i.value) return;

});
