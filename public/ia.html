<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IA de secours — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/style.css">
<style>
.main-area.iam{padding:0!important}
.ia-w{position:relative;min-height:100dvh;padding:26px 28px 70px;background:radial-gradient(900px 300px at 30% -120px,rgba(95,211,162,.07),transparent 70%),#0a0a0a;box-sizing:border-box}
.up{animation:up .7s cubic-bezier(.16,1,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.cap{font:800 10px Inter;letter-spacing:.2em;text-transform:uppercase;color:#6a6a6a}
.met{font-style:italic;background:linear-gradient(100deg,#fff,#8a8a8a 55%,#e6e6e6);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hd{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hd h1{margin:6px 0 0;font:900 38px Inter;letter-spacing:-.045em;line-height:1.02}
.lead{font:500 13px/1.55 Inter;color:#7a7a7a;max-width:780px;margin:8px 0 16px}.lead b{color:#cfcfcf}
.auto{margin-left:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:16px;background:#111;border:1px solid #232323}
.auto b{display:block;font:800 13px Inter;color:#eee}.auto small{display:block;font:600 11.5px Inter;color:#7a7a7a;margin-top:2px}
.sw{flex:none;width:44px;height:26px;border-radius:999px;border:0;background:#2a2a2a;position:relative;cursor:pointer;transition:background .25s}.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bbb;transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .25s}
.sw.on{background:#3ddc97}.sw.on i{transform:translateX(18px);background:#fff}.sw:di
