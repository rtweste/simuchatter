<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simu Chatter — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.persona{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
.persona:hover{border-color:#3d4354}
.persona.sel{border-color:var(--accent);background:#1f1f1f}
.persona b{display:block;margin-bottom:4px}
.persona span.d{font-size:12px;color:var(--muted);line-height:1.4;display:block;margin-bottom:8px}
#chatScreen{height:100vh;height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3a4256,#20242f);display:flex;align-items:center;justify-content:center;font-weight:700}
.topbar .who b{display:block}.topbar .who span{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:18px}.stat{text-align:right}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:15px}
@media(max-width:700px){.stats{display:none}}
.main{flex:1;display:flex;min-height:0}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:6px}
#msgs > *{flex-shrink:0}
.msg{max-width:70%;padding:9px 13px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.fan{background:var(--them);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--me);color:#0a0a0a;align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;font-size:12px;color:var(--muted);padding:4px 10px;background:var(--panel2);border-radius:20px;margin:6px 0;text-align:center}
.ppv{align-self:flex-end;width:250px;background:#161616;border:1px solid #333;border-radius:14px;overflow:hidden}
.ppv .lock{height:100px;background:repeating-linear-gradient(45deg,#1c1c1c,#1c1c1c 10px,#151515 10px,#151515 20px);display:flex;align-items:center;justify-content:center;font-size:28px}
.ppv .info{padding:10px 12px}.ppv .info b{color:var(--text)}.ppv .st{font-size:12px;margin-top:4px}
.typing{align-self:flex-start;background:var(--them);padding:10px 14px;border-radius:16px;display:flex;gap:4px}
.typing i{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.composer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel);display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;resize:none}
.side{width:300px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow-y:auto}
#infoBtn{display:none}
@media(max-width:860px){
  .side{display:none}
  .side.open{display:block;position:fixed;left:0;right:0;bottom:0;top:120px;width:auto;z-index:20;border-left:0;border-top:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  #infoBtn{display:inline-block}
  #chatScreen{height:calc(100dvh - 55px)}
  .topbar{padding:10px 12px;gap:10px}
  .topbar .avatar{width:34px;height:34px}
  .msg{max-width:85%}
  .composer{padding:10px}
  #ppvBtn{padding:10px}
}
.side h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.side h3:first-child{margin-top:0}
.hint{background:#2a2414;border:1px solid #4d4020;color:#f3d999;border-radius:10px;padding:10px;font-size:13px;line-height:1.45;margin-top:8px}

/* ===================== Choix du fan ===================== */
.persona{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:#111;border:1px solid var(--line);transition:border-color .25s,background .25s,transform .25s cubic-bezier(.3,1.4,.5,1)}
.persona:hover{border-color:#333;transform:translateY(-2px)}
.persona.sel{border-color:#d6bd86;background:#14120d;box-shadow:0 0 0 1px rgba(214,189,134,.25)}
.persona .pav{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;position:relative}
.persona .pbody{min-width:0}
.persona b{margin-bottom:2px}
.persona .lvl{display:flex;gap:3px;margin-top:2px}
.persona .lvl i{width:6px;height:6px;border-radius:50%;background:#2a2a2a}
.persona .lvl i.on{background:#d6bd86}
.persona .lvlt{font-size:11px;color:var(--muted);margin-left:6px}
#homeScreen,#chatScreen,#reportScreen{animation:scrIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
#homeScreen.leaving{animation:scrOut .28s ease forwards}
@keyframes scrOut{to{opacity:0;transform:scale(.97)}}

/* ===================== Conversation ===================== */
.topbar{position:relative}
.avatar{position:relative;background:#2c3a52}
.avatar::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--panel)}
.avatar.off::after{background:#555}
.topbar .who span{display:block;height:16px;overflow:hidden}
.topbar .who span.typingtxt{color:var(--good);animation:stIn .25s ease}
@keyframes stIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.stat b{display:inline-block;font-variant-numeric:tabular-nums}
.stat b.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.25);color:#d6bd86}100%{transform:none}}
.imeter{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#1a1a1a;display:none}
.imeter i{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0;transition:width 1.2s cubic-bezier(.2,.8,.2,1),background 1s;box-shadow:0 0 10px currentColor}
.imeter.show{display:block}
.msg{animation:pop .45s cubic-bezier(.3,1.4,.5,1) both;border-radius:18px}
.msg.fan{transform-origin:left bottom;border-bottom-left-radius:5px}
.msg.me{transform-origin:right bottom;border-bottom-right-radius:5px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
.sys{animation:stIn .3s ease}
.rcpt{align-self:flex-end;font-size:11px;color:#6f6f6f;margin:-2px 4px 4px;animation:stIn .3s ease}
.rcpt.seen{color:#9a9a9a}
.typing{border-radius:18px;border-bottom-left-radius:5px;padding:12px 14px;animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
.typing i{width:7px;height:7px}
.hint{animation:hintIn .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes hintIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#ppvBtn{display:inline-flex;align-items:center;gap:6px}
#ppvBtn svg{width:16px;height:16px}
.toast{position:fixed;left:50%;top:76px;z-index:60;transform:translate(-50%,-16px);background:#17140d;border:1px solid #5a4a26;color:#ecd9a8;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){.toast{top:calc(122px + env(safe-area-inset-top))}}
/* PPV */
.ppv{width:240px;border-radius:18px;background:#151515;border:1px solid #2c2c2c;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;position:relative;transition:border-color .5s,box-shadow .5s,opacity .5s}
.ppv .pic{height:140px;position:relative;overflow:hidden;background:#222}
.ppv .img{position:absolute;inset:-20px;background:radial-gradient(circle at 30% 35%,#6b4f43,transparent 45%),radial-gradient(circle at 70% 60%,#3d2f3c,transparent 50%),radial-gradient(circle at 50% 100%,#58403a,#1c1718 70%);filter:blur(18px) brightness(.75);transition:filter 1s ease .35s}
.ppv .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;transition:opacity .4s ease .5s}
.ppv .ring{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.ppv .shackle{transition:transform .45s cubic-bezier(.3,1.6,.5,1);transform-box:view-box;transform-origin:7px 11px}
.ppv .lk b{font-size:13px}
.ppv .info{padding:10px 12px;font-size:12.5px;line-height:1.4}
.ppv .info .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ppv .pst{font-weight:600;color:#8f8f8f;transition:color .4s}
.ppv .spark{position:absolute;left:50%;top:70px;width:6px;height:6px;margin:-3px;border-radius:50%;background:#f0dca8;opacity:0;pointer-events:none}
.ppv .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(240,220,168,.5),transparent 60%);opacity:0;pointer-events:none}
.ppv.bought .img{filter:blur(0) brightness(1)}
.ppv.bought .lk{opacity:0}
.ppv.bought .shackle{transform:translateY(-4px) rotate(-18deg)}
.ppv.bought .pst{color:#d6bd86}
.ppv.bought{border-color:#4d4126;box-shadow:0 0 0 1px rgba(214,189,134,.2),0 10px 40px rgba(214,189,134,.14)}
.ppv.bought .spark{animation:burst .9s cubic-bezier(.2,.7,.2,1) .4s forwards}
.ppv.bought .flash{animation:fl .9s ease-out .35s}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@keyframes fl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.ppv.refused{opacity:.55}
.ppv.refused .pst{color:#b98f5e}
.ppv.nego .pst{color:var(--warn)}
.ppv.replaced{opacity:.4}

/* ===================== Rapport ===================== */
#reportScreen .wrap{padding-top:14px;padding-bottom:14px}
body:has(#reportScreen:not(.hidden)) .dock{display:none}
body:has(#reportScreen:not(.hidden)) .main-area{padding-bottom:0}
.rp{position:relative}
.rp-top{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rp-detail{max-width:760px;margin:22px auto 0;display:flex;flex-direction:column;gap:14px}
.rp .card{background:#0f0f0f;border:1px solid #1c1c1c;border-radius:18px;padding:13px 14px}
.rp .card h3{font-size:12px;margin:0 0 9px;color:#bdbdbd;font-weight:600}
.rp .flag{margin:0}
/* héros */
.rp .hero{position:relative;overflow:hidden;background:#0f0f0f;border:1px solid #1c1c1c;border-radius:20px;padding:16px;display:flex;align-items:center;gap:16px;transition:border-color .5s,box-shadow .5s}
.rp .ringw{position:relative;width:128px;height:128px;flex-shrink:0;z-index:2}
.rp .ringw svg{transform:rotate(-90deg);display:block}
.rp .ringw .bg{stroke:#191919}
.rp .ringw .fg{stroke:#ededed;stroke-linecap:round;transition:stroke .5s,filter .5s}
.rp .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rp .num small{color:#8f8f8f;font-size:10.5px}
.odo{display:flex;gap:1px;font-family:Outfit,Inter,sans-serif;font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:#f5f5f5;transition:filter .6s}
.odo .col{display:block;width:.6em;height:1.2em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 24%,#000 76%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 24%,#000 76%,transparent 100%)}
.rp .strip{display:flex;flex-direction:column;align-items:center;will-change:transform,filter;transition:opacity .4s}
.rp .strip span{display:block;height:1em;line-height:1em}
.odo.idle .strip{opacity:.16}
.odo .col.lock .strip{animation:land .5s cubic-bezier(.3,1.9,.45,1)}
@keyframes land{0%{margin-top:-.09em}100%{margin-top:0}}
.rp .hside{position:relative;z-index:4;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.rp .win{display:block;font-size:15px;line-height:1.3;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#d0d0d0;opacity:0}
.rp .verdict{margin:9px 0 0;font-size:12px;line-height:1.45;color:#b5b5b5;opacity:0;transition:opacity .6s .9s}
.cmpv{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:500;color:#cfcfcf;border:1px solid #262626;border-radius:20px;padding:4px 10px 4px 8px;opacity:0;transform:translateY(10px) scale(.9);transition:opacity .45s,transform .55s cubic-bezier(.3,1.5,.5,1)}
.cmpv b{color:#f5f5f5;font-variant-numeric:tabular-nums}
.cmpv svg{color:#5fd3a2}
.cmpv.down svg{color:#c99a62}
.cmpv.neutral{padding-left:10px}
.rp.done-spin .win{animation:slam .55s cubic-bezier(.2,1.4,.4,1) .12s forwards}
.rp.done-spin .verdict{opacity:1}
.rp.j2 .cmpv{opacity:1;transform:none}
@keyframes slam{0%{opacity:0;transform:scale(2.2);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
/* jackpot (80 et plus) */
.halo{position:absolute;left:80px;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,rgba(214,189,134,.16) 0,rgba(214,189,134,.06) 30%,transparent 55%);opacity:0;transform:scale(.4);pointer-events:none;z-index:1}
.ripple{position:absolute;left:80px;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:1px solid rgba(214,189,134,.55);opacity:0;pointer-events:none;z-index:1}
.flashg{position:absolute;inset:0;background:radial-gradient(circle at 80px 50%,rgba(239,228,200,.3),rgba(214,189,134,.07) 35%,transparent 65%);opacity:0;pointer-events:none;z-index:3}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.trace{position:absolute;inset:0;border-radius:20px;padding:2px;pointer-events:none;z-index:2;opacity:0;
  background:conic-gradient(from var(--a),transparent 0deg 120deg,rgba(214,189,134,.08) 135deg,rgba(214,189,134,.7) 168deg,#f3ead6 178deg,transparent 180deg 300deg,rgba(214,189,134,.08) 315deg,rgba(214,189,134,.7) 348deg,#f3ead6 358deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:trace 2.4s linear infinite}
.trace.glow{padding:7px;filter:blur(7px);background:conic-gradient(from var(--a),transparent 0deg 150deg,rgba(214,189,134,.22) 172deg,transparent 185deg 330deg,rgba(214,189,134,.22) 352deg,transparent 360deg);z-index:0}
@keyframes trace{to{--a:360deg}}
.rp.is-jack.done-spin .hero{border-color:#2a261f;box-shadow:0 0 50px rgba(214,189,134,.05);animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{15%,55%{transform:translate(-5px,2px)}35%,75%{transform:translate(5px,-2px)}100%{transform:none}}
.rp.is-jack.done-spin .halo{animation:haloIn 1s cubic-bezier(.2,.8,.2,1) forwards,haloB 5s ease-in-out 1.2s infinite}
@keyframes haloIn{to{opacity:1;transform:scale(1)}}
@keyframes haloB{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}
.rp.is-jack.done-spin .ripple{animation-name:ripple;animation-duration:1.8s;animation-timing-function:cubic-bezier(.15,.6,.3,1);animation-fill-mode:both}
@keyframes ripple{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.rp.is-jack.done-spin .flashg{animation:fg .9s ease-out}
@keyframes fg{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.rp.is-jack.done-spin .trace{opacity:1;transition:opacity .5s .25s}
.rp.is-jack.done-spin .ringw .fg{stroke:#d6bd86;filter:drop-shadow(0 0 5px rgba(214,189,134,.3))}
.rp.is-jack.done-spin .odo{filter:drop-shadow(0 0 14px rgba(214,189,134,.3))}
.rp.is-jack.done-spin .odo .strip span{background:linear-gradient(100deg,#b19c72 0%,#e3cf9f 30%,#fbf6ea 42%,#e3cf9f 54%,#b19c72 80%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:goldShine 3.2s linear .4s infinite}
.rp.is-jack .win{font-size:15px;color:transparent;background:linear-gradient(100deg,#9a8864 0%,#d6bd86 24%,#f6efdf 31%,#d6bd86 42%,#9a8864 62%,#d6bd86 82%,#9a8864 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text}
.rp.is-jack.done-spin .win{animation:slam .55s cubic-bezier(.2,1.4,.4,1) .12s forwards,goldShine 2.6s linear .7s infinite}
@keyframes goldShine{from{background-position:100% 0}to{background-position:-150% 0}}
/* projecteur pendant le suspense */
.rp .spot{position:absolute;inset:-14px;z-index:15;pointer-events:none;background:radial-gradient(circle 112px at calc(var(--sx,96px) + 14px) calc(var(--sy,80px) + 14px),transparent 0,transparent 60%,rgba(0,0,0,.72) 100%);opacity:0;transition:opacity .45s ease}
.rp.spinning .spot{opacity:1}
/* critères */
.crg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:9px}
.rp .cr .row{display:flex;justify-content:space-between;font-size:11.5px}
.rp .cr .row span{color:#8f8f8f;transition:color .3s}
.rp .cr.on .row span{color:#fff}
.rp .cr .row b{font-variant-numeric:tabular-nums}
.rp .cr .pop{display:inline-block}
.rp .cr.done .pop{animation:pop2 .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{40%{transform:scale(1.35)}100%{transform:none}}
.rp .of{color:#5f5f5f;font-weight:500}
.rp .bar{position:relative;height:3px;background:#191919;border-radius:3px;margin-top:5px;overflow:hidden}
.rp .bar i{display:block;height:100%;width:0;border-radius:3px}
.rp .cr.perfect .bar i{background:linear-gradient(90deg,#9a8864,#d6bd86)!important}
.rp .cr.perfect .bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,250,235,.6) 50%,transparent 65%);transform:translateX(-100%);animation:barShine 2.2s ease-in-out .15s infinite}
@keyframes barShine{0%{transform:translateX(-100%)}45%,100%{transform:translateX(100%)}}
.tagp{display:none;margin-left:5px;font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#d6bd86;border:1px solid rgba(214,189,134,.35);border-radius:10px;padding:1px 5px;vertical-align:1px}
.rp .cr.perfect .tagp{display:inline-block;animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
/* cases */
.stats2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.st{position:relative;background:#0f0f0f;border:1px solid #1c1c1c;border-radius:14px;padding:10px 9px 9px;display:flex;flex-direction:column;opacity:.45;transform:translateY(10px) scale(.98);transition:opacity .6s,transform .7s cubic-bezier(.3,1.35,.5,1),border-color .6s}
.st.on{opacity:1;transform:none;border-color:#262626}
.st::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,#e9d7aa,transparent);opacity:0;transform:scaleX(0)}
.st.on::before{animation:topGlint 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes topGlint{0%{opacity:0;transform:scaleX(0)}35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
.st small{display:block;font-size:10px;color:#8a8a8a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{display:flex;align-items:center;color:#f5f5f5;font-family:Outfit,Inter,sans-serif;font-weight:400;font-size:20px;line-height:1;margin-top:7px;height:1.2em;font-variant-numeric:tabular-nums}
.st .v b{font-weight:400}
.st .v em{font-style:normal;font-size:11px;color:#7a7a7a;margin-left:2px;align-self:flex-end;margin-bottom:.12em}
.st:not(.on) .v{opacity:.2}
.mcol{display:inline-block;width:.6em;height:1.2em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 24%,#000 76%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 24%,#000 76%,transparent 100%)}
.sic{color:#6a6a6a;transition:color .6s}
.st:not(.on) .sic{opacity:0}
.sic *{stroke-dasharray:60;stroke-dashoffset:60}
.st.on .sic{color:#d6bd86}
.st.on .sic *{animation:icoDraw 1s cubic-bezier(.4,0,.2,1) forwards}
.st.on .sic *:nth-child(2){animation-delay:.15s}
@keyframes icoDraw{to{stroke-dashoffset:0}}
.sic .hand{transform-box:view-box;transform-origin:12px 12px}
.st.on .sic .hand{animation:icoDraw .6s ease forwards,handSpin 1.3s cubic-bezier(.3,1.2,.5,1) .2s}
@keyframes handSpin{from{transform:rotate(-360deg)}to{transform:rotate(0)}}
.sic .shk{transform-box:view-box;transform-origin:8px 11px;transition:transform .5s cubic-bezier(.3,1.8,.5,1) 1s}
.st.on .sic .shk{transform:translateY(-1.5px) rotate(-16deg)}
.cap{margin-top:4px;font-size:9.5px;color:#6f6f6f;opacity:0;transform:translateY(4px);transition:opacity .5s .7s,transform .5s .7s;display:flex;align-items:center;gap:3px}
.st.on .cap{opacity:1;transform:none}
.cap.gold{color:#d6bd86}
.bar2{display:block;height:3px;border-radius:3px;background:#1a1a1a;margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#9a8864,#d6bd86)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:#1f1f1f;transition:background .3s,box-shadow .3s,transform .45s cubic-bezier(.3,1.9,.5,1)}
.st.on .dots i{background:#333}
.st.on .dots i.ok{background:#d6bd86;box-shadow:0 0 8px rgba(214,189,134,.5);transform:scale(1.15)}
.coin{position:absolute;left:50%;top:0;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7f0de,#d6bd86 50%,#8a7450);box-shadow:inset 0 0 0 1.5px rgba(255,250,235,.35),0 0 5px rgba(214,189,134,.3);opacity:0;pointer-events:none;z-index:6}
.rp.j3 .coin{animation:coin .6s cubic-bezier(.55,0,.8,.3) forwards;animation-delay:var(--d)}
@keyframes coin{0%{opacity:0;transform:translate(var(--x),-110px) rotateY(0)}12%{opacity:1}88%{opacity:1;transform:translate(0,16px) rotateY(720deg) scale(.85)}100%{opacity:0;transform:translate(0,22px) rotateY(760deg) scale(.6)}}
.rp.j3 .revc{border-color:#2e2a22}
.rp.j3 .revc b{color:#efe4c8}
/* meilleur message : carte qui se retourne */
.flip{perspective:1100px;height:134px}
.flin{position:relative;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.5,1)}
.rp.j4 .flin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;box-sizing:border-box;overflow:hidden}
.face.front{transform:rotateY(180deg);background:#0f0f0f;border:1px solid #1c1c1c;padding:12px 14px}
.face.front h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a;margin:0 0 8px;font-weight:600}
.face.front .q{background:#ededed;color:#0a0a0a;border-radius:16px;border-bottom-right-radius:5px;padding:8px 12px;line-height:1.4;margin-left:auto;max-width:88%;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.face.front p{font-size:11.5px;margin:7px 0 0;line-height:1.4;color:#9a9a9a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.face.back{background:repeating-linear-gradient(45deg,rgba(214,189,134,.045) 0 1px,transparent 1px 12px),repeating-linear-gradient(-45deg,rgba(214,189,134,.045) 0 1px,transparent 1px 12px),#0f0f0f;border:1px solid #26231d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#d6bd86}
.face.back::before{content:"";position:absolute;inset:9px;border:1px solid rgba(214,189,134,.15);border-radius:12px}
.face.back small{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.face.back svg{filter:drop-shadow(0 0 5px rgba(214,189,134,.35));animation:twk 2.4s ease-in-out infinite}
@keyframes twk{50%{transform:scale(1.15) rotate(45deg)}}
.face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,250,235,.08) 50%,transparent 65%);transform:translateX(-120%)}
.rp.j4 .face.front::after{animation:fsh 1.2s ease-out .8s forwards}
@keyframes fsh{to{transform:translateX(120%)}}
/* boutons */
.rp-actions{display:flex;flex-direction:column;gap:6px}
.again{width:100%;height:48px;border:0;border-radius:14px;background:#ededed;color:#0a0a0a;font:inherit;font-weight:700;font-size:14px;position:relative;overflow:hidden;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .6s cubic-bezier(.3,1.4,.5,1)}
.again::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(214,189,134,.35) 50%,transparent 65%);transform:translateX(-100%);animation:btnS 3s ease-in-out 1s infinite}
@keyframes btnS{0%{transform:translateX(-100%)}35%,100%{transform:translateX(100%)}}
.rp.j5 .again{opacity:1;transform:none;animation:glowP 2.4s ease-in-out .6s infinite}
@keyframes glowP{0%,100%{box-shadow:0 0 0 0 rgba(214,189,134,0)}50%{box-shadow:0 0 0 4px rgba(214,189,134,.07),0 0 26px rgba(214,189,134,.16)}}
.more{background:transparent;border:0;color:#8f8f8f;font:inherit;font-size:12.5px;padding:8px;opacity:0;transition:opacity .5s .3s}
.more:hover{color:var(--text)}
.rp.j5 .more{opacity:1}
.sndon{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:inline-flex;align-items:center;gap:8px;background:#ededed;color:#0a0a0a;border:0;border-radius:24px;padding:11px 18px;font:inherit;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:sndIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sndIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.skip{position:absolute;right:10px;top:10px;z-index:20;background:#161616;border:1px solid #2a2a2a;color:#8f8f8f;border-radius:20px;padding:6px 12px;font-size:12px}
.rp-detail .card{padding:20px}
/* affichage direct (historique) : pas d'animations d'entrée */
.rp.static .coin,.rp.static .ripple,.rp.static .flashg{display:none}
.rp.static .win{opacity:1;animation:none!important}
.rp.is-jack.static .win{animation:goldShine 2.6s linear infinite!important}
.rp.static .hero{animation:none!important}
.rp.static .halo{opacity:1;transform:none;animation:none!important}
.rp.static .st,.rp.static .cap,.rp.static .flin,.rp.static .again,.rp.static .more,.rp.static .cmpv,.rp.static .verdict{transition:none!important}
.rp.static .st::before,.rp.static .sic *,.rp.static .face.front::after{animation:none!important;stroke-dashoffset:0}
.rp.static .tagp{animation:none!important}
.rp.static .again{animation:none!important}
/* encadré éthique */
.eflag{display:flex;gap:12px;align-items:flex-start;background:#150f0f;border:1px solid #3d2424;border-radius:16px;padding:13px 15px;color:#d99a9a}
.eflag svg{flex-shrink:0;margin-top:1px}
.eflag b{display:block;color:#e8b4b4;font-size:12.5px;margin-bottom:3px}
.eflag p{margin:0;font-size:12.5px;line-height:1.5;color:#bfa3a3}
/* analyse détaillée */
.rp .rp-detail{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.rp.j5 .rp-detail,.rp.static .rp-detail{opacity:1;transform:none}
.dh{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#7a7a7a;margin:6px 0 2px}
.dh::after{content:"";flex:1;height:1px;background:#1f1f1f}
.dgrid{display:grid;grid-template-columns:1fr;gap:14px}
.rp .dcard{padding:18px 20px}
.rp .dcard h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 10px}
.rp .dcard ul{margin:0;padding-left:18px;line-height:1.6;font-size:13.5px;color:#d0d0d0}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.g{background:#5fd3a2}.dot.o{background:#c99a62}
.cgrid{display:grid;grid-template-columns:1fr;gap:4px 24px}
details.dcard summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
details.dcard summary::-webkit-details-marker{display:none}
details.dcard summary h2{margin:0!important}
details.dcard summary::after{content:"Afficher";font-size:12px;color:#8f8f8f}
details.dcard[open] summary::after{content:"Masquer"}
details.dcard[open] summary{margin-bottom:12px}

/* ===================== Rapport — ordinateur ===================== */
@media(min-width:1000px){
  #reportScreen .wrap{padding-top:28px;padding-bottom:40px}
  .rp-top{max-width:1120px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;
    grid-template-areas:"hero stats" "crits best" "act act"}
  .rp.has-flag .rp-top{grid-template-areas:"hero stats" "flag flag" "crits best" "act act"}
  .rp:not(.has-best) .rp-top{grid-template-areas:"hero stats" "crits crits" "act act"}
  .rp.has-flag:not(.has-best) .rp-top{grid-template-areas:"hero stats" "flag flag" "crits crits" "act act"}
  .rp .hero{grid-area:hero;padding:24px 28px;gap:28px}
  .rp .eflag{grid-area:flag}
  .rp .crits{grid-area:crits;padding:20px 22px}
  .rp .stats2{grid-area:stats;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .rp .flip{grid-area:best;height:auto;min-height:190px}
  .rp .rp-actions{grid-area:act;flex-direction:row;justify-content:center;align-items:center;gap:18px;margin-top:4px}
  .rp .again{width:340px}
  .rp .more{display:none}
  .rp .ringw{width:156px;height:156px}
  .rp .ringw svg{width:156px;height:156px}
  .odo{font-size:56px}
  .rp .num small{font-size:12px}
  .halo,.ripple{left:106px}
  .ripple{width:156px;height:156px;margin:-78px 0 0 -78px}
  .flashg{background:radial-gradient(circle at 106px 50%,rgba(239,228,200,.3),rgba(214,189,134,.07) 35%,transparent 65%)}
  .rp .win{font-size:20px;letter-spacing:.22em;line-height:1.25}
  .rp .verdict{font-size:14px;max-width:440px}
  .cmpv{font-size:12px;margin-top:12px}
  .rp .card h3{font-size:13px;margin-bottom:14px}
  .crg{row-gap:16px;column-gap:28px}
  .rp .cr .row{font-size:13px}
  .rp .bar{height:4px;margin-top:7px}
  .tagp{font-size:9px}
  .st{padding:16px 16px 14px;border-radius:16px}
  .st .v{font-size:30px;margin-top:12px}
  .st .v em{font-size:13px}
  .st small{font-size:12px;margin-top:4px}
  .sic{width:18px;height:18px}
  .bar2{margin-top:10px;height:4px}
  .dots{margin-top:10px}.dots i{width:7px;height:7px}
  .cap{font-size:11px;margin-top:7px}
  .coin{width:16px;height:16px;margin-left:-8px}
  .face.front{padding:20px 22px;display:flex;flex-direction:column}
  .face.front h3{font-size:11px;margin-bottom:14px}
  .face.front .q{font-size:14.5px;padding:11px 15px;-webkit-line-clamp:4}
  .face.front p{font-size:13px;margin-top:12px;-webkit-line-clamp:3}
  .face.back small{font-size:10.5px}
  .face.back svg{width:32px;height:32px}
  .rp-detail{max-width:1120px;margin-top:30px}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dwide{grid-column:1/-1}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .eflag{padding:16px 20px}
  .eflag p,.eflag b{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.rp *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-area">

<!-- ============ ACCUEIL ============ -->
<div id="homeScreen">
  <div class="wrap">
    <div class="pagehead"><div><div class="eyebrow">Formation</div><h1>Simu Chatter</h1></div></div>
    <div class="grid">
      <div class="card">
        <h2>1. Profil du fan</h2>
        <div class="personas" id="personas"></div>
      </div>
      <div class="card">
        <h2>2. Session</h2>
        <label>Créatrice incarnée</label>
        <select id="model"></select>
        <div class="notice" id="modelInfo" style="margin-top:8px"></div>
        <label>Difficulté</label>
        <select id="difficulty">
          <option value="facile">Facile — fan patient et indulgent</option>
          <option value="normal" selected>Normal — réaliste</option>
          <option value="difficile">Difficile — exigeant, décroche vite</option>
        </select>
        <button class="btn" id="startBtn" style="width:100%;margin-top:18px">Lancer la simulation</button>
        <div class="err" id="startErr"></div>
        <div class="notice" id="quota"></div>
      </div>
    </div>
    <div class="card" style="margin-top:20px">
      <h2>Mes sessions</h2>
      <div id="history"></div>
    </div>
  </div>
</div>

<!-- ============ CHAT ============ -->
<div id="chatScreen" class="hidden">
  <div class="topbar">
    <div class="avatar" id="fanAvatar">?</div>
    <div class="who"><b id="fanName">Fan</b><span id="fanSub"></span></div>
    <div class="spacer"></div>
    <div class="stats">
      <div class="stat"><small>Revenu</small><b id="stRev">0 €</b></div>
      <div class="stat"><small>Tps réponse moy.</small><b id="stRt">—</b></div>
      <div class="stat"><small>Messages</small><b id="stMsgs">0</b></div>
    </div>
    <button class="btn ghost small" id="infoBtn" aria-expanded="false">Infos</button>
    <button class="btn ghost small" id="endBtn">Terminer & évaluer</button>
    <div class="imeter" id="imeter"><i id="imeterBar"></i></div>
  </div>
  <div class="main">
    <div class="chat">
      <div id="msgs"></div>
      <div class="composer">
        <button class="btn ghost" id="ppvBtn" title="Envoyer un contenu payant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"/></svg>PPV</button>
        <textarea id="input" placeholder="Écrire en tant que la créatrice…  (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)"></textarea>
        <button class="btn" id="sendBtn">Envoyer</button>
      </div>
    </div>
    <div class="side">
      <h3>Objectif</h3><div id="goal" style="line-height:1.5;font-size:13px"></div>
      <h3>Créatrice incarnée</h3><div id="creatorInfo" style="line-height:1.5;font-size:13px;color:var(--muted)"></div>
      <h3>Prix indicatifs</h3><div id="priceInfo" style="line-height:1.5;font-size:13px;color:var(--muted)"></div>
      <h3>Intérêt du fan</h3>
      <div class="meter" id="meterWrap" style="visibility:hidden"><div id="meter" style="width:50%"></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="showMeter" style="width:auto"> Afficher (mode débutant)</label>
      <h3>Coach</h3>
      <button class="btn ghost small" id="hintBtn" style="width:100%">💡 Demander un conseil (−3 pts)</button>
      <div id="hints"></div>
    </div>
  </div>
</div>

<!-- ============ RAPPORT ============ -->
<div id="reportScreen" class="hidden">
  <div class="wrap">
    <div id="repBody"></div></div>
</div>

<!-- PPV -->
<div class="modal hidden" id="ppvModal">
  <div class="card">
    <h2>Envoyer un PPV</h2>
    <label>Description du contenu (ce que voit le fan dans l'aperçu)</label>
    <textarea id="ppvDesc" rows="3" placeholder="ex. 3 photos en tenue de sport après ma séance, jamais postées"></textarea>
    <label>Prix (€)</label>
    <input id="ppvPrice" type="number" min="1" max="1000" value="15">
    <label>Message d'accompagnement (optionnel)</label>
    <input id="ppvMsg" placeholder="ex. je les ai prises rien que pour toi 🙈">
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn ghost small" id="ppvCancel">Annuler</button>
      <button class="btn small" id="ppvSend">Envoyer le PPV</button>
    </div>
  </div>
</div>

</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/common.js"></script>
<script src="/simu-fx.js"></script>
<script>
let PERSONAS = [], MODELS = [], selPersona = null, SIM = null, busy = false, chatterCount = 0;

/* ---------- Accueil ---------- */
async function init() {
  const me = await api("/api/me");
  renderShell("simu", me);
  $("quota").textContent = me.role === "admin" ? "Compte manager : pas de limite quotidienne." :
    `Simulations aujourd'hui : ${me.usedToday} / ${me.dailyLimit}`;
  [PERSONAS, MODELS] = await Promise.all([api("/api/personas"), api("/api/models")]);
  selPersona = selPersona || PERSONAS[0].id;
  renderPersonas();
  $("model").innerHTML = MODELS.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  showModel();
  loadHistory();
}
const FAN_COLORS = { nouveau: "#2c3a52", radin: "#3d3350", baleine: "#4a3b2a", froid: "#2d4440", agressif: "#4a2c32", fragile: "#3a3a46" };
const fanColor = id => FAN_COLORS[id] || "#333";
function renderPersonas() {
  $("personas").innerHTML = PERSONAS.map(p => `<div class="persona ${p.id === selPersona ? "sel" : ""}" data-id="${p.id}" role="button" tabindex="0" aria-pressed="${p.id === selPersona}">
    <span class="pav" style="background:${fanColor(p.id)}">${esc(p.name[0])}</span>
    <span class="pbody"><b>${esc(p.name)} · ${esc(p.label)}</b><span class="d">${esc(p.desc)}</span>
    <span class="lvl">${[1, 2, 3].map(n => `<i class="${n <= p.level ? "on" : ""}"></i>`).join("")}<span class="lvlt">${LEVEL[p.level][0]}</span></span></span></div>`).join("");
  document.querySelectorAll(".persona").forEach(el => {
    el.onclick = () => { selPersona = el.dataset.id; renderPersonas(); };
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } };
  });
}
function showModel() {
  const m = MODELS.find(x => x.id == $("model").value);
  $("modelInfo").innerHTML = m ? `${esc(m.style)}<br><br><b>Prix :</b> ${esc(m.prices)}` : "";
}
$("model").onchange = showModel;
async function loadHistory() {
  const h = await api("/api/my-sims");
  $("history").innerHTML = !h.length ? "<div style='color:var(--muted)'>Aucune session terminée pour l'instant.</div>" :
    `<div class="tablewrap"><table><tr><th>Date</th><th>Fan</th><th>Créatrice</th><th>Difficulté</th><th>Score</th><th>Revenu</th><th>Tps rép.</th></tr>` +
    h.map(r => `<tr class="click" data-id="${r.id}"><td>${fmtDate(r.started_at)}</td><td>${esc(r.persona)}</td><td>${esc(r.creator_name)}</td><td>${esc(r.difficulty)}</td>
      <td><b style="color:${scoreColor(r.score)}">${r.score}</b>/100</td><td>${r.revenue} €</td><td>${r.avgRt !== null ? r.avgRt + " s" : "—"}</td></tr>`).join("") + "</table></div>";
  document.querySelectorAll("#history tr.click").forEach(tr => tr.onclick = async () => showReport(await api("/api/sims/" + tr.dataset.id), false));
}

$("startBtn").onclick = async () => {
  FX.unlock();
  $("startBtn").disabled = true; $("startErr").textContent = "";
  $("startBtn").textContent = "Démarrage…";
  try {
    const r = await api("/api/sims", { body: { personaId: selPersona, difficulty: $("difficulty").value, modelId: $("model").value } });
    $("homeScreen").classList.add("leaving"); await sleep(260); $("homeScreen").classList.remove("leaving");
    openChat(r.sim);
    if (r.turn) await showTurn(r.turn);
    else sys("Le fan est inactif depuis 3 semaines. À vous d'ouvrir la conversation.");
    setBusy(false); $("input").focus();
  } catch (e) { $("startErr").textContent = e.message; }
  $("startBtn").disabled = false; $("startBtn").textContent = "Lancer la simulation";
};

/* ---------- Chat ---------- */
function openChat(sim) {
  SIM = sim; chatterCount = 0;
  $("homeScreen").classList.add("hidden"); $("chatScreen").classList.remove("hidden");
  $("msgs").innerHTML = ""; $("hints").innerHTML = "";
  $("fanName").textContent = sim.persona.name; $("fanAvatar").textContent = sim.persona.name[0];
  $("fanAvatar").style.background = fanColor(sim.persona.id); $("fanAvatar").classList.remove("off");
  $("fanSub").textContent = "en ligne · " + sim.persona.label; $("fanSub").className = "";
  shownRev = sim.revenue || 0;
  $("goal").textContent = sim.persona.goal;
  $("creatorInfo").innerHTML = `<b style="color:var(--text)">${esc(sim.creator_name)}</b><br>${esc(sim.creator_style)}`;
  $("priceInfo").textContent = sim.prices;
  sys(`Session démarrée — vous écrivez en tant que ${sim.creator_name}`);
  updateStats();
}
const scrollDown = () => { const m = $("msgs"); m.scrollTop = m.scrollHeight; };
function sys(t) { const d = document.createElement("div"); d.className = "sys"; d.textContent = t; $("msgs").appendChild(d); scrollDown(); }
// accusé de lecture sous le dernier message envoyé : « Envoyé », puis « Vu » quand le fan répond
function receipt() {
  document.querySelectorAll("#msgs .rcpt").forEach(r => r.remove());
  const r = document.createElement("div"); r.className = "rcpt"; r.textContent = "Envoyé"; $("msgs").appendChild(r);
}
function markSeen() { const r = document.querySelector("#msgs .rcpt:not(.seen)"); if (r) { r.textContent = "Vu"; r.classList.add("seen"); } }
function bubble(who, text) {
  if (who === "fan") markSeen();
  const d = document.createElement("div"); d.className = "msg " + (who === "fan" ? "fan" : "me");
  d.textContent = text; $("msgs").appendChild(d);
  if (who !== "fan") receipt();
  scrollDown();
}
const SPARKS = [[-70, -40], [70, -46], [-56, 30], [60, 34], [0, -70], [-90, 0], [92, -4], [26, 58], [-30, 62], [40, -64]];
function ppvCard(id, desc, price) {
  const d = document.createElement("div"); d.className = "ppv"; d.id = "ppv" + id;
  d.innerHTML = `<div class="pic"><div class="img"></div><div class="flash"></div>
      <div class="lk"><span class="ring"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="shackle" d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M5 11h14v10H5z"/></svg></span><b>${price} €</b></div>
      ${SPARKS.map(([x, y]) => `<span class="spark" style="--dx:${x}px;--dy:${y}px"></span>`).join("")}</div>
    <div class="info"><div>${esc(desc)}</div><div class="row2"><b>${price} €</b><span class="pst" id="ppvst${id}">En attente</span></div></div>`;
  $("msgs").appendChild(d); receipt(); scrollDown();
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }
const ppvAlias = {}; let pendingTmp = null;
function setPPV(id, status) {
  const key = ppvAlias[id] || id;
  if ((status === "acheté" || status === "refusé") && key === lastPPV) lastPPV = null;
  const el = $("ppvst" + key), card = $("ppv" + key); if (!el || !card) return;
  const map = { "acheté": ["Acheté", "bought"], "refusé": ["Refusé", "refused"], "en négociation": ["Négociation", "nego"], "remplacé": ["Remplacé", "replaced"] };
  const [t, c] = map[status] || ["En attente", ""];
  el.textContent = t; card.classList.remove("bought", "refused", "nego", "replaced"); if (c) card.classList.add(c);
}
function typing(on) {
  if (SIM && !SIM.left) { $("fanSub").textContent = on ? "en train d'écrire…" : "en ligne · " + SIM.persona.label; $("fanSub").className = on ? "typingtxt" : ""; }
  let t = $("typingEl");
  if (on && !t) { t = document.createElement("div"); t.id = "typingEl"; t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>"; $("msgs").appendChild(t); scrollDown(); }
  if (!on && t) t.remove();
}
let shownRev = 0, revRaf = null;
function animateRev(to) {
  const from = shownRev, t0 = performance.now(); shownRev = to; cancelAnimationFrame(revRaf);
  const el = $("stRev"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  const step = now => { const x = Math.min(1, (now - t0) / 900); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - x, 3))) + " €"; if (x < 1) revRaf = requestAnimationFrame(step); };
  revRaf = requestAnimationFrame(step);
}
function updateStats() {
  if (SIM.revenue !== shownRev) animateRev(SIM.revenue); else $("stRev").textContent = SIM.revenue + " €";
  $("stMsgs").textContent = chatterCount;
  $("stRt").textContent = SIM.avgRt !== null && SIM.avgRt !== undefined ? SIM.avgRt + " s" : "—";
  $("meter").style.width = SIM.interest + "%";
  $("meter").style.background = scoreColor(SIM.interest >= 60 ? 70 : SIM.interest >= 30 ? 50 : 0);
  $("meterWrap").style.visibility = $("showMeter").checked ? "visible" : "hidden";
  const c = SIM.interest >= 75 ? "#3ccf91" : SIM.interest >= 45 ? "#d9d9d9" : "#c99a62";
  $("imeter").classList.toggle("show", $("showMeter").checked);
  $("imeterBar").style.width = SIM.interest + "%"; $("imeterBar").style.background = c; $("imeterBar").style.color = c;
}
$("showMeter").onchange = () => SIM && updateStats();
$("infoBtn").onclick = () => { const o = document.querySelector(".side").classList.toggle("open"); $("infoBtn").setAttribute("aria-expanded", o); $("infoBtn").textContent = o ? "Fermer" : "Infos"; };
if (window.innerWidth < 700) { $("input").placeholder = "Écrire en tant que la créatrice…"; $("endBtn").textContent = "Évaluer"; }
function setBusy(b) { busy = b; ["sendBtn", "ppvBtn", "hintBtn"].forEach(id => $(id).disabled = b || SIM?.left); }

async function showTurn(turn) {
  for (let i = 0; i < turn.replies.length; i++) {
    typing(true); await sleep(turn.replies[i].delay); typing(false);
    bubble("fan", turn.replies[i].text);
  }
  if (turn.ppv) {
    setPPV(turn.ppv.id, turn.ppv.status);
    if (turn.ppv.status === "acheté") { FX.sound.sale(); toast(`PPV acheté · +${turn.ppv.price} €`); try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} }
  }
  SIM.revenue = turn.revenue; SIM.interest = turn.interest;
  if (turn.left) { SIM.left = true; $("fanAvatar").classList.add("off"); $("fanSub").textContent = "hors ligne"; $("fanSub").className = ""; sys("Le fan a quitté la conversation. Cliquez sur « Terminer & évaluer »."); }
  updateStats();
}
// Tps de réponse : recalculé côté serveur, on l'affiche après chaque tour
async function refreshRt() { try { const s = await api("/api/sims/" + SIM.id); SIM.avgRt = s.avgRt; updateStats(); } catch (e) {} }

async function act(path, body, before) {
  if (busy || SIM.left) return;
  setBusy(true);
  before && before();
  await sleep(400); typing(true);
  try {
    const turn = await api(`/api/sims/${SIM.id}/${path}`, { body });
    if (turn.ppvId && pendingTmp) { ppvAlias[turn.ppvId] = pendingTmp; pendingTmp = null; }
    typing(false);
    await showTurn(turn);
    refreshRt();
  } catch (e) { typing(false); sys("⚠️ " + e.message); }
  setBusy(false);
  if (!SIM.left) $("input").focus();
}

function send() {
  const text = $("input").value.trim(); if (!text || busy) return;
  FX.unlock();
  act("message", { text }, () => { $("input").value = ""; bubble("me", text); chatterCount++; updateStats(); });
}
$("sendBtn").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

$("ppvBtn").onclick = () => { if (!busy && !SIM.left) { $("ppvModal").classList.remove("hidden"); $("ppvDesc").focus(); } };
$("ppvCancel").onclick = () => $("ppvModal").classList.add("hidden");
let lastPPV = null;
$("ppvSend").onclick = () => {
  const desc = $("ppvDesc").value.trim(), price = Math.round(Number($("ppvPrice").value)), msg = $("ppvMsg").value.trim();
  if (!desc || !price || price < 1) return;
  $("ppvModal").classList.add("hidden");
  const tmpId = "tmp" + Date.now();
  act("ppv", { desc, price, msg }, () => {
    $("ppvDesc").value = ""; $("ppvMsg").value = "";
    if (lastPPV) setPPV(lastPPV, "remplacé");
    if (msg) { bubble("me", msg); chatterCount++; }
    ppvCard(tmpId, desc, price); lastPPV = tmpId; pendingTmp = tmpId; updateStats();
  });
};

$("hintBtn").onclick = async () => {
  if (busy) return; setBusy(true);
  const box = document.createElement("div"); box.className = "hint"; box.textContent = "Le coach réfléchit…"; $("hints").prepend(box);
  try { const r = await api(`/api/sims/${SIM.id}/hint`, { body: {} }); box.textContent = "💡 " + r.text; SIM.hints = r.hints; }
  catch (e) { box.textContent = e.message; }
  setBusy(false);
};

$("endBtn").onclick = async () => {
  if (busy) return;
  FX.unlock();
  setBusy(true); $("endBtn").disabled = true; sys("Évaluation en cours… (environ 20 secondes)");
  try { showReport(await api(`/api/sims/${SIM.id}/end`, { body: {} }), true); }
  catch (e) { sys("⚠️ " + e.message); }
  setBusy(false); $("endBtn").disabled = false;
};

/* ---------- Rapport ---------- */
async function showReport(sim, animate) {
  // score de la simulation précédente (pour « +12 vs dernière simu »)
  let prevScore = null;
  try { const h = await api("/api/my-sims"); const prev = h.filter(x => x.id !== sim.id && x.started_at < sim.started_at && x.score != null)[0]; prevScore = prev ? prev.score : null; } catch (e) {}
  ["homeScreen", "chatScreen"].forEach(id => $(id).classList.add("hidden"));
  $("reportScreen").classList.remove("hidden");
  window.scrollTo(0, 0);
  FX.report($("repBody"), sim, { animate, prevScore, onNew: newSession });
}
function newSession() { $("reportScreen").classList.add("hidden"); $("homeScreen").classList.remove("hidden"); lastPPV = null; window.scrollTo(0, 0); init(); }

init().catch(e => console.error(e));
</script>
</body>
</html>
