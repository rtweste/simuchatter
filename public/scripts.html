<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scripts — StellADS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/style.css">
<style>
@property --fxa{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--ac:#5fd3a2;--am:#f0b54a;--bd:#1f1f1f}
.main-area.scm{padding:0!important;height:100dvh;overflow:hidden}
.sc{height:100dvh;display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden;background:radial-gradient(900px 300px at 30% -120px,rgba(95,211,162,.07),transparent 70%),#0a0a0a}
.sc>.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}.sc>.stars i{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.sc>*{position:relative;z-index:1}
@keyframes spin{to{--fxa:360deg}}
.trace{position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--fxa),transparent 0 58%,var(--tc,#5fd3a2) 78%,#fff 86%,transparent 93%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:6;animation:spin 2.2s linear infinite}
.up{animation:up .7s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:#1a1a1a;border:1px solid #2e2e2e;border-bottom-width:2px;font:800 10.5px Inter;color:#cfcfcf}
.met{font-style:italic;background:linear-gradient(100deg,#fff,#8a8a8a 55%,#e6e6e6);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.cap{font:800 10px Inter;letter-spacing:.2em;text-transform:uppercase;color:#6a6a6a}
.rav{position:relative;display:inline-grid;place-items:center;border-radius:50%;flex:none}
.rav:before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from var(--fxa),var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
.rav>span{position:relative;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:Inter}
/* ---- en-tête ---- */
.hd{display:flex;align-items:flex-end;gap:18px;padding:26px 28px 16px;flex-wrap:wrap}
.hd h1{margin:6px 0 0;font:900 38px Inter;letter-spacing:-.045em;line-height:1.02}
.hd .act{margin-left:auto;display:flex;gap:8px}
.btn2{height:44px;padding:0 16px;border-radius:13px;border:1px solid #262626;background:#121212;color:#e8e8e8;font:800 13px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.btn2:hover{background:#1a1a1a}.btn2:active{transform:scale(.95)}
.btn2.w{background:#f5f5f5;color:#0a0a0a;border-color:#f5f5f5;box-shadow:0 10px 30px -10px rgba(255,255,255,.4)}.btn2.w:hover{background:#fff}
.btn2.g{background:#5fd3a2;color:#05261a;border-color:#5fd3a2;box-shadow:0 12px 30px -12px rgba(95,211,162,.7)}
.btn2.ai{background:linear-gradient(135deg,rgba(95,211,162,.16),rgba(125,180,255,.12));border-color:rgba(95,211,162,.35);color:#bff3dc}
.btn2.dl:hover{color:#ff8a8a;border-color:#4a2626}
.btn2[disabled]{opacity:.4;cursor:not-allowed}
/* ---- chiffres ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 28px 16px}
.kpi{position:relative;padding:13px 15px;border-radius:16px;background:#101010;border:1px solid var(--bd);overflow:hidden}
.kpi small{display:block;font:800 9.5px Inter;letter-spacing:.16em;color:#6a6a6a;text-transform:uppercase}
.kpi b{display:block;font:900 24px Inter;letter-spacing:-.04em;margin-top:6px}
.kpi span{display:block;font:600 11.5px Inter;color:#7a7a7a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hl{background:linear-gradient(135deg,rgba(95,211,162,.12),rgba(95,211,162,.02) 70%),#0f1311;border-color:rgba(95,211,162,.25)}.kpi.hl b{color:#eafff6}
/* ---- espace de travail ---- */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr) 440px;gap:0;border-top:1px solid #181818}
.side{border-right:1px solid #181818;padding:16px 12px;overflow:auto;scrollbar-width:thin}
.side .cap{margin:4px 8px 8px}
.fl{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;border:0;background:none;color:#bdbdbd;font:700 13px Inter;text-align:left;cursor:pointer;transition:background .2s}
.fl:hover{background:#141414}.fl.on{background:#191919;color:#fff;box-shadow:inset 0 0 0 1px #262626}
.fl .n{margin-left:auto;font:800 11px Inter;color:#6a6a6a}
.fl .d{width:8px;height:8px;border-radius:50%;flex:none}
.side hr{border:0;border-top:1px solid #181818;margin:12px 4px}
.mid{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.srch{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid #232323;background:#0f0f0f;color:#666}
.srch input{flex:1;min-width:0;border:0;background:none;color:#eee;font:500 13.5px Inter;outline:none;padding:0}
.sort{display:flex;padding:3px;border-radius:11px;background:#121212;border:1px solid #222}
.sort button{height:32px;padding:0 11px;border-radius:8px;border:0;background:none;color:#8a8a8a;font:800 11.5px Inter;cursor:pointer;white-space:nowrap}
.sort button.on{background:#f5f5f5;color:#0a0a0a}
.lst{flex:1;min-height:0;overflow:auto;padding:4px 18px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-content:start;scrollbar-width:thin}
.card{position:relative;display:flex;flex-direction:column;gap:9px;padding:14px 15px 12px;border-radius:18px;border:1px solid #1f1f1f;background:#101010;color:#e8e8e8;text-align:left;cursor:pointer;transition:border-color .25s,transform .35s cubic-bezier(.3,1.4,.5,1),background .25s;animation:cIn .6s cubic-bezier(.16,1,.3,1) both}
@keyframes cIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.card:hover{border-color:#2c2c2c;transform:translateY(-2px)}
.card.on{background:linear-gradient(135deg,rgba(95,211,162,.08),transparent 60%),#121212;border-color:rgba(95,211,162,.3)}
.card .t{display:flex;align-items:center;gap:8px;min-width:0}
.card .t b{font:900 14px Inter;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pin{color:#e8c27a;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font:800 9.5px Inter;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,#fff);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.card .body{font:500 13px/1.5 Inter;color:#a8a8a8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
mark{background:rgba(95,211,162,.14);color:var(--ac);border-radius:4px;padding:0 3px;font-weight:700}
.card .ft{display:flex;align-items:center;gap:10px;margin-top:auto;font:700 11px Inter;color:#6a6a6a}
.card .ft .u b{color:#e8e8e8;font-weight:900}
.spark{display:flex;align-items:flex-end;gap:2px;height:20px;margin-left:auto}
.spark i{width:4px;border-radius:2px;background:#2a3a33;min-height:2px}.spark i.h{background:var(--ac);box-shadow:0 0 6px rgba(95,211,162,.6)}
.whos{display:inline-flex}.whos .w{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:900 8px Inter;border:2px solid #101010;margin-left:-5px;background:color-mix(in srgb,var(--c) 22%,#0f0f0f);color:var(--c)}.whos .w:first-child{margin-left:0}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:#7a7a7a;font:600 13px/1.6 Inter}.empty b{display:block;color:#fff;font:900 18px Inter;margin-bottom:6px}
/* ---- éditeur ---- */
.ed{border-left:1px solid #181818;display:flex;flex-direction:column;min-height:0;background:#0b0b0b}
.ed .in{flex:1;min-height:0;overflow:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.ed h2{margin:0;font:900 20px Inter;letter-spacing:-.03em}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{margin:0;font:800 9.5px Inter;letter-spacing:.16em;text-transform:uppercase;color:#6a6a6a}
.fld input,.fld textarea{border-radius:12px;border:1px solid #242424;background:#0f0f0f;color:#eee;font:500 14px Inter;padding:11px 12px;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld textarea:focus{border-color:#3a3a3a;box-shadow:0 0 0 4px rgba(255,255,255,.03);outline:none}
.fld textarea{min-height:130px;resize:vertical;line-height:1.55}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vars{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vars button{height:26px;padding:0 9px;border-radius:999px;border:1px solid rgba(95,211,162,.3);background:rgba(95,211,162,.08);color:var(--ac);font:800 11px Inter;cursor:pointer}
.vars .cnt{margin-left:auto;font:700 11px Inter;color:#5f5f5f}
.scope{display:flex;gap:6px;flex-wrap:wrap}
.scope button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 5px;border-radius:999px;border:1px solid #242424;background:#121212;color:#9a9a9a;font:800 12px Inter;cursor:pointer;transition:all .3s}
.scope button.all{padding:0 12px}
.scope button.on{background:#f5f5f5;color:#0a0a0a;border-color:#f5f5f5}
/* aperçu dans la bulle Néon de la messagerie */
.pv{position:relative;border-radius:18px;border:1px solid #1c1c1c;background:radial-gradient(400px 160px at 50% 0%,rgba(95,211,162,.07),transparent 70%),#0a0a0a;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.pv .cap{margin:0}
.pv .fan{display:flex;align-items:flex-end;gap:8px}
.pv .fav{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:900 10px Inter;background:hsl(140 45% 30%);color:#fff;flex:none}
.pv .bf{padding:8px 12px;border-radius:16px;border-bottom-left-radius:5px;background:#141414;border:1px solid #1f1f1f;font:500 13.5px Inter;color:#ddd}
.pv .me{align-self:flex-end;max-width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pv .bm{position:relative;padding:9px 13px;border-radius:16px;border-bottom-right-radius:5px;background:#0d1512;color:#d9ffee;font:500 14px/1.45 Inter;white-space:pre-wrap;word-break:break-word;box-shadow:0 0 22px -8px rgba(95,211,162,.55)}
.pv .bm:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#5fd3a2,#2aa6a0 50%,rgba(95,211,162,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pv .bm.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.96);opacity:.6}}
.pv .lbl{font:800 9px Inter;letter-spacing:.14em;text-transform:uppercase;color:#6a6a6a;display:inline-flex;align-items:center;gap:5px}.pv .lbl i{width:6px;height:6px;border-radius:50%;background:#b49cff;box-shadow:0 0 8px #b49cff}
.aiv{display:grid;gap:8px}
.aiv .v{position:relative;display:flex;flex-direction:column;gap:5px;padding:11px 13px;border-radius:14px;border:1px solid #262626;background:#121212;color:#eee;text-align:left;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.5,1),border-color .25s;animation:aiIn .7s cubic-bezier(.16,1,.3,1) both}
@keyframes aiIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.aiv .v:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.aiv .v .a{font:900 9.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.aiv .v .x{font:500 13.5px/1.45 Inter;white-space:pre-wrap}
.aiv .sk{height:60px;border-radius:14px;background:linear-gradient(90deg,#141414 25%,#1b1b1b 50%,#141414 75%);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.goal{display:flex;gap:6px;flex-wrap:wrap}
.goal button{height:28px;padding:0 10px;border-radius:999px;border:1px solid #262626;background:#121212;color:#9a9a9a;font:700 11.5px Inter;cursor:pointer}
.goal button.on{border-color:rgba(95,211,162,.45);color:var(--ac);background:rgba(95,211,162,.08)}
.meta{font:600 11.5px/1.5 Inter;color:#6a6a6a}.meta b{color:#cfcfcf}
.ed .ft{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #181818;background:#0a0a0a}
.ed .ft .sv{margin-left:auto}
.saved{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:rgba(95,211,162,.12);border:1px solid rgba(95,211,162,.35);color:var(--ac);font:800 11.5px Inter;animation:svd 2.2s cubic-bezier(.3,1.4,.5,1) both;align-self:center}
@keyframes svd{0%{opacity:0;transform:scale(.6)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.ednone{flex:1;display:grid;place-items:center;text-align:center;color:#6a6a6a;font:600 13px/1.6 Inter;padding:30px}
.ednone b{display:block;color:#fff;font:900 16px Inter;margin-bottom:4px}
/* ---- import ---- */
.mod{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;animation:fd .25s both}
@keyframes fd{from{opacity:0}}
.box{width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:22px;background:#0f0f0f;border:1px solid #262626;box-shadow:0 40px 100px -20px #000;overflow:hidden;animation:bx .5s cubic-bezier(.16,1,.3,1) both}
@keyframes bx{from{transform:translateY(20px) scale(.98);opacity:0}}
.box .h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #1c1c1c}
.box .h b{font:900 18px Inter;letter-spacing:-.03em}
.box .h .x{margin-left:auto}
.tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:#151515;border:1px solid #222}
.tabs button{height:32px;padding:0 12px;border-radius:9px;border:0;background:none;color:#8f8f8f;font:800 12px Inter;cursor:pointer}.tabs button.on{background:#ededed;color:#0a0a0a}
.box .c{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.box textarea{min-height:200px;border-radius:12px;border:1px solid #242424;background:#0b0b0b;color:#eee;font:500 13.5px/1.55 Inter;padding:12px;resize:vertical}
.hint{font:600 12px/1.55 Inter;color:#7a7a7a}.hint code{color:var(--ac);background:rgba(95,211,162,.1);padding:1px 5px;border-radius:5px;font:700 11.5px Inter}
.irow{margin:0;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#121212;border:1px solid #1f1f1f;cursor:pointer}
.irow input{margin-top:3px;width:16px;height:16px;accent-color:#5fd3a2;flex:none}
.irow b{display:block;font:800 13px Inter}.irow small{display:block;font:500 12.5px/1.45 Inter;color:#9a9a9a;margin-top:2px;white-space:pre-wrap}
.irow.dup{opacity:.5}
.box .f{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid #1c1c1c;flex-wrap:wrap}
.box .f .sel{display:flex;align-items:center;gap:8px;font:700 12px Inter;color:#8a8a8a}
.box .f input,.box .f select{height:34px;border-radius:10px;border:1px solid #262626;background:#151515;color:#eee;font:600 12.5px Inter;padding:0 10px}
@media(max-width:1280px){.ws{grid-template-columns:200px minmax(0,1fr) 380px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:980px){.main-area.scm,.sc{height:auto;min-height:100dvh;overflow:visible}.ws{grid-template-columns:minmax(0,1fr)}.bar{flex-wrap:wrap}.srch{flex:1 1 100%}.ed .in{overflow:visible}.r2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ed .ft{flex-wrap:wrap}.ed .ft .kbd,.hd .kbd,.srch .kbd{display:none}.ed .ft .sv{flex:1;justify-content:center}.side{border-right:0;border-bottom:1px solid #181818;display:flex;gap:6px;overflow-x:auto}.side .cap,.side hr{display:none}.fl{width:auto;white-space:nowrap}.ed{border-left:0;border-top:1px solid #181818}.hd h1{font-size:30px}.lst{grid-template-columns:1fr}}
@media(max-width:900px){.main-area.scm{padding-bottom:90px!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-area scm">
<div class="sc" id="sc">
  <div class="stars" id="stars"></div>
  <div class="hd up"><div><div class="cap">Manager</div><h1>Scripts <em class="met">de l'équipe.</em></h1></div>
    <div class="act"><button class="btn2" id="impB"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Importer</button>
      <button class="btn2 w" id="newB">+ Nouveau script <span class="kbd">N</span></button></div></div>
  <div class="kpis up" style="animation-delay:.06s" id="kp"></div>
  <div class="ws">
    <nav class="side" id="side" aria-label="Filtres"></nav>
    <section class="mid"><div class="bar"><label class="srch"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Chercher dans les titres et les textes…"><span class="kbd">⌘K</span></label>
      <div class="sort" id="sort"><button data-s="use" class="on">Plus utilisés</button><button data-s="new">Récents</button><button data-s="az">A → Z</button></div></div>
      <div class="lst" id="lst"></div></section>
    <aside class="ed" id="ed"></aside>
  </div>
</div>
</main>
</div>
<script src="/common.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const SV = (p, s = 16, w = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = { pin: '<path d="M12 17v5"/><path d="M8 3h8l-1.5 6L18 12.5H6L9.5 9z"/>', spark: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M12 7.5c.6 2.4 2.1 3.9 4.5 4.5-2.4.6-3.9 2.1-4.5 4.5-.6-2.4-2.1-3.9-4.5-4.5 2.4-.6 3.9-2.1 4.5-4.5z"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>' };
const PAL = [["#b49cff", "#5b46b0", "#e2d8ff"], ["#7db4ff", "#2f5fa8", "#dbeaff"], ["#5fd3a2", "#1f6b4f", "#d2f7e7"], ["#f0b54a", "#7a5418", "#ffeccb"], ["#ff8fb1", "#8a2f4c", "#ffd9e5"], ["#6fe0e0", "#1d6b6b", "#d4f7f7"]];
const pal = n => PAL[[...String(n || "?")].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 9973, 7) % PAL.length];
const rav = (letter, size, p) => `<span class="rav" style="width:${size}px;height:${size}px;--c1:${p[0]};--c2:${p[1]};--c3:${p[2]}"><span style="width:${size - 6}px;height:${size - 6}px;font-size:${Math.max(8, Math.round(size / 2.6))}px;background:color-mix(in srgb,${p[0]} 22%,#0f0f0f);color:${p[0]}">${esc(letter)}</span></span>`;
const ago = t => { if (!t) return ""; const m = (Date.now() - t) / 60e3; return m < 1 ? "à l'instant" : m < 60 ? `il y a ${Math.round(m)} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j`; };
const hl = t => esc(t).replace(/\{(pr[ée]nom|cr[ée]atrice)\}/gi, m => `<mark>${m}</mark>`);

function parsePaste(t) {
  return String(t || "").replace(/\r/g, "").split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean).map(b => {
    let lines = b.split("\n"), title = "", cat = "";
    const m = lines[0].match(/^\s*\[([^\]]{1,30})\]\s*(.*)$/); if (m) { cat = m[1].trim(); lines[0] = m[2]; if (!lines[0].trim()) lines.shift(); }
    if (lines.length > 1 && (/^#+\s*/.test(lines[0]) || /:\s*$/.test(lines[0]))) title = lines.shift().replace(/^#+\s*/, "").replace(/:\s*$/, "").trim();
    return { title: title.slice(0, 80), cat, body: lines.join("\n").trim().slice(0, 2000) };
  }).filter(x => x.body);
}
